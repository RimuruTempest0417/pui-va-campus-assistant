name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 設定 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 小程序專案結構檢查
        run: node scripts/check-project.mjs

      - name: 檢查所有 JSON 可解析
        run: |
          fail=0
          for f in $(git ls-files '*.json'); do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "❌ $f"; fail=1; }
          done
          exit $fail

      - name: 資料層自我檢查（示範模式 60 項）
        run: node scripts/check-data-layer.mjs

      - name: 三態一致（載入／空／失敗）
        run: node scripts/check-states.mjs

      - name: 文件一致性（版本徽章／規劃書／孤兒文件／幽靈路徑）
        run: node scripts/check-docs.mjs

      - name: 繁簡介面（pick 抽樣／對照表殘留／L.* 供應）
        run: node scripts/check-i18n.mjs

      - name: 首頁今日待辦（訪客不顯示／單支失敗只降級那一行／家長用子女數字）
        run: node scripts/check-todo.cjs

      - name: 檢查 API 契約（openapi.yaml）存在且非空
        run: test -s docs/openapi.yaml && echo "openapi.yaml OK"
