      responses:
        '200':
          description: 已還原
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  type: { type: string }
                  id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound', description: '不存在，或本來就沒被刪除（兩者不區分）' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/notices/{id}:
