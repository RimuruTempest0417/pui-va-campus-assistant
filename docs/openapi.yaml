openapi: 3.0.3
info:
  title: 培華校園助手 API
  version: 1.0.0
  description: |
    澳門培華中學「培華校園助手」小程序後端契約。
    認證：Authorization: Bearer <JWT>（/auth/login 除外）。
    錯誤格式：{ "error": { "code", "message", "details"? } }
servers:
  - url: https://api.example.edu.mo/api/v1
    description: 生產（已備案域名，待填）
  - url: http://127.0.0.1:3000/api/v1
    description: 本地開發
tags:
  - name: auth
  - name: items
  - name: events
  - name: menu
  - name: notices
  - name: uploads
  - name: parents
  - name: school
  - name: admin

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: 微信登入（code2Session）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: wx.login 取得的 code }
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password:
    post:
      tags: [auth]
      security: []
      summary: 帳號密碼登入（學生／家長／教職員共用；不檢查後台能力）
      description: |
        `/auth/login` 是微訊 code 換 token；`/admin/login` 只收有後台能力的角色。
        學生與家長沒有後台能力，在那裡永遠登不進去，所以改走這一支。
        帳號就是 `User.openid` 欄位（由後台建立或設定密碼）。
        帳號不存在與密碼錯誤回同一個訊息，避免探測；連續失敗會鎖一段時間。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string, description: 學號／職員帳號 }
                password: { type: string }
                code: { type: string, description: '已開兩步驗證時必填：6 位數或備用碼' }
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, enum: [SUPER_ADMIN, ADMIN, STAFF, TEACHER, PARENT, STUDENT] }
                  nickname: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/school:
    post:
      tags: [auth]
      security: []
      summary: 家校通帳密直接登入（不需微信授權、不需管理員先開帳號）
      description: |
        先向培華家校通（app.puiva.edu.mo）驗證這組帳密，通過才簽發本系統 JWT。
        使用者對應：`User.openid = "sc:" + 帳號`（微信 openid 不含冒號，兩邊不撞）；
        已存在就直接登入（角色不動，家長／老師由後台指派），不存在才建立 STUDENT。
        **密碼不落庫**：只換 token；要同步成績才另外走 `/school/link`（AES-256-GCM 加密保存）。
        連續失敗 5 次鎖 15 分鐘；帳號不存在與密碼錯誤回同一句話。
        家校通連不上回 503 `SCHOOL_UNAVAILABLE`（可改用校內帳號），不是密碼錯。
        **帳號前綴決定角色**（只在第一次建立時用）：`s…` → `STUDENT`、純數字或 `pv…` → `PARENT`、
        其他格式 → `STUDENT` 並回 `accountType: other`。家長登入時自動把「他看得到的學號」
        （家校通首頁列出的 ＋ 帳號本身的數字）建成 `parent_links`，**不需要管理員先綁定**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string, description: 家校通帳號（不含空白與冒號） }
                password: { type: string, description: 家校通密碼（只用於本次請求） }
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, enum: [SUPER_ADMIN, ADMIN, STAFF, TEACHER, PARENT, STUDENT] }
                  nickname: { type: string }
                  account: { type: string, description: '本系統帳號（sc:<家校通帳號>）' }
                  created: { type: boolean, description: 是否本次才建立 }
                  source: { type: string, enum: [school] }
                  accountType: { type: string, enum: [student, parent, other], description: 由帳號前綴判斷的類型；other 代表格式不在規範內（建成學生，等指示） }
                  children:
                    type: array
                    description: 家長本次自動對應到的子女（學生為空陣列；依定案一位家長帳號＝一位子女）
                    items:
                      type: object
                      properties:
                        studentId: { type: string }
                        studentNo: { type: string }
                        nickname: { type: string, nullable: true }
                  linkedChildren: { type: integer, description: 自動對應到的子女數（＝children.length；前端顯示「已對應 N 位」用這個） }
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      nickname: { type: string }
                      avatarUrl: { type: string, nullable: true }
                      role: { type: string }
                      grade: { type: string, nullable: true }
                      className: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: 家校通暫時連不上（SCHOOL_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      tags: [auth]
      summary: 當前使用者
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      summary: 更新暱稱／班級
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 64 }
                className: { type: string, maxLength: 32 }
                grade: { type: string, maxLength: 16 }
      responses:
        '200':
          description: 更新後的使用者
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /items:
    get:
      tags: [items]
      summary: 失物列表（篩選＋分頁）
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [LOST, FOUND] } }
        - { in: query, name: categoryId, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [OPEN, MATCHED, CLAIMED, CLOSED] } }
        - { in: query, name: q, schema: { type: string }, description: 標題／描述關鍵字 }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LostItem' }
    post:
      tags: [items]
      summary: 發布失物／拾獲
      description: |
        建立後會立刻做一次智能配對（規則見 GET /items/{id}/matches），
        對「另一半」的作者發一則站內通知（kind=ITEM），內容包含吻合原因與該筆紀錄的連結。
        同一位作者只收一則、不通知自己貼的紀錄；配對失敗不影響建立（仍回 201）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LostItemInput' }
      responses:
        '201':
          description: 建立成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostItem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /items/mine:
    get:
      tags: [items]
      summary: 我發布的失物
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LostItem' }

  /my/claims:
    get:
      tags: [items]
      summary: 我的認領申請（申請人自己看進度）
      description: |
        只回 JWT 本人的申請（claimantId 由 token 決定，不接受前端傳 id），
        新到舊、最多 50 筆；物品被軟刪除的不再出現。
        status：PENDING 待審核／APPROVED 已通過／REJECTED 未通過，handledAt 為處理時間。
      responses:
        '200':
          description: 我的申請清單（附物品摘要）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
                        createdAt: { type: string, format: date-time }
                        handledAt: { type: string, format: date-time, nullable: true }
                        item:
                          type: object
                          properties:
                            id: { type: string }
                            title: { type: string }
                            type: { type: string, enum: [LOST, FOUND] }
                            status: { type: string, enum: [OPEN, MATCHED, CLAIMED, CLOSED] }
                            place: { type: string }
                            happenedAt: { type: string, format: date-time }
                            categoryName: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /categories:
    get:
      tags: [items]
      summary: 分類清單（失物用）
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [LOST, FOUND] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        key: { type: string }
                        name: { type: string }
                        icon: { type: string, nullable: true }

  /items/{id}/matches:
    get:
      tags: [items]
      summary: 失物智能匹配（相反類型、加權評分）
      description: |
        加權：同分類 0.35、地點相似（pg_trgm > 0.4）0.25、時間差 3 天內 0.15、標題／描述相似 0.25。
        閘門：地點或文字至少要有一項像，否則不回傳；總分低於 0.45 也不回傳。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 推薦清單（最多 5 筆）
          content:
            application/json:
              schema:
                type: object
                properties:
                  minScore: { type: number, example: 0.45 }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        type: { type: string, enum: [LOST, FOUND] }
                        title: { type: string }
                        place: { type: string }
                        happenedAt: { type: string, format: date-time }
                        score: { type: number }
                        reasons:
                          type: array
                          items: { type: string, example: 同分類 }
        '404': { $ref: '#/components/responses/NotFound' }


  /items/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [items]
      summary: 失物詳情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [items]
      summary: 改狀態（作者本人，或具 item:moderate 者可代改）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, CLAIMED, CLOSED] }
      responses:
        '200':
          description: 修改後
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostItem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /items/{id}/claims:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [items]
      summary: 查看某件物品的認領申請（發布者本人或 item:review）
      description: |
        只有物品發布者本人，或具 item:review 能力（ADMIN 以上）的人看得到。
        其他人（含老師、STAFF）回 403，避免申請人的特徵描述外流。
      responses:
        '200':
          description: 申請清單（待審在前、同狀態按時間排序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ItemClaim' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [items]
      summary: 申請認領
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 300, description: 特徵描述，防冒領 }
      responses:
        '201':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemClaim' }
        '409':
          description: 已有人認領或本人已申請
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /claims/{id}:
    patch:
      tags: [items]
      summary: 審批認領申請（發布者本人或資訊管理員）
      description: |
        APPROVE 後物品轉為 CLAIMED，同物品其他待審申請自動 REJECTED。
        需要 JWT；非發布者且不具 item:review（ADMIN 以上）回 403 —— 老師與 STAFF 都不能審批。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string }, description: claim id }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
                note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 審批結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemClaim' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events:
    get:
      tags: [events]
      summary: 活動列表
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, FINISHED] } }
        - { in: query, name: clubId, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }

  /events/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [events]
      summary: 活動詳情（含我是否已報名）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Event'
                  - type: object
                    properties:
                      myStatus: { type: string, nullable: true, enum: [CONFIRMED, WAITLIST, CANCELLED, null] }
                      waitlistPos: { type: integer, nullable: true }
                      myCheckedIn: { type: string, format: date-time, nullable: true, description: 我自己的現場簽到時間（未簽到為 null） }
                      attachments:
                        type: array
                        description: W-38 活動附件（章程／場地圖）
                        items: { $ref: '#/components/schemas/EventAttachment' }
                      canManageAttachments: { type: boolean, description: 後端算好的旗標（老師只對自己開的活動為 true；前端不要重算） }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/signup:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [events]
      summary: 報名（名額樂觀鎖，滿員回 409）
      responses:
        '201':
          description: 報名成功或已進入候補
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSignup' }
        '409':
          description: EVENT_FULL 或 ALREADY_SIGNED_UP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [events]
      summary: 取消報名（觸發候補自動補位）
      responses:
        '204': { description: 已取消 }

  /events/mine:
    get:
      tags: [events]
      summary: 我的報名（含候補位置）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EventSignup' }

  /events/checkin:
    post:
      tags: [events]
      summary: 學生現場簽到（掃碼／手打 6 位碼）
      description: |
        只認簽到碼，**不接受前端傳來的 eventId**（否則改一個參數就能替別人簽到）。
        規則：簽到必須開放中、活動碼存在、本人是該活動的「正取」；
        候補與沒報名者一律 422。重複掃視為成功並回 `already: true`（不重複計數）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: '6 位碼，或 QR 內容 PVCHECKIN:123456' }
      responses:
        '200':
          description: 簽到成功（或 already=true 表示之前已簽）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  already: { type: boolean }
                  eventId: { type: string }
                  title: { type: string }
                  checkedInAt: { type: string, format: date-time }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /events/{id}/checkin:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [events]
      summary: 老師端簽到看板（需 event:checkin；老師只能看自己的活動）
      responses:
        '200':
          description: OK（未開放時 code 與 qrDataUrl 為 null）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCheckinState' }

  /events/{id}/checkin/open:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [events]
      summary: 開始簽到（每次開啟都換新碼，舊碼立刻失效）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCheckinState' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /events/{id}/checkin/close:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [events]
      summary: 結束簽到（碼留作紀錄但掃了就失效）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCheckinState' }

  /events/{id}/attendance:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [events]
      summary: 出席名單（正取在前；含候補供核對）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId: { type: string }
                  title: { type: string }
                  active: { type: boolean }
                  signed: { type: integer, description: 正取人數 }
                  checkedIn: { type: integer }
                  rate: { type: number, nullable: true, description: 出席率（%），沒有人報名時為 null }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        signupId: { type: string }
                        status: { type: string, enum: [CONFIRMED, WAITLIST] }
                        waitlistPos: { type: integer, nullable: true }
                        nickname: { type: string, nullable: true }
                        grade: { type: string, nullable: true }
                        className: { type: string, nullable: true }
                        checkedInAt: { type: string, format: date-time, nullable: true }

  /events/{id}/stats:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [events]
      summary: 活動報名統計（需 event:create；老師只能看自己的活動）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId: { type: string }
                  title: { type: string }
                  capacity: { type: integer }
                  unlimited: { type: boolean }
                  signed: { type: integer }
                  waitlisted: { type: integer }
                  cancelled: { type: integer }
                  checkedIn: { type: integer, description: 正取且已簽到的人數 }
                  attendanceRate: { type: number, nullable: true }
                  remaining: { type: integer, nullable: true }
                  full: { type: boolean }
                  timeline:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        count: { type: integer }

  /admin/events/{id}/signups/batch:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      tags: [events]
      summary: 批次操作報名（候補全轉正／取消／代簽／撤銷代簽）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [PROMOTE_ALL, CANCEL, CHECK_IN, CHECK_OUT] }
                ids: { type: array, items: { type: string }, description: CANCEL／CHECK_IN／CHECK_OUT 必填 }
      responses:
        '200':
          description: OK（CHECK_IN／CHECK_OUT 只動正取，候補不會被算成出席）
        '403': { $ref: '#/components/responses/Forbidden' }

  /menu/week:
    get:
      tags: [menu]
      summary: 某一週的菜單（週一到週五，依日期分組）
      parameters:
        - { in: query, name: weekStart, schema: { type: string, format: date }, description: '該週任一週一日期，如 2026-10-19；不帶則由 weekOffset 推算' }
        - { in: query, name: weekOffset, schema: { type: integer, default: 0, minimum: -8, maximum: 8 }, description: '0 = 本週、1 = 下週' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  weekStart: { type: string, format: date }
                  weekEnd: { type: string, format: date }
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        lunch:
                          type: array
                          items: { $ref: '#/components/schemas/MenuDish' }
                        snack:
                          type: array
                          items: { $ref: '#/components/schemas/MenuDish' }
  /dishes/{id}/ratings:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [menu]
      summary: 評分／點讚（upsert，一人一評）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                liked: { type: boolean }
                comment: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 更新後的平均分與評分數
          content:
            application/json:
              schema:
                type: object
                properties:
                  avgScore: { type: number, format: float }
                  ratingCount: { type: integer }
                  likedCount: { type: integer }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /dishes/top:
    get:
      tags: [menu]
      summary: 熱門菜式排行
      parameters:
        - { in: query, name: days, schema: { type: integer, default: 7 } }
        - { in: query, name: limit, schema: { type: integer, default: 10, maximum: 30 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MenuDish' }

  /notices:
    get:
      tags: [notices]
      summary: 公告列表（預設排除已過期）
      parameters:
        - { in: query, name: kind, schema: { type: string, enum: [NORMAL, URGENT, CALENDAR] } }
        - { in: query, name: pinnedOnly, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notice' }

  /notices/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [notices]
      summary: 公告詳情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notice' }
        '404': { $ref: '#/components/responses/NotFound' }

  /search:
    get:
      tags: [search]
      summary: 全校搜尋（公告／活動／失物／二手轉贈／菜單／功課／提案／館藏／場地器材／我的假單／我的報修；只看得到的人搜得到）
      description: |
        可見性規則由各模組自己決定：公告沿用 `visibleNoticeWhere`（排除軟刪除／預約未到／已過期），
        活動與失物排除軟刪除，轉贈只回 `status = AVAILABLE`（已贈出／已下架不算還拿得到），
        菜單只回「今天以後」的排菜（翻上個月的菜色沒有意義），
        功課只回「自己那一班」（班級取自 JWT 對應的使用者，前端不能指定別班；未登入與家長沒有這一組），
        提案排除軟刪除（撤回／下架），但「暫不採納」仍回（提過沒做本身也是資訊），
        館藏只回 `ACTIVE` 且未刪的書（比對書名／作者／索書號；**借完了照樣回**，
        用 `badge = OUT` 表示，借不到不等於搜不到），
        場地器材只回 `ACTIVE` 且未刪（比對名稱與位置；`badge` 是「種類:狀態」）。
        **我的假單／我的報修是「個人資料」兩類**：`studentId`／`reporterId` 一律取 JWT 的 `sub`，
        不吃 query 上的任何 id（帶別人的 id 也不會變），因此每個人只搜得到自己送出的那幾筆；
        家長沒有 `leave:create`／`repair:create`，未登入也沒有 —— 這兩種身分連分組都不出現。
        假單的 `title` 是「假別＋日期」（例「病假 2026/11/09」）、`badge` 是「假別:狀態」；
        報修的 `title` 是「地點＋器材」、`badge` 是狀態、`location` 另外帶。
        失物與轉贈的聯絡方式（contactValue）一律不回傳。
        標題命中（score 2）排在只有內文命中（score 1）之前，同分依日期新到舊（菜單同分依日期由近到遠、功課依截止時間由近到遠）。
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, minLength: 1, maxLength: 50 } }
        - { in: query, name: types, schema: { type: string, example: notice,event,item,giveaway,menu,homework,proposal,book,resource,leave,repair,loan,booking }, description: '逗號分隔：notice／event／item／giveaway／menu／homework／proposal／book／resource／leave／repair／loan／booking，預設十四類全搜（leave／repair／loan／booking 只回自己的）' }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 20, default: 5 }, description: 每一類最多幾筆 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  q: { type: string }
                  total: { type: integer }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [notice, event, item, giveaway, menu, homework, proposal, book, resource, leave, repair] }
                        count: { type: integer }
                        items:
                          type: array
                          items: { $ref: '#/components/schemas/SearchHit' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /subscriptions:
    post:
      tags: [notices]
      summary: 記錄訂閱消息同意（使用者按「允許」後才會有）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateIds]
              properties:
                templateIds: { type: array, items: { type: string }, minItems: 1, maxItems: 3 }
                scene: { type: string, enum: [claim, event, notice], default: claim }
      responses:
        '200':
          description: 已記錄
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  scene: { type: string }
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [notices]
      summary: 我的訂閱同意記錄
      responses:
        '200': { description: OK }

  /me/export:
    get:
      tags: [me]
      summary: 匯出自己的成績／出缺席／借閱／請假（CSV，帶 UTF-8 BOM）
      description: |
        個資自主：使用者自己把紀錄帶走，不必請校務處匯出。
        學生只能取自己；家長可帶 `studentId` 取綁定的子女（未綁定與查無此人一律 403 同一句訊息，
        避免端點變成學號探測器）；家長不帶 `studentId` 且只有一位子女時自動使用該子女。
        回應是 `text/csv`，`x-row-count` 標頭回資料列數（不含標頭列）。
      parameters:
        - { in: query, name: type, required: true, schema: { type: string, enum: [grades, attendance, library, leaves] } }
        - { in: query, name: studentId, schema: { type: string }, description: 家長匯出子女時使用；其他身分帶別人的 id 一律 403 }
      responses:
        '200':
          description: CSV 檔案（UTF-8 BOM、CRLF 換行）
          headers:
            x-row-count: { schema: { type: string } }
            content-disposition: { schema: { type: string } }
          content:
            text/csv:
              schema: { type: string }
        '401': { description: 未登入 }
        '403': { description: 不是自己的資料（家長未綁定時同一句訊息） }
        '422': { description: type 不認識 }

  /me/calendar/token:
    get:
      tags: [me]
      summary: 我的校曆訂閱狀態（未產生過回 enabled=false）
      description: |
        個人校曆訂閱：日曆 App 訂閱時不會帶 `Authorization`，所以 `.ics` 那一端用網址上的權杖。
        這裡只回狀態與相對路徑，前端自己接上目前的後端位址（換 API base 不必重新產生權杖）。
        `days` 只影響回傳的 `path`（要帶幾天）；**換天數不必重新產生權杖**，預設 90 時路徑不帶參數。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 7, maximum: 365, default: 90 }
          description: 希望網址涵蓋的天數（設定頁提供 30／90／180）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  token: { type: string, nullable: true }
                  path:
                    type: string
                    nullable: true
                    description: "相對路徑，例如 /calendar/me.ics?token=…"
                  createdAt: { type: string, format: date-time, nullable: true }
                  days: { type: integer, description: 預設視窗天數（90） }
        '401': { description: 未登入 }
    post:
      tags: [me]
      summary: 產生／重新產生校曆訂閱權杖（舊權杖立刻失效）
      description: |
        重新產生＝直接換掉舊值。外流的網址從此 404，這比「兩支並存」安全。
        權杖是 128 bit 隨機值，沒有時效，只能由使用者自己撤銷。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 新的權杖與路徑（形狀同 GET）
          content:
            application/json:
              schema: { type: object }
        '401': { description: 未登入 }
        '429': { description: 產生太頻繁（每分鐘 20 次） }
    delete:
      tags: [me]
      summary: 撤銷校曆訂閱權杖（舊網址立刻 404）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已撤銷
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, enum: [false] }
        '401': { description: 未登入 }

  /parents/me/children:
    get:
      tags: [parents]
      summary: 我的子女（家長端；parentId 一律取自 JWT）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        linkId: { type: string }
                        relation: { type: string, enum: [father, mother, guardian] }
                        relationLabel: { type: string }
                        studentId: { type: string }
                        nickname: { type: string, nullable: true }
                        grade: { type: string, nullable: true }
                        className: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parents/me/children/{studentId}:
    parameters:
      - { in: path, name: studentId, required: true, schema: { type: string } }
    get:
      tags: [parents]
      summary: 子女概況（報名、認領件數、未讀公告）
      description: |
        studentId 只是查詢鍵，必須存在於 parent_links 才算數。
        沒有綁定關係一律 403 且訊息固定（不區分「不存在」與「不是你的孩子」），避免學號探測。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  student:
                    type: object
                    properties:
                      id: { type: string }
                      nickname: { type: string, nullable: true }
                      grade: { type: string, nullable: true }
                      className: { type: string, nullable: true }
                  relation: { type: string }
                  relationLabel: { type: string }
                  signups:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        status: { type: string, enum: [CONFIRMED, WAITLIST, CANCELLED] }
                        waitlistPos: { type: integer, nullable: true }
                        event:
                          type: object
                          properties:
                            id: { type: string }
                            title: { type: string }
                            startAt: { type: string, format: date-time }
                            location: { type: string, nullable: true }
                  claimCount: { type: integer }
                  unreadNotices: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parents/me/children/{studentId}/items:
    parameters:
      - { in: path, name: studentId, required: true, schema: { type: string } }
    get:
      tags: [parents]
      summary: 子女發布的失物／拾獲（唯讀，最多 20 筆）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LostItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parents/me/children/{studentId}/claims:
    parameters:
      - { in: path, name: studentId, required: true, schema: { type: string } }
    get:
      tags: [parents]
      summary: 子女提出的認領申請（唯讀，最多 20 筆）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
                        message: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
                        handledAt: { type: string, format: date-time, nullable: true }
                        item:
                          type: object
                          properties:
                            id: { type: string }
                            title: { type: string }
                            type: { type: string, enum: [LOST, FOUND] }
                            status: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parents/me/children/{studentId}/grades:
    parameters:
      - { in: path, name: studentId, required: true, schema: { type: string } }
    get:
      tags: [parents]
      summary: 子女的成績（家長端；形狀與 /school/grades 一致）
      parameters:
        - { in: query, name: yearTerm, schema: { type: string } }
        - { in: query, name: term, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        studentId: { type: string }
                        yearTerm: { type: string }
                        term: { type: string }
                        className: { type: string, nullable: true }
                        courseName: { type: string }
                        content: { type: string, nullable: true }
                        testType: { type: string }
                        testDate: { type: string, format: date }
                        score: { type: number, nullable: true }
                        source: { type: string, enum: [SYNC, MANUAL] }
                  years:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parents/me/children/{studentId}/attendance:
    parameters:
      - { in: path, name: studentId, required: true, schema: { type: string } }
    get:
      tags: [parents]
      summary: 子女的出缺席（家長端；含 summary）
      parameters:
        - { in: query, name: yearTerm, schema: { type: string } }
        - { in: query, name: term, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AttendanceRecord' }
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      late: { type: integer }
                      absent: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parents/me/children/{studentId}/sync:
    parameters:
      - { in: path, name: studentId, required: true, schema: { type: string } }
    post:
      tags: [parents]
      summary: 用家長自己的家校通連結同步子女的成績／出缺席（寫在子女那列）
      description: |
        家長的家校通帳號本來就能看到子女，所以用**家長自己**已加密保存的 `SchoolLink`
        登入家校通，抓回來的資料寫在**子女**身上。閘門為角色 PARENT ＋ 已存在 `parent_links`。
        尚未連結家校通回 422；家校通帳密失效回 401。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                yearTerms:
                  type: array
                  maxItems: 6
                  items: { type: string }
      responses:
        '200':
          description: 同步完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  yearTerms: { type: array, items: { type: string } }
                  grades: { type: integer }
                  attendance: { type: integer }
                  remaining: { type: integer, description: 還有幾段沒同步（0＝全部完成） }
                  done: { type: boolean, description: 與 /school/sync 同一支分批邏輯，游標存在家長的 SchoolLink }
                  thisBatch:
                    type: object
                    properties:
                      from: { type: string, nullable: true }
                      to: { type: string, nullable: true }
                  syncedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /parents/me/children/{studentId}/events/{eventId}/signup:
    parameters:
      - { in: path, name: studentId, required: true, schema: { type: string } }
      - { in: path, name: eventId, required: true, schema: { type: string } }
    post:
      tags: [parents]
      summary: 代已綁定子女報名（滿額回 WAITLIST＋候補順位；與學生自己報名共用 lib/signup.ts）
      responses:
        '201':
          description: 已報名或已進候補
          content:
            application/json:
              schema:
                type: object
                properties:
                  signupId: { type: string }
                  status: { type: string, enum: [CONFIRMED, WAITLIST] }
                  waitlistPos: { type: integer, nullable: true }
                  signedCount: { type: integer }
                  capacity: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 這位子女已經報名過了（ALREADY_SIGNED_UP，名額不會再扣） }
        '422': { description: 活動未開放報名 }
    delete:
      tags: [parents]
      summary: 代已綁定子女取消報名（有人候補就自動補位並重排順位）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: boolean }
                  promoted: { type: boolean }
                  promotedUserId: { type: string, nullable: true }
                  waitlistRemaining: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: 這位子女沒有報名這個活動（VALIDATION_FAILED） }

  /admin/parents:
    get:
      tags: [parents]
      summary: 家長綁定列表（需 parent:manage）
      parameters:
        - { in: query, name: q, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  relations:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/parents/link:
    post:
      tags: [parents]
      summary: 建立家長—學生綁定（需 parent:manage）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentAccount, studentAccount]
              properties:
                parentAccount: { type: string, description: 家長帳號（User.openid） }
                studentAccount: { type: string, description: 學生帳號（User.openid） }
                relation: { type: string, enum: [father, mother, guardian], default: guardian }
                note: { type: string, maxLength: 120 }
      responses:
        '201': { description: 已建立 }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/parents/link/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    delete:
      tags: [parents]
      summary: 解除綁定（需 parent:manage）
      responses:
        '200': { description: 已解除 }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/school/students:
    get:
      tags: [school]
      summary: 找學生（補登成績／出缺席用，需 school:manage）
      parameters:
        - { in: query, name: q, schema: { type: string }, description: 學號／姓名／班別關鍵字 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        account: { type: string, description: 學號（User.openid） }
                        nickname: { type: string, nullable: true }
                        grade: { type: string, nullable: true }
                        className: { type: string, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/school/grades:
    get:
      tags: [school]
      summary: 某位學生的成績（需 school:manage）
      parameters:
        - { in: query, name: studentId, required: true, schema: { type: string } }
        - { in: query, name: yearTerm, schema: { type: string } }
        - { in: query, name: term, schema: { type: string } }
      responses:
        '200':
          description: OK（每筆帶 manual 旗標，只有 manual=true 可以刪）
          content:
            application/json:
              schema:
                type: object
                properties:
                  student: { type: object }
                  items: { type: array, items: { type: object } }
                  years: { type: array, items: { type: string } }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [school]
      summary: 補登／修改一筆成績（需 school:manage，source=MANUAL）
      description: |
        同一個（學生＋學年＋學段＋科目＋類型＋日期）再送一次就是「改」，不會多一筆。
        該鍵若已是家校通同步的資料（source=SYNC）→ 409，手動不能覆蓋學校系統的真相。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, yearTerm, term, courseName, testType, testDate]
              properties:
                studentId: { type: string }
                yearTerm: { type: string, maxLength: 16 }
                term: { type: string, maxLength: 8 }
                courseName: { type: string, maxLength: 48 }
                testType: { type: string, maxLength: 24 }
                testDate: { type: string, format: date }
                score: { type: number, nullable: true, description: 留空＝未評分 }
                content: { type: string, maxLength: 200 }
                className: { type: string, maxLength: 24, description: 不帶就用學生自己的班別 }
      responses:
        '201': { description: 已新增（source=MANUAL） }
        '200': { description: 已更新同一筆 }
        '409': { description: 這筆是同步資料，不能手動覆蓋 }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/school/grades/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    delete:
      tags: [school]
      summary: 刪除手動補登的成績（需 school:manage）
      description: 只有 source=MANUAL 可以刪；同步來的回 422（要修就等下一次同步）。
      responses:
        '200': { description: 已刪除 }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/school/grades/batch:
    post:
      tags: [school]
      summary: 批次補登成績（一次貼多筆，需 school:manage）
      description: |
        一行一筆「科目,類型,日期,分數」（第五欄說明可留空），有表頭也能認。
        逐列回報：好的先寫、壞的把行號與原因帶回去；`dryRun=true` 只驗不寫（前端先預覽再確認）。
        日期一律存 UTC 午夜（與單筆補登、家校通同步三條寫入路徑一致）。
        同步來的資料（source=SYNC）在預覽階段就標紅，不會被覆蓋；同一份內容裡重複的列標「重複」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, yearTerm, term, text]
              properties:
                studentId: { type: string }
                yearTerm: { type: string, maxLength: 16 }
                term: { type: string, maxLength: 8 }
                text: { type: string, maxLength: 20000, description: 一行一筆，逗號分隔 }
                dryRun: { type: boolean, default: false }
      responses:
        '200':
          description: OK（逐列結果）
          content:
            application/json:
              schema:
                type: object
                properties:
                  dryRun: { type: boolean }
                  total: { type: integer }
                  success: { type: integer }
                  failed: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        line: { type: integer }
                        ok: { type: boolean }
                        message: { type: string }
                        label: { type: string }
                        action: { type: string, enum: [create, update] }
                        id: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/school/grades/template:
    get:
      tags: [school]
      summary: 批次補登的範本內容（需 school:manage）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/school/attendance:
    get:
      tags: [school]
      summary: 某位學生的出缺席（需 school:manage）
      parameters:
        - { in: query, name: studentId, required: true, schema: { type: string } }
        - { in: query, name: yearTerm, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  student: { type: object }
                  items: { type: array, items: { type: object } }
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      late: { type: integer }
                      absent: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [school]
      summary: 補登／修改一天的出缺席（需 school:manage，source=MANUAL）
      description: 同一（學生＋日期）再送一次就是「改」；同步來的資料回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, date, yearTerm, term]
              properties:
                studentId: { type: string }
                date: { type: string, format: date }
                yearTerm: { type: string, maxLength: 16 }
                term: { type: string, maxLength: 8 }
                amStatus: { type: string, enum: [normal, late, absent, leave], default: normal }
                pmStatus: { type: string, enum: [normal, late, absent, leave], default: normal }
                remark: { type: string, maxLength: 200 }
      responses:
        '201': { description: 已新增（source=MANUAL） }
        '200': { description: 已更新同一天 }
        '409': { description: 這天是同步資料，不能手動覆蓋 }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/school/attendance/monthly:
    get:
      tags: [school]
      summary: "出席率月報（需 school:manage；按班級與按日聚合，不新增表）"
      description: |
        資料來源只有 `attendance_records`（家校通同步 ＋ 老師手動補登）。
        出席率 ＝ 1 − 缺席天數 ÷ 有紀錄天數：**遲到算出席**、**請假不算缺席**（否則每次病假都會壓低班級出席率，
        跟學校算的數字對不上）。沒有紀錄時 `rate` 回 null（不是 0%）。
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: month, schema: { type: string, pattern: '^\\d{4}-\\d{2}$' }, description: 例 2026-11；留空＝本月（Asia/Macau） }
        - { in: query, name: yearTerm, schema: { type: string, maxLength: 16 } }
        - { in: query, name: grade, schema: { type: string, maxLength: 16 } }
        - { in: query, name: className, schema: { type: string, maxLength: 32 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  yearTerm: { type: string, nullable: true }
                  range:
                    type: object
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                  days: { type: integer }
                  students: { type: integer, description: 當月有紀錄的學生數 }
                  summary:
                    type: object
                    properties:
                      records: { type: integer, description: 人日 }
                      present: { type: integer }
                      late: { type: integer }
                      absent: { type: integer }
                      leave: { type: integer }
                      rate: { type: number, nullable: true }
                  byClass:
                    type: array
                    items:
                      type: object
                      properties:
                        grade: { type: string }
                        className: { type: string }
                        students: { type: integer }
                        records: { type: integer }
                        present: { type: integer }
                        late: { type: integer }
                        absent: { type: integer }
                        leave: { type: integer }
                        rate: { type: number, nullable: true }
                  byDay:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        day: { type: integer }
                        records: { type: integer }
                        late: { type: integer }
                        absent: { type: integer }
                        rate: { type: number, nullable: true, description: 當天出席率（人日）；沒有紀錄回 null }
                  truncated: { type: boolean, description: true＝超過 4 萬列上限，前端要提示縮小範圍 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/school/attendance/monthly/export:
    get:
      tags: [school]
      summary: "出席率月報 CSV 匯出（需 school:manage）"
      description: |
        W-104。與 `GET /admin/school/attendance/monthly` **共用同一份聚合**（`src/lib/attendance-monthly.ts`），
        所以匯出筆數一定等於月報上的班級數（`groupBy=class`）或天數（`groupBy=day`）。
        回應是 UTF-8 BOM 的 `text/csv`，欄位全包雙引號；`x-row-count` 標頭回列數（不必下載檔案就能驗）。
        每次匯出寫一筆 `attendance.export` 審計。
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: month, schema: { type: string, pattern: '^\\d{4}-\\d{2}$' }, description: 例 2026-11；留空＝本月（Asia/Macau，與月報同一支判斷） }
        - { in: query, name: yearTerm, schema: { type: string, maxLength: 16 } }
        - { in: query, name: grade, schema: { type: string, maxLength: 16 } }
        - { in: query, name: className, schema: { type: string, maxLength: 32 } }
        - { in: query, name: groupBy, schema: { type: string, enum: [class, day], default: class }, description: class＝每班一列（校務處月底要的數字）；day＝整月一天一列 }
      responses:
        '200':
          description: CSV（`text/csv; charset=utf-8`，帶 BOM）
          headers:
            x-row-count: { schema: { type: integer }, description: 實際列數（不含表頭） }
            content-disposition: { schema: { type: string }, description: 例 `attachment; filename="attendance-2026-11.csv"` }
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/school/attendance/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    delete:
      tags: [school]
      summary: 刪除手動補登的出缺席（需 school:manage）
      responses:
        '200': { description: 已刪除 }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /uploads/signature:
    post:
      tags: [uploads]
      summary: 取得 COS 直傳簽名（POST Object policy）
      description: |
        圖片不經過 API，客戶端拿 policy + signature 直接 POST 到 host。
        未配置 COS_* 環境變數時回 422 並說明缺哪一組設定，**不會**回假簽名。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose: { type: string, enum: [item, avatar, notice], default: item }
                ext: { type: string, enum: [jpg, jpeg, png, webp], default: jpg }
      responses:
        '200':
          description: 簽名資訊
          content:
            application/json:
              schema:
                type: object
                properties:
                  host: { type: string }
                  keyPrefix: { type: string }
                  policy: { type: string }
                  signature: { type: string }
                  qSignAlgorithm: { type: string, default: sha1 }
                  expiredAt: { type: integer, description: Unix 秒 }
                  maxBytes: { type: integer, example: 4194304 }
                  cdnBase: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/login:
    post:
      tags: [admin]
      summary: 教職員後台登入（帳號密碼）
      description: |
        帳號 = 使用者的 openid（由 SUPER_ADMIN 指派並設定密碼）；學生沒有密碼，走 wx.login。
        回傳 JWT（12 小時），角色需為 TEACHER／ADMIN／SUPER_ADMIN。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string }
                password: { type: string, minLength: 6 }
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string }
                  nickname: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/items/{id}:
    patch:
      tags: [admin]
      summary: 下架／恢復失物（軟刪除，寫審計）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [REMOVE, RESTORE] }
                reason: { type: string, maxLength: 200 }

  /admin/claims:
    get:
      tags: [admin]
      summary: 認領申請清單（需 item:review）
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [PENDING, APPROVED, REJECTED], default: PENDING } }

  /admin/events:
    post:
      tags: [admin]
      summary: 建立活動
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startAt]
              properties:
                title: { type: string }
                description: { type: string }
                location: { type: string }
                startAt: { type: string, format: date-time }
                endAt: { type: string, format: date-time }
                signupEndAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: 'W-64 報名截止：必須早於 startAt，否則 422；留空＝不設截止'
                capacity: { type: integer, description: '0 = 不限' }
                status: { type: string, enum: [DRAFT, PUBLISHED], default: PUBLISHED }
                groups: { type: array, items: { type: string }, maxItems: 10 }
                teamsEnabled: { type: boolean }
      responses:
        '201':
          description: 建立成功（回 id／title／startAt／signupEndAt…）
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [admin]
      summary: 活動清單（匯出 CSV 用，需 event:export）

  /admin/dishes/ensure:
