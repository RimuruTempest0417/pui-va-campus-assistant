openapi: 3.0.3
info:
  title: 培華校園助手 API
  version: 1.0.0
  description: |
    澳門培華中學「培華校園助手」小程序後端契約。
    認證：Authorization: Bearer <JWT>（/auth/login 除外）。
    錯誤格式：{ "error": { "code", "message", "details"? } }
servers:
  - url: https://api.example.edu.mo/api/v1
    description: 生產（已備案域名，待填）
  - url: http://127.0.0.1:3000/api/v1
    description: 本地開發
tags:
  - name: auth
  - name: items
  - name: events
  - name: menu
  - name: notices
  - name: uploads
  - name: parents
  - name: admin

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: 微信登入（code2Session）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: wx.login 取得的 code }
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [auth]
      summary: 當前使用者
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      summary: 更新暱稱／班級
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 64 }
                className: { type: string, maxLength: 32 }
                grade: { type: string, maxLength: 16 }
      responses:
        '200':
          description: 更新後的使用者
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /items:
    get:
      tags: [items]
      summary: 失物列表（篩選＋分頁）
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [LOST, FOUND] } }
        - { in: query, name: categoryId, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [OPEN, MATCHED, CLAIMED, CLOSED] } }
        - { in: query, name: q, schema: { type: string }, description: 標題／描述關鍵字 }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LostItem' }
    post:
      tags: [items]
      summary: 發布失物／拾獲
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LostItemInput' }
      responses:
        '201':
          description: 建立成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostItem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /items/mine:
    get:
      tags: [items]
      summary: 我發布的失物
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LostItem' }

  /categories:
    get:
      tags: [items]
      summary: 分類清單（失物用）
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [LOST, FOUND] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        key: { type: string }
                        name: { type: string }
                        icon: { type: string, nullable: true }

  /items/{id}/matches:
    get:
      tags: [items]
      summary: 失物智能匹配（相反類型、加權評分）
      description: |
        加權：同分類 0.35、地點相似（pg_trgm > 0.4）0.25、時間差 3 天內 0.15、標題／描述相似 0.25。
        閘門：地點或文字至少要有一項像，否則不回傳；總分低於 0.45 也不回傳。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 推薦清單（最多 5 筆）
          content:
            application/json:
              schema:
                type: object
                properties:
                  minScore: { type: number, example: 0.45 }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        type: { type: string, enum: [LOST, FOUND] }
                        title: { type: string }
                        place: { type: string }
                        happenedAt: { type: string, format: date-time }
                        score: { type: number }
                        reasons:
                          type: array
                          items: { type: string, example: 同分類 }
        '404': { $ref: '#/components/responses/NotFound' }


  /items/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [items]
      summary: 失物詳情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [items]
      summary: 改狀態（作者本人，或具 item:moderate 者可代改）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, CLAIMED, CLOSED] }
      responses:
        '200':
          description: 修改後
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostItem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /items/{id}/claims:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [items]
      summary: 查看某件物品的認領申請（發布者本人或 item:review）
      description: |
        只有物品發布者本人，或具 item:review 能力（ADMIN 以上）的人看得到。
        其他人（含老師、STAFF）回 403，避免申請人的特徵描述外流。
      responses:
        '200':
          description: 申請清單（待審在前、同狀態按時間排序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ItemClaim' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [items]
      summary: 申請認領
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 300, description: 特徵描述，防冒領 }
      responses:
        '201':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemClaim' }
        '409':
          description: 已有人認領或本人已申請
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /claims/{id}:
    patch:
      tags: [items]
      summary: 審批認領申請（發布者本人或資訊管理員）
      description: |
        APPROVE 後物品轉為 CLAIMED，同物品其他待審申請自動 REJECTED。
        需要 JWT；非發布者且不具 item:review（ADMIN 以上）回 403 —— 老師與 STAFF 都不能審批。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string }, description: claim id }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
                note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 審批結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemClaim' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events:
    get:
      tags: [events]
      summary: 活動列表
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, FINISHED] } }
        - { in: query, name: clubId, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }

  /events/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [events]
      summary: 活動詳情（含我是否已報名）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Event'
                  - type: object
                    properties:
                      myStatus: { type: string, nullable: true, enum: [CONFIRMED, WAITLIST, CANCELLED, null] }
                      waitlistPos: { type: integer, nullable: true }
                      myCheckedIn: { type: string, format: date-time, nullable: true, description: 我自己的現場簽到時間（未簽到為 null） }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/signup:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [events]
      summary: 報名（名額樂觀鎖，滿員回 409）
      responses:
        '201':
          description: 報名成功或已進入候補
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSignup' }
        '409':
          description: EVENT_FULL 或 ALREADY_SIGNED_UP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [events]
      summary: 取消報名（觸發候補自動補位）
      responses:
        '204': { description: 已取消 }

  /events/mine:
    get:
      tags: [events]
      summary: 我的報名（含候補位置）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EventSignup' }

  /events/checkin:
    post:
      tags: [events]
      summary: 學生現場簽到（掃碼／手打 6 位碼）
      description: |
        只認簽到碼，**不接受前端傳來的 eventId**（否則改一個參數就能替別人簽到）。
        規則：簽到必須開放中、活動碼存在、本人是該活動的「正取」；
        候補與沒報名者一律 422。重複掃視為成功並回 `already: true`（不重複計數）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: '6 位碼，或 QR 內容 PVCHECKIN:123456' }
      responses:
        '200':
          description: 簽到成功（或 already=true 表示之前已簽）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  already: { type: boolean }
                  eventId: { type: string }
                  title: { type: string }
                  checkedInAt: { type: string, format: date-time }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /events/{id}/checkin:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [events]
      summary: 老師端簽到看板（需 event:checkin；老師只能看自己的活動）
      responses:
        '200':
          description: OK（未開放時 code 與 qrDataUrl 為 null）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCheckinState' }

  /events/{id}/checkin/open:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [events]
      summary: 開始簽到（每次開啟都換新碼，舊碼立刻失效）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCheckinState' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /events/{id}/checkin/close:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [events]
      summary: 結束簽到（碼留作紀錄但掃了就失效）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCheckinState' }

  /events/{id}/attendance:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [events]
      summary: 出席名單（正取在前；含候補供核對）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId: { type: string }
                  title: { type: string }
                  active: { type: boolean }
                  signed: { type: integer, description: 正取人數 }
                  checkedIn: { type: integer }
                  rate: { type: number, nullable: true, description: 出席率（%），沒有人報名時為 null }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        signupId: { type: string }
                        status: { type: string, enum: [CONFIRMED, WAITLIST] }
                        waitlistPos: { type: integer, nullable: true }
                        nickname: { type: string, nullable: true }
                        grade: { type: string, nullable: true }
                        className: { type: string, nullable: true }
                        checkedInAt: { type: string, format: date-time, nullable: true }

  /events/{id}/stats:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [events]
      summary: 活動報名統計（需 event:create；老師只能看自己的活動）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId: { type: string }
                  title: { type: string }
                  capacity: { type: integer }
                  unlimited: { type: boolean }
                  signed: { type: integer }
                  waitlisted: { type: integer }
                  cancelled: { type: integer }
                  checkedIn: { type: integer, description: 正取且已簽到的人數 }
                  attendanceRate: { type: number, nullable: true }
                  remaining: { type: integer, nullable: true }
                  full: { type: boolean }
                  timeline:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        count: { type: integer }

  /admin/events/{id}/signups/batch:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      tags: [events]
      summary: 批次操作報名（候補全轉正／取消／代簽／撤銷代簽）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [PROMOTE_ALL, CANCEL, CHECK_IN, CHECK_OUT] }
                ids: { type: array, items: { type: string }, description: CANCEL／CHECK_IN／CHECK_OUT 必填 }
      responses:
        '200':
          description: OK（CHECK_IN／CHECK_OUT 只動正取，候補不會被算成出席）
        '403': { $ref: '#/components/responses/Forbidden' }

  /menu/week:
    get:
      tags: [menu]
      summary: 某一週的菜單（週一到週五，依日期分組）
      parameters:
        - { in: query, name: weekStart, schema: { type: string, format: date }, description: '該週任一週一日期，如 2026-10-19；不帶則由 weekOffset 推算' }
        - { in: query, name: weekOffset, schema: { type: integer, default: 0, minimum: -8, maximum: 8 }, description: '0 = 本週、1 = 下週' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  weekStart: { type: string, format: date }
                  weekEnd: { type: string, format: date }
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        lunch:
                          type: array
                          items: { $ref: '#/components/schemas/MenuDish' }
                        snack:
                          type: array
                          items: { $ref: '#/components/schemas/MenuDish' }
  /dishes/{id}/ratings:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [menu]
      summary: 評分／點讚（upsert，一人一評）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                liked: { type: boolean }
                comment: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 更新後的平均分與評分數
          content:
            application/json:
              schema:
                type: object
                properties:
                  avgScore: { type: number, format: float }
                  ratingCount: { type: integer }
                  likedCount: { type: integer }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /dishes/top:
    get:
      tags: [menu]
      summary: 熱門菜式排行
      parameters:
        - { in: query, name: days, schema: { type: integer, default: 7 } }
        - { in: query, name: limit, schema: { type: integer, default: 10, maximum: 30 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MenuDish' }

  /notices:
    get:
      tags: [notices]
      summary: 公告列表（預設排除已過期）
      parameters:
        - { in: query, name: kind, schema: { type: string, enum: [NORMAL, URGENT, CALENDAR] } }
        - { in: query, name: pinnedOnly, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notice' }

  /notices/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [notices]
      summary: 公告詳情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notice' }
        '404': { $ref: '#/components/responses/NotFound' }

  /subscriptions:
    post:
      tags: [notices]
      summary: 記錄訂閱消息同意（使用者按「允許」後才會有）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateIds]
              properties:
                templateIds: { type: array, items: { type: string }, minItems: 1, maxItems: 3 }
                scene: { type: string, enum: [claim, event, notice], default: claim }
      responses:
        '200':
          description: 已記錄
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  scene: { type: string }
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [notices]
      summary: 我的訂閱同意記錄
      responses:
        '200': { description: OK }

  /parents/me/children:
    get:
      tags: [parents]
      summary: 我的子女（家長端；parentId 一律取自 JWT）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        linkId: { type: string }
                        relation: { type: string, enum: [father, mother, guardian] }
                        relationLabel: { type: string }
                        studentId: { type: string }
                        nickname: { type: string, nullable: true }
                        grade: { type: string, nullable: true }
                        className: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parents/me/children/{studentId}:
    parameters:
      - { in: path, name: studentId, required: true, schema: { type: string } }
    get:
      tags: [parents]
      summary: 子女概況（報名、認領件數、未讀公告）
      description: |
        studentId 只是查詢鍵，必須存在於 parent_links 才算數。
        沒有綁定關係一律 403 且訊息固定（不區分「不存在」與「不是你的孩子」），避免學號探測。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  student:
                    type: object
                    properties:
                      id: { type: string }
                      nickname: { type: string, nullable: true }
                      grade: { type: string, nullable: true }
                      className: { type: string, nullable: true }
                  relation: { type: string }
                  relationLabel: { type: string }
                  signups:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        status: { type: string, enum: [CONFIRMED, WAITLIST, CANCELLED] }
                        waitlistPos: { type: integer, nullable: true }
                        event:
                          type: object
                          properties:
                            id: { type: string }
                            title: { type: string }
                            startAt: { type: string, format: date-time }
                            location: { type: string, nullable: true }
                  claimCount: { type: integer }
                  unreadNotices: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parents/me/children/{studentId}/items:
    parameters:
      - { in: path, name: studentId, required: true, schema: { type: string } }
    get:
      tags: [parents]
      summary: 子女發布的失物／拾獲（唯讀，最多 20 筆）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LostItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parents/me/children/{studentId}/claims:
    parameters:
      - { in: path, name: studentId, required: true, schema: { type: string } }
    get:
      tags: [parents]
      summary: 子女提出的認領申請（唯讀，最多 20 筆）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
                        message: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
                        handledAt: { type: string, format: date-time, nullable: true }
                        item:
                          type: object
                          properties:
                            id: { type: string }
                            title: { type: string }
                            type: { type: string, enum: [LOST, FOUND] }
                            status: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parents/me/children/{studentId}/events/{eventId}/signup:
    parameters:
      - { in: path, name: studentId, required: true, schema: { type: string } }
      - { in: path, name: eventId, required: true, schema: { type: string } }
    post:
      tags: [parents]
      summary: 代已綁定子女報名（滿額回 WAITLIST＋候補順位；與學生自己報名共用 lib/signup.ts）
      responses:
        '201':
          description: 已報名或已進候補
          content:
            application/json:
              schema:
                type: object
                properties:
                  signupId: { type: string }
                  status: { type: string, enum: [CONFIRMED, WAITLIST] }
                  waitlistPos: { type: integer, nullable: true }
                  signedCount: { type: integer }
                  capacity: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 這位子女已經報名過了（ALREADY_SIGNED_UP，名額不會再扣） }
        '422': { description: 活動未開放報名 }
    delete:
      tags: [parents]
      summary: 代已綁定子女取消報名（有人候補就自動補位並重排順位）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: boolean }
                  promoted: { type: boolean }
                  promotedUserId: { type: string, nullable: true }
                  waitlistRemaining: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: 這位子女沒有報名這個活動（VALIDATION_FAILED） }

  /admin/parents:
    get:
      tags: [parents]
      summary: 家長綁定列表（需 parent:manage）
      parameters:
        - { in: query, name: q, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  relations:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/parents/link:
    post:
      tags: [parents]
      summary: 建立家長—學生綁定（需 parent:manage）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentAccount, studentAccount]
              properties:
                parentAccount: { type: string, description: 家長帳號（User.openid） }
                studentAccount: { type: string, description: 學生帳號（User.openid） }
                relation: { type: string, enum: [father, mother, guardian], default: guardian }
                note: { type: string, maxLength: 120 }
      responses:
        '201': { description: 已建立 }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/parents/link/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    delete:
      tags: [parents]
      summary: 解除綁定（需 parent:manage）
      responses:
        '200': { description: 已解除 }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /uploads/signature:
    post:
      tags: [uploads]
      summary: 取得 COS 直傳簽名（POST Object policy）
      description: |
        圖片不經過 API，客戶端拿 policy + signature 直接 POST 到 host。
        未配置 COS_* 環境變數時回 422 並說明缺哪一組設定，**不會**回假簽名。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose: { type: string, enum: [item, avatar, notice], default: item }
                ext: { type: string, enum: [jpg, jpeg, png, webp], default: jpg }
      responses:
        '200':
          description: 簽名資訊
          content:
            application/json:
              schema:
                type: object
                properties:
                  host: { type: string }
                  keyPrefix: { type: string }
                  policy: { type: string }
                  signature: { type: string }
                  qSignAlgorithm: { type: string, default: sha1 }
                  expiredAt: { type: integer, description: Unix 秒 }
                  maxBytes: { type: integer, example: 4194304 }
                  cdnBase: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/login:
    post:
      tags: [admin]
      summary: 教職員後台登入（帳號密碼）
      description: |
        帳號 = 使用者的 openid（由 SUPER_ADMIN 指派並設定密碼）；學生沒有密碼，走 wx.login。
        回傳 JWT（12 小時），角色需為 TEACHER／ADMIN／SUPER_ADMIN。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string }
                password: { type: string, minLength: 6 }
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string }
                  nickname: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/items/{id}:
    patch:
      tags: [admin]
      summary: 下架／恢復失物（軟刪除，寫審計）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [REMOVE, RESTORE] }
                reason: { type: string, maxLength: 200 }

  /admin/claims:
    get:
      tags: [admin]
      summary: 認領申請清單（需 item:review）
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [PENDING, APPROVED, REJECTED], default: PENDING } }

  /admin/events:
    post:
      tags: [admin]
      summary: 建立活動
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    get:
      tags: [admin]
      summary: 活動清單（匯出 CSV 用，需 event:export）

  /admin/dishes/ensure:
    post:
      tags: [admin]
      summary: 依菜名取得或建立菜色（排菜單用，需 menu:manage）

  /admin/menu:
    get:
      tags: [admin]
      summary: 整週菜單（後台）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [admin]
      summary: 排菜單（同日同餐別覆蓋，需 menu:manage）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, mealType, dishIds]
              properties:
                date: { type: string, format: date }
                mealType: { type: string, enum: [LUNCH, SNACK] }
                dishIds: { type: array, items: { type: string }, maxItems: 6 }
      responses:
        '200':
          description: 寫入後該日該餐別的菜色數
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  mealType: { type: string, enum: [LUNCH, SNACK] }
                  count: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/import/template:
    get:
      tags: [admin]
      summary: CSV 匯入範本（text/csv，帶 UTF-8 BOM；需登入）
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [events, menu], default: events }
      responses:
        '200':
          description: 範本 CSV（第一列為欄名，可直接改內容後匯入）
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/import/events:
    post:
      tags: [admin]
      summary: 批次建立活動（逐列回報，同名同時段只提示不覆蓋；需 event:create）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string, description: CSV 全文，第一列為欄名 }
                dryRun: { type: boolean, default: false, description: 只驗證不寫入 }
      responses:
        '200':
          description: 逐列結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, enum: [events, menu] }
                  dryRun: { type: boolean }
                  total: { type: integer }
                  success: { type: integer }
                  failed: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        line: { type: integer }
                        ok: { type: boolean }
                        message: { type: string }
                        label: { type: string, description: 標題或日期餐別 }
                        id: { type: string, description: 成功時建立後的 id }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/import/menu:
    post:
      tags: [admin]
      summary: 批次匯入菜單（同日同餐合併為一組並整組取代；菜名自動建立；需 menu:manage）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string, description: CSV 全文，第一列為欄名 }
                dryRun: { type: boolean, default: false }
      responses:
        '200':
          description: 逐列結果（同日同餐的多列會各自回報同一組的結果）
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, enum: [events, menu] }
                  dryRun: { type: boolean }
                  total: { type: integer }
                  success: { type: integer }
                  failed: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        line: { type: integer }
                        ok: { type: boolean }
                        message: { type: string }
                        label: { type: string, description: 標題或日期餐別 }
                        id: { type: string, description: 成功時建立後的 id }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/notices:
    get:
      tags: [admin]
      summary: 公告列表（後台）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [admin]
      summary: 發公告（可推送訂閱消息）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string, maxLength: 120 }
                content: { type: string }
                kind: { type: string, enum: [NORMAL, URGENT, CALENDAR] }
                isPinned: { type: boolean }
                push: { type: boolean, description: 是否發訂閱消息 }
      responses:
        '201':
          description: 建立成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notice' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stats:
    get:
      tags: [admin]
      summary: 營運看板數據（需 stats:read）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: integer, description: 使用者總數 }
                  byRole:
                    type: object
                    description: 各角色人數（鍵為 Role 列舉值）
                    additionalProperties: { type: integer }
                  items:
                    type: object
                    properties:
                      open: { type: integer }
                      claimed: { type: integer }
                      added7d: { type: integer }
                  claimsPending: { type: integer }
                  events: { type: integer }
                  signups:
                    type: object
                    properties:
                      confirmed: { type: integer }
                      waitlist: { type: integer }
                  noticesActive: { type: integer }
                  ratings:
                    type: object
                    properties:
                      count: { type: integer }
                      avg: { type: number, format: float }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stats/overview:
    get:
      tags: [admin]
      summary: 後台統計首頁五張數字卡（需 stats:read）
      description: >-
        本週＝滾動近 7 天。回傳五個即時 count：本週新使用者、本週報名（正取＋候補，不含已取消）、
        待審認領、未解決錯誤、未認領失物（已下架不計）。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  week:
                    type: object
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                  usersNew7d: { type: integer }
                  signups7d: { type: integer }
                  claimsPending: { type: integer }
                  errorsOpen: { type: integer }
                  itemsOpen: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /dishes/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [menu]
      summary: 菜式詳情（含平均分與評分數）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuDish' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notices/read-all:
    post:
      tags: [notices]
      summary: 全部標為已讀
      description: '打開公告詳情（GET /notices/{id}）本身就會標該則已讀。'
      responses:
        '200':
          description: 已讀數量
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/items:
    get:
      tags: [admin]
      summary: 待審核／全部失物（需 item:moderate）
      description: 回傳含已下架項目（deletedAt 非 null），供後台下架／恢復。
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [OPEN, MATCHED, CLAIMED, CLOSED] } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LostItem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/events/{id}/signups:
    get:
      tags: [admin]
      summary: 報名名單 JSON（小程序內後台用，需 event:export）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 名單（最多 200 筆）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        nickname: { type: string, nullable: true }
                        grade: { type: string, nullable: true }
                        className: { type: string, nullable: true }
                        status: { type: string, enum: [CONFIRMED, WAITLIST] }
                        waitlistPos: { type: integer, nullable: true }
                        createdAt: { type: string, format: date-time }

  /admin/events/{id}/signups.csv:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [admin]
      summary: 匯出報名名單（CSV，UTF-8 BOM）
      description: 欄位＝狀態（正取／候補）、候補順位、姓名、年級、班別、openid、報名時間；不含已取消；寫審計。
      responses:
        '200':
          description: CSV 檔案
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /client-errors:
    post:
      tags: [admin]
      summary: 用戶端錯誤上報（匿名可用；同一訊息＋頁面聚合成一列，只累加次數）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 300 }
                stack: { type: string, maxLength: 4000 }
                route: { type: string, maxLength: 200, description: 出錯的頁面路徑，例如 pages/items/list/index }
                platform: { type: string, maxLength: 32, description: ios / android / devtools }
                sdkVersion: { type: string, maxLength: 32, description: 微信基礎庫版本 }
                appVersion: { type: string, maxLength: 32 }
      responses:
        '202':
          description: 已記錄。同一指紋只留一列並累加 count；超過每 IP 每分鐘 20 則回 throttled true（刻意不用 429，上報失敗不該造成第二個錯誤）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  count: { type: integer }
                  throttled: { type: boolean }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/errors:
    get:
      tags: [admin]
      summary: 錯誤日誌（預設按出現次數排序，需要 error:read = ADMIN 以上）
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [OPEN, RESOLVED] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ErrorLog' }
                  summary:
                    type: object
                    properties:
                      open: { type: integer }
                      total: { type: integer, description: 所有錯誤的累計出現次數 }
                      kinds: { type: integer, description: 錯誤種類數 }
                      last24h: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/errors/{id}:
    patch:
      tags: [admin]
      summary: 標記錯誤已解決／重新打開（再發生時後端會自動回到 OPEN）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [RESOLVE, REOPEN] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [OPEN, RESOLVED] }
                  resolvedAt: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/error-logs/cleanup:
    post:
      tags: [admin]
      summary: 清理舊錯誤紀錄（預設只刪已解決的；需要 error:read = ADMIN 以上）
      description: |
        OPEN 代表還沒修，自動刪掉等於把待辦事項藏起來，所以預設只刪「已解決」且最後出現時間早於 cutoff 的紀錄。
        要連未解決的一起清必須明確帶 `includeOpen: true`。回傳 kept 讓前端老實說「還有 N 筆沒動」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [olderThanDays]
              properties:
                olderThanDays: { type: integer, minimum: 1, maximum: 365 }
                includeOpen: { type: boolean, default: false, description: 連未解決的舊紀錄一起刪 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer, description: 實際刪除筆數 }
                  kept: { type: integer, description: 還留著的舊紀錄數（未解決的） }
                  olderThanDays: { type: integer }
                  includeOpen: { type: boolean }
                  cutoff: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/error-logs/resolve-similar:
    post:
      tags: [admin]
      summary: 同類一次解決（signature＝訊息＋頁面；需要 error:read = ADMIN 以上）
      description: |
        指紋含頁面，所以同一句話在不同頁面出錯會被拆成好幾列。省略 route 就一次解決「所有頁面」的同句話，
        帶 route 只解決那一頁。已 RESOLVED 的不重算 resolvedAt。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 300 }
                route: { type: string, nullable: true, description: 省略或 null＝不限頁面 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolved: { type: integer, description: 這次被標成已解決的筆數 }
                  matched: { type: integer, description: 符合 signature 的總筆數（含已解決） }
                  message: { type: string }
                  route: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/export.json:
    get:
      tags: [admin]
      summary: 全庫匯出（JSON 備份，只有最高權限）
      description: |
        一次匯出全部 18 張資料表的 JSON；還原用後端 repo 的 `node scripts/restore.mjs 備份檔 --yes`，
        刻意不提供 HTTP 還原端點（破壞性操作只留在終端）。檔案含 `users.passwordHash`，等同資料庫機密。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 備份檔（附件下載）
          headers:
            content-disposition: { schema: { type: string } }
            x-backup-rows: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  format: { type: string, enum: [pui-va-backup] }
                  version: { type: integer, enum: [1] }
                  appVersion: { type: string }
                  exportedAt: { type: string, format: date-time }
                  counts: { type: object, additionalProperties: { type: integer } }
                  data: { type: object, additionalProperties: { type: array, items: { type: object } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── 健康檢查（監控用，不需認證） ──
