        '200': { description: OK }

  /admin/users/{id}/role:
    patch:
      tags: [admin]
      summary: 指派角色
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /cron/reminders:
    get:
      tags: [admin]
      summary: 活動前自動提醒（定時任務；Vercel Cron 用 GET）
      description: |
        由排程每 30 分鐘呼叫。找出 24 小時／1 小時內開始、狀態 PUBLISHED、
        尚未提醒過的活動，對 **正取（CONFIRMED）** 報名者寫站內通知並嘗試發訂閱消息。
        同一活動同一階段只發一次（`Event.reminder24SentAt`／`reminder1SentAt` 做樂觀鎖）。
        認證不是 JWT，而是 `Authorization: Bearer <CRON_SECRET>`（或 `x-cron-secret`）；
        後端沒設定 `CRON_SECRET` 時一律回 503 `CRON_DISABLED`。
      security: []
      responses:
        '200':
          description: 這一輪的結果（沒有活動要提醒時回 0 筆）
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
                  checked: { type: integer, description: 進入檢查的活動數 }
                  reminders:
                    type: array
                    items:
                      type: object
                      properties:
                        eventId: { type: string }
                        title: { type: string }
                        stage: { type: string, enum: [24h, 1h] }
                        startAt: { type: string, format: date-time }
                        recipients: { type: integer, description: 正取人數 }
                        subscribeSent: { type: integer }
                        subscribeSkipped: { type: integer }
                  totals:
                    type: object
                    properties:
                      events: { type: integer }
                      recipients: { type: integer }
                      subscribeSent: { type: integer }
                      subscribeSkipped: { type: integer }
        '401': { description: 密鑰不正確或沒有帶 }
        '503': { description: 後端未設定 CRON_SECRET（端點停用） }
    post:
      tags: [admin]
      summary: 活動前自動提醒（手動觸發／GitHub Actions 用 POST）
      security: []
      responses:
        '200': { description: 同 GET }
        '401': { description: 密鑰不正確或沒有帶 }
        '503': { description: 後端未設定 CRON_SECRET（端點停用） }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: 未認證
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: 欄位驗證失敗
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 觸發限流
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ErrorLog:
      type: object
      properties:
        id: { type: string }
        message: { type: string, description: 錯誤訊息（截到 300 字） }
        stack: { type: string, nullable: true }
        route: { type: string, nullable: true, description: 出錯的頁面路徑 }
        platform: { type: string, nullable: true }
        sdkVersion: { type: string, nullable: true }
        appVersion: { type: string, nullable: true }
        userId: { type: string, nullable: true, description: 有 JWT 才有；匿名上報為 null }
        count: { type: integer, description: 出現次數（列表排序依據） }
        status: { type: string, enum: [OPEN, RESOLVED] }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        # 同類筆數＝訊息相同的紀錄數（不限頁面）；後台用它顯示「同類 N 筆」與一次解決
        similar: { type: integer }

    EventCheckinState:
      type: object
      properties:
        eventId: { type: string }
        title: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, FINISHED] }
        active: { type: boolean }
        code: { type: string, nullable: true, description: 6 位簽到碼（未開放時為 null） }
        openedAt: { type: string, format: date-time, nullable: true }
        qrDataUrl: { type: string, nullable: true, description: 'PNG data URL（小程序 image 直接顯示）' }
        signed: { type: integer }
        checkedIn: { type: integer }
        rate: { type: number, nullable: true }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, VALIDATION_FAILED, EVENT_FULL,
                 ALREADY_SIGNED_UP, ALREADY_CLAIMED, CONTENT_RISKY, RATE_LIMITED]
            message: { type: string }
            details: { type: object, nullable: true }

    Page:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        hasMore: { type: boolean }

    User:
      type: object
      properties:
        id: { type: string }
        nickname: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        role: { type: string, enum: [STUDENT, TEACHER, ADMIN] }
        grade: { type: string, nullable: true }
        className: { type: string, nullable: true }

    LostItemInput:
      type: object
      required: [type, title, place, happenedAt]
      properties:
        type: { type: string, enum: [LOST, FOUND] }
        title: { type: string, maxLength: 80 }
        description: { type: string }
        categoryId: { type: string, nullable: true }
        place: { type: string, maxLength: 120 }
        happenedAt: { type: string, format: date-time }
        contactType: { type: string, enum: [inApp, wechat, phone] }
        contactValue: { type: string, nullable: true }
        images:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              key: { type: string, description: COS 物件 key }
              width: { type: integer }
              height: { type: integer }

    LostItem:
      allOf:
        - $ref: '#/components/schemas/LostItemInput'
        - type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [OPEN, MATCHED, CLAIMED, CLOSED] }
            author: { $ref: '#/components/schemas/User' }
            viewCount: { type: integer }
            claimCount: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    ItemClaim:
      type: object
      properties:
        id: { type: string }
        itemId: { type: string }
        claimantId: { type: string }
        message: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        createdAt: { type: string, format: date-time }
        handledAt: { type: string, format: date-time, nullable: true }

    Event:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        coverImage: { type: string, nullable: true }
        description: { type: string, nullable: true }
        clubId: { type: string, nullable: true }
        location: { type: string, nullable: true }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, nullable: true }
        signupStartAt: { type: string, format: date-time, nullable: true }
        signupEndAt: { type: string, format: date-time, nullable: true }
        capacity: { type: integer, description: '0 = 不限' }
        signedCount: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, FINISHED] }

    EventSignup:
      type: object
      properties:
        id: { type: string }
        eventId: { type: string }
        userId: { type: string }
        status: { type: string, enum: [CONFIRMED, WAITLIST, CANCELLED] }
        waitlistPos: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

    MenuDish:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        mealType: { type: string, enum: [LUNCH, SNACK] }
        price: { type: number, nullable: true }
        image: { type: string, nullable: true }
        description: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        soldOut: { type: boolean }
        avgScore: { type: number, format: float }
        ratingCount: { type: integer }
        likedCount: { type: integer }

    Notice:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        content: { type: string }
        kind: { type: string, enum: [NORMAL, URGENT, CALENDAR] }
        isPinned: { type: boolean }
        coverImage: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
