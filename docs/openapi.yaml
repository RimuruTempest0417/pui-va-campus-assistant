      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [all, notice, item], default: all } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [notice, item] }
                        id: { type: string }
                        title: { type: string }
                        subtitle: { type: string, description: '公告＝kind（NORMAL／URGENT／CALENDAR）；失物＝地點' }
                        itemType: { type: string, enum: [LOST, FOUND], description: 只有失物才有 }
                        deletedAt: { type: string, format: date-time }
                        deletedByName: { type: string, nullable: true, description: 公告讀 deletedBy，失物由審計紀錄回推 }
                  counts:
                    type: object
                    properties:
                      notice: { type: integer }
                      item: { type: integer }
                      all: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trash/restore:
