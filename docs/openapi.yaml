openapi: 3.0.3
info:
  title: 培華校園助手 API
  version: 1.0.0
  description: |
    澳門培華中學「培華校園助手」小程序後端契約。
    認證：Authorization: Bearer <JWT>（/auth/login 除外）。
    錯誤格式：{ "error": { "code", "message", "details"? } }
servers:
  - url: https://api.example.edu.mo/api/v1
    description: 生產（已備案域名，待填）
  - url: http://127.0.0.1:3000/api/v1
    description: 本地開發
tags:
  - name: auth
  - name: items
  - name: events
  - name: menu
  - name: notices
  - name: uploads
  - name: parents
  - name: admin

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: 微信登入（code2Session）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: wx.login 取得的 code }
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [auth]
      summary: 當前使用者
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      summary: 更新暱稱／班級
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 64 }
                className: { type: string, maxLength: 32 }
                grade: { type: string, maxLength: 16 }
      responses:
        '200':
          description: 更新後的使用者
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /items:
    get:
      tags: [items]
      summary: 失物列表（篩選＋分頁）
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [LOST, FOUND] } }
        - { in: query, name: categoryId, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [OPEN, MATCHED, CLAIMED, CLOSED] } }
        - { in: query, name: q, schema: { type: string }, description: 標題／描述關鍵字 }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LostItem' }
    post:
      tags: [items]
      summary: 發布失物／拾獲
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LostItemInput' }
      responses:
        '201':
          description: 建立成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostItem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /items/mine:
    get:
      tags: [items]
      summary: 我發布的失物
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LostItem' }

  /categories:
    get:
      tags: [items]
      summary: 分類清單（失物用）
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [LOST, FOUND] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        key: { type: string }
                        name: { type: string }
                        icon: { type: string, nullable: true }

  /items/{id}/matches:
    get:
      tags: [items]
      summary: 失物智能匹配（相反類型、加權評分）
      description: |
        加權：同分類 0.35、地點相似（pg_trgm > 0.4）0.25、時間差 3 天內 0.15、標題／描述相似 0.25。
        閘門：地點或文字至少要有一項像，否則不回傳；總分低於 0.45 也不回傳。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 推薦清單（最多 5 筆）
          content:
            application/json:
              schema:
                type: object
                properties:
                  minScore: { type: number, example: 0.45 }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        type: { type: string, enum: [LOST, FOUND] }
                        title: { type: string }
                        place: { type: string }
                        happenedAt: { type: string, format: date-time }
                        score: { type: number }
                        reasons:
                          type: array
                          items: { type: string, example: 同分類 }
        '404': { $ref: '#/components/responses/NotFound' }

  /items/matches:
    get:
      tags: [items]
      summary: 智能匹配推薦
      parameters:
        - { in: query, name: itemId, required: true, schema: { type: string } }
      responses:
        '200':
          description: 依分數降序，低於 0.45 不回傳
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        score: { type: number, format: float }
                        reasons:
                          type: array
                          items: { type: string }

  /items/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [items]
      summary: 失物詳情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [items]
      summary: 修改（作者或 ADMIN）
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LostItemInput' }
      responses:
        '200':
          description: 修改後
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [items]
      summary: 下架（soft delete）
      responses:
        '204': { description: 已刪除 }
        '403': { $ref: '#/components/responses/Forbidden' }

  /items/{id}/claims:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [items]
      summary: 申請認領
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 300, description: 特徵描述，防冒領 }
      responses:
        '201':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemClaim' }
        '409':
          description: 已有人認領或本人已申請
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /claims/{id}:
    patch:
      tags: [items]
      summary: 審批認領申請（發布者本人或老師以上）
      description: |
        APPROVE 後物品轉為 CLAIMED，同物品其他待審申請自動 REJECTED。
        需要 JWT；非發布者且非 TEACHER/ADMIN/SUPER_ADMIN 回 403。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string }, description: claim id }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
                note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 審批結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemClaim' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events:
    get:
      tags: [events]
      summary: 活動列表
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, FINISHED] } }
        - { in: query, name: clubId, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }

  /events/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [events]
      summary: 活動詳情（含我是否已報名）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Event'
                  - type: object
                    properties:
                      mySignup:
                        type: object
                        nullable: true
                        properties:
                          status: { type: string, enum: [CONFIRMED, WAITLIST, CANCELLED] }
                          waitlistPos: { type: integer, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/signup:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [events]
      summary: 報名（名額樂觀鎖，滿員回 409）
      responses:
        '201':
          description: 報名成功或已進入候補
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSignup' }
        '409':
          description: EVENT_FULL 或 ALREADY_SIGNED_UP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [events]
      summary: 取消報名（觸發候補自動補位）
      responses:
        '204': { description: 已取消 }

  /events/mine:
    get:
      tags: [events]
      summary: 我的報名（含候補位置）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EventSignup' }

  /menu/week:
    get:
      tags: [menu]
      summary: 某一週的菜單（週一到週五，依日期分組）
      parameters:
        - { in: query, name: weekStart, schema: { type: string, format: date }, description: '該週任一週一日期，如 2026-10-19；不帶則由 weekOffset 推算' }
        - { in: query, name: weekOffset, schema: { type: integer, default: 0, minimum: -8, maximum: 8 }, description: '0 = 本週、1 = 下週' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  weekStart: { type: string, format: date }
                  weekEnd: { type: string, format: date }
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        lunch:
                          type: array
                          items: { $ref: '#/components/schemas/MenuDish' }
                        snack:
                          type: array
                          items: { $ref: '#/components/schemas/MenuDish' }
  /dishes/{id}/ratings:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [menu]
      summary: 評分／點讚（upsert，一人一評）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                liked: { type: boolean }
                comment: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 更新後的平均分與評分數
          content:
            application/json:
              schema:
                type: object
                properties:
                  avgScore: { type: number, format: float }
                  ratingCount: { type: integer }
                  likedCount: { type: integer }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /dishes/top:
    get:
      tags: [menu]
      summary: 熱門菜式排行
      parameters:
        - { in: query, name: days, schema: { type: integer, default: 7 } }
        - { in: query, name: limit, schema: { type: integer, default: 10, maximum: 30 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MenuDish' }

  /notices:
    get:
      tags: [notices]
      summary: 公告列表（預設排除已過期）
      parameters:
        - { in: query, name: kind, schema: { type: string, enum: [NORMAL, URGENT, CALENDAR] } }
        - { in: query, name: pinnedOnly, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notice' }

  /notices/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [notices]
      summary: 公告詳情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notice' }
        '404': { $ref: '#/components/responses/NotFound' }

  /subscriptions:
    post:
      tags: [notices]
      summary: 記錄訂閱消息同意（使用者按「允許」後才會有）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateIds]
              properties:
                templateIds: { type: array, items: { type: string }, minItems: 1, maxItems: 3 }
                scene: { type: string, enum: [claim, event, notice], default: claim }
      responses:
        '200':
          description: 已記錄
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  scene: { type: string }
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [notices]
      summary: 我的訂閱同意記錄
      responses:
        '200': { description: OK }

  /parents/me/children:
    get:
      tags: [parents]
      summary: 我的子女（家長端；parentId 一律取自 JWT）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        linkId: { type: string }
                        relation: { type: string, enum: [father, mother, guardian] }
                        relationLabel: { type: string }
                        studentId: { type: string }
                        nickname: { type: string, nullable: true }
                        grade: { type: string, nullable: true }
                        className: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parents/me/children/{studentId}:
    parameters:
      - { in: path, name: studentId, required: true, schema: { type: string } }
    get:
      tags: [parents]
      summary: 子女概況（報名、認領件數、未讀公告）
      description: |
        studentId 只是查詢鍵，必須存在於 parent_links 才算數。
        沒有綁定關係一律 403 且訊息固定（不區分「不存在」與「不是你的孩子」），避免學號探測。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  student:
                    type: object
                    properties:
                      id: { type: string }
                      nickname: { type: string, nullable: true }
                      grade: { type: string, nullable: true }
                      className: { type: string, nullable: true }
                  relation: { type: string }
                  relationLabel: { type: string }
                  signups:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        status: { type: string, enum: [CONFIRMED, WAITLIST, CANCELLED] }
                        waitlistPos: { type: integer, nullable: true }
                        event:
                          type: object
                          properties:
                            id: { type: string }
                            title: { type: string }
                            startAt: { type: string, format: date-time }
                            location: { type: string, nullable: true }
                  claimCount: { type: integer }
                  unreadNotices: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parents/me/children/{studentId}/items:
    parameters:
      - { in: path, name: studentId, required: true, schema: { type: string } }
    get:
      tags: [parents]
      summary: 子女發布的失物／拾獲（唯讀，最多 20 筆）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LostItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parents/me/children/{studentId}/claims:
    parameters:
      - { in: path, name: studentId, required: true, schema: { type: string } }
    get:
      tags: [parents]
      summary: 子女提出的認領申請（唯讀，最多 20 筆）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
                        message: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
                        handledAt: { type: string, format: date-time, nullable: true }
                        item:
                          type: object
                          properties:
                            id: { type: string }
                            title: { type: string }
                            type: { type: string, enum: [LOST, FOUND] }
                            status: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/parents:
    get:
      tags: [parents]
      summary: 家長綁定列表（需 parent:manage）
      parameters:
        - { in: query, name: q, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  relations:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/parents/link:
    post:
      tags: [parents]
      summary: 建立家長—學生綁定（需 parent:manage）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentAccount, studentAccount]
              properties:
                parentAccount: { type: string, description: 家長帳號（User.openid） }
                studentAccount: { type: string, description: 學生帳號（User.openid） }
                relation: { type: string, enum: [father, mother, guardian], default: guardian }
                note: { type: string, maxLength: 120 }
      responses:
        '201': { description: 已建立 }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/parents/link/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    delete:
      tags: [parents]
      summary: 解除綁定（需 parent:manage）
      responses:
        '200': { description: 已解除 }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /uploads/signature:
    post:
      tags: [uploads]
      summary: 取得 COS 直傳簽名（POST Object policy）
      description: |
        圖片不經過 API，客戶端拿 policy + signature 直接 POST 到 host。
        未配置 COS_* 環境變數時回 422 並說明缺哪一組設定，**不會**回假簽名。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose: { type: string, enum: [item, avatar, notice], default: item }
                ext: { type: string, enum: [jpg, jpeg, png, webp], default: jpg }
      responses:
        '200':
          description: 簽名資訊
          content:
            application/json:
              schema:
                type: object
                properties:
                  host: { type: string }
                  keyPrefix: { type: string }
                  policy: { type: string }
                  signature: { type: string }
                  qSignAlgorithm: { type: string, default: sha1 }
                  expiredAt: { type: integer, description: Unix 秒 }
                  maxBytes: { type: integer, example: 4194304 }
                  cdnBase: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/login:
    post:
      tags: [admin]
      summary: 教職員後台登入（帳號密碼）
      description: |
        帳號 = 使用者的 openid（由 SUPER_ADMIN 指派並設定密碼）；學生沒有密碼，走 wx.login。
        回傳 JWT（12 小時），角色需為 TEACHER／ADMIN／SUPER_ADMIN。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string }
                password: { type: string, minLength: 6 }
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string }
                  nickname: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stats:
    get:
      tags: [admin]
      summary: 營運數據（需 stats:read）
      responses:
        '200':
          description: 統計
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/items:
    get:
      tags: [admin]
      summary: 失物清單（含已下架，需 item:moderate）
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [OPEN, MATCHED, CLAIMED, CLOSED] } }

  /admin/items/{id}:
    patch:
      tags: [admin]
      summary: 下架／恢復失物（軟刪除，寫審計）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [REMOVE, RESTORE] }
                reason: { type: string, maxLength: 200 }

  /admin/claims:
    get:
      tags: [admin]
      summary: 認領申請清單（需 item:review）
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [PENDING, APPROVED, REJECTED], default: PENDING } }

  /admin/events:
    get:
      tags: [admin]
      summary: 活動清單（匯出 CSV 用，需 event:export）

  /admin/events/{id}/signups:
    get:
      tags: [admin]
      summary: 報名名單 JSON（小程序內後台用，需 event:export）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 名單（最多 200 筆）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        nickname: { type: string, nullable: true }
                        grade: { type: string, nullable: true }
                        className: { type: string, nullable: true }
                        status: { type: string, enum: [CONFIRMED, WAITLIST] }
                        waitlistPos: { type: integer, nullable: true }
                        createdAt: { type: string, format: date-time }

  /admin/events/{id}/signups.csv:
    get:
      tags: [admin]
      summary: 報名名單 CSV（UTF-8 BOM）
      description: 需 event:export；含正取／候補、候補順位、年級班別、報名時間。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: text/csv
          content:
            text/csv:
              schema: { type: string }

  /admin/dishes/ensure:
    post:
      tags: [admin]
      summary: 依菜名取得或建立菜色（排菜單用，需 menu:manage）

  /admin/menu:
    post:
      tags: [admin]
      summary: 排菜單（同日同餐別覆蓋，需 menu:manage）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, mealType, dishIds]
              properties:
                date: { type: string, format: date }
                mealType: { type: string, enum: [LUNCH, SNACK] }
                dishIds: { type: array, items: { type: string }, maxItems: 6 }

  /admin/notices:
    post:
      tags: [admin]
      summary: 發公告（可推送訂閱消息）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string, maxLength: 120 }
                content: { type: string }
                kind: { type: string, enum: [NORMAL, URGENT, CALENDAR] }
                isPinned: { type: boolean }
                push: { type: boolean, description: 是否發訂閱消息 }
      responses:
        '201':
          description: 建立成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notice' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stats:
    get:
      tags: [admin]
      summary: 營運看板數據
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  dau: { type: integer }
                  itemCount7d: { type: integer }
                  signupCount7d: { type: integer }
                  claimSuccessRate: { type: number, format: float }

  /dishes/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [menu]
      summary: 菜式詳情（含平均分與評分數）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuDish' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notices/read-all:
    post:
      tags: [notices]
      summary: 全部標為已讀
      description: '打開公告詳情（GET /notices/{id}）本身就會標該則已讀。'
      responses:
        '200':
          description: 已讀數量
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /subscriptions:
    post:
      tags: [notices]
      summary: 記錄使用者同意的訂閱模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templates]
              properties:
                templates:
                  type: array
                  items:
                    type: string
                    enum: [itemClaimed, eventOpen, urgentNotice]
      responses:
        '204': { description: 已記錄 }

  /admin/items:
    get:
      tags: [admin]
      summary: 待審核／全部失物
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [OPEN, MATCHED, CLAIMED, CLOSED] } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LostItem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/items/{id}/approve:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [admin]
      summary: 審核失物（通過／下架）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 審核後狀態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostItem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/menu:
    post:
      tags: [admin]
      summary: 批次排菜單（upsert）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required: [date, mealType, dishId]
                    properties:
                      date: { type: string, format: date }
                      mealType: { type: string, enum: [LUNCH, SNACK] }
                      dishId: { type: string }
                      soldOut: { type: boolean }
      responses:
        '200':
          description: 寫入結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  upserted: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/events/{id}/signups:
    get:
      tags: [admin]
      summary: 報名名單 JSON（小程序內後台用，需 event:export）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 名單（最多 200 筆）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        nickname: { type: string, nullable: true }
                        grade: { type: string, nullable: true }
                        className: { type: string, nullable: true }
                        status: { type: string, enum: [CONFIRMED, WAITLIST] }
                        waitlistPos: { type: integer, nullable: true }
                        createdAt: { type: string, format: date-time }

  /admin/events/{id}/signups.csv:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [admin]
      summary: 匯出報名名單（CSV）
      responses:
        '200':
          description: CSV 檔案
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: 未認證
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: 欄位驗證失敗
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 觸發限流
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, VALIDATION_FAILED, EVENT_FULL,
                 ALREADY_SIGNED_UP, ALREADY_CLAIMED, CONTENT_RISKY, RATE_LIMITED]
            message: { type: string }
            details: { type: object, nullable: true }

    Page:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        hasMore: { type: boolean }

    User:
      type: object
      properties:
        id: { type: string }
        nickname: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        role: { type: string, enum: [STUDENT, TEACHER, ADMIN] }
        grade: { type: string, nullable: true }
        className: { type: string, nullable: true }

    LostItemInput:
      type: object
      required: [type, title, place, happenedAt]
      properties:
        type: { type: string, enum: [LOST, FOUND] }
        title: { type: string, maxLength: 80 }
        description: { type: string }
        categoryId: { type: string, nullable: true }
        place: { type: string, maxLength: 120 }
        happenedAt: { type: string, format: date-time }
        contactType: { type: string, enum: [inApp, wechat, phone] }
        contactValue: { type: string, nullable: true }
        images:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              key: { type: string, description: COS 物件 key }
              width: { type: integer }
              height: { type: integer }

    LostItem:
      allOf:
        - $ref: '#/components/schemas/LostItemInput'
        - type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [OPEN, MATCHED, CLAIMED, CLOSED] }
            author: { $ref: '#/components/schemas/User' }
            viewCount: { type: integer }
            claimCount: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    ItemClaim:
      type: object
      properties:
        id: { type: string }
        itemId: { type: string }
        claimantId: { type: string }
        message: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        createdAt: { type: string, format: date-time }
        handledAt: { type: string, format: date-time, nullable: true }

    Event:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        coverImage: { type: string, nullable: true }
        description: { type: string, nullable: true }
        clubId: { type: string, nullable: true }
        location: { type: string, nullable: true }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, nullable: true }
        signupStartAt: { type: string, format: date-time, nullable: true }
        signupEndAt: { type: string, format: date-time, nullable: true }
        capacity: { type: integer, description: '0 = 不限' }
        signedCount: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, FINISHED] }

    EventSignup:
      type: object
      properties:
        id: { type: string }
        eventId: { type: string }
        userId: { type: string }
        status: { type: string, enum: [CONFIRMED, WAITLIST, CANCELLED] }
        waitlistPos: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

    MenuDish:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        mealType: { type: string, enum: [LUNCH, SNACK] }
        price: { type: number, nullable: true }
        image: { type: string, nullable: true }
        description: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        soldOut: { type: boolean }
        avgScore: { type: number, format: float }
        ratingCount: { type: integer }
        likedCount: { type: integer }

    Notice:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        content: { type: string }
        kind: { type: string, enum: [NORMAL, URGENT, CALENDAR] }
        isPinned: { type: boolean }
        coverImage: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
