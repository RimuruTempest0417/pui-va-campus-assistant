      responses:
        '200':
          description: 範本 CSV（第一列為欄名，可直接改內容後匯入）
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/import/events:
    post:
      tags: [admin]
      summary: 批次建立活動（逐列回報，同名同時段只提示不覆蓋；需 event:create）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string, description: CSV 全文，第一列為欄名 }
                dryRun: { type: boolean, default: false, description: 只驗證不寫入 }
      responses:
        '200':
          description: 逐列結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, enum: [events, menu] }
                  dryRun: { type: boolean }
                  total: { type: integer }
                  success: { type: integer }
                  failed: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        line: { type: integer }
                        ok: { type: boolean }
                        message: { type: string }
                        label: { type: string, description: 標題或日期餐別 }
                        id: { type: string, description: 成功時建立後的 id }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/import/menu:
    post:
      tags: [admin]
      summary: 批次匯入菜單（同日同餐合併為一組並整組取代；菜名自動建立；需 menu:manage）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string, description: CSV 全文，第一列為欄名 }
                dryRun: { type: boolean, default: false }
      responses:
        '200':
          description: 逐列結果（同日同餐的多列會各自回報同一組的結果）
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, enum: [events, menu] }
                  dryRun: { type: boolean }
                  total: { type: integer }
                  success: { type: integer }
                  failed: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        line: { type: integer }
                        ok: { type: boolean }
                        message: { type: string }
                        label: { type: string, description: 標題或日期餐別 }
                        id: { type: string, description: 成功時建立後的 id }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/notices:
    get:
      tags: [admin]
      summary: 公告列表（後台）
      description: |
        W-58：每列多回 `scheduled`（`publishedAt` 在未來＝排程中，前台看不到）。
        後台清單**不過濾**未到時間的公告，老師才看得到自己排了什麼。
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [admin]
      summary: 發公告（可推送訂閱消息）
      description: |
        W-58 預約發佈：帶 `publishedAt`（未來的時間）＝排程，到時間之前公開清單與詳情頁都回 404。
        限制：**緊急公告（URGENT）不能預約**（422，緊急要立即發才有通知）、最多預約 **90 天**。
        回應多一個 `scheduled` 布林值讓前端知道是「已發佈」還是「已排程」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string, maxLength: 120 }
                content: { type: string }
                kind: { type: string, enum: [NORMAL, URGENT, CALENDAR] }
                isPinned: { type: boolean }
                push: { type: boolean, description: 是否發訂閱消息 }
                publishedAt:
                  type: string
                  format: date-time
                  description: 發佈時間；不帶＝立即發佈，帶未來時間＝預約（最多 90 天）
                expiresAt: { type: string, format: date-time, description: 有效期至（可空） }
      responses:
        '201':
          description: 建立成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notice' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: 欄位驗證失敗（含「緊急公告不能預約」「超過 90 天」） }

  /admin/stats:
    get:
      tags: [admin]
      summary: 營運看板數據（需 stats:read）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: integer, description: 使用者總數 }
                  byRole:
                    type: object
                    description: 各角色人數（鍵為 Role 列舉值）
                    additionalProperties: { type: integer }
                  items:
                    type: object
                    properties:
                      open: { type: integer }
                      claimed: { type: integer }
                      added7d: { type: integer }
                  claimsPending: { type: integer }
                  events: { type: integer }
                  signups:
                    type: object
                    properties:
                      confirmed: { type: integer }
                      waitlist: { type: integer }
                  noticesActive: { type: integer }
                  ratings:
                    type: object
                    properties:
                      count: { type: integer }
                      avg: { type: number, format: float }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stats/overview:
    get:
      tags: [admin]
      summary: 後台統計首頁五張數字卡（需 stats:read）
      description: >-
        本週＝滾動近 7 天。回傳五個即時 count：本週新使用者、本週報名（正取＋候補，不含已取消）、
        待審認領、未解決錯誤、未認領失物（已下架不計）。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  week:
                    type: object
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                  usersNew7d: { type: integer }
                  signups7d: { type: integer }
                  claimsPending: { type: integer }
                  errorsOpen: { type: integer }
                  itemsOpen: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /dishes/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [menu]
      summary: 菜式詳情（含平均分與評分數）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuDish' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notices/read-all:
    post:
      tags: [notices]
      summary: 全部標為已讀
      description: '打開公告詳情（GET /notices/{id}）本身就會標該則已讀。'
      responses:
        '200':
          description: 已讀數量
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/items:
    get:
      tags: [admin]
      summary: 待審核／全部失物（需 item:moderate）
      description: 回傳含已下架項目（deletedAt 非 null），供後台下架／恢復。
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [OPEN, MATCHED, CLAIMED, CLOSED] } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LostItem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/events/{id}/signups:
    get:
      tags: [admin]
      summary: 報名名單 JSON（小程序內後台用，需 event:export）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 名單（最多 200 筆）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        nickname: { type: string, nullable: true }
                        grade: { type: string, nullable: true }
                        className: { type: string, nullable: true }
                        status: { type: string, enum: [CONFIRMED, WAITLIST] }
                        waitlistPos: { type: integer, nullable: true }
                        createdAt: { type: string, format: date-time }

  /admin/events/{id}/signups.csv:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [admin]
      summary: 匯出報名名單（CSV，UTF-8 BOM）
      description: 欄位＝狀態（正取／候補）、候補順位、姓名、年級、班別、openid、報名時間；不含已取消；寫審計。
      responses:
        '200':
          description: CSV 檔案
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/events/{id}/feedback-stats:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [admin]
      summary: 活動回饋統計（平均分／回覆率／星等分佈／最近留言；需 event:create，老師只能看自己開的活動）
      description: |
        沒有回饋時 `avgRating` 與 `rate` 回 **null**（不是 0，否則會被讀成「大家都給 0 分」）；
        回覆率的分母是「正取且已簽到」的 `attended`，`attended = 0` 時 `rate` 也是 null（不除以零）。
        `distribution` 固定 5 筆（1–5 星，含 0）。
      responses:
        '200':
          description: 回饋統計
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId: { type: string }
                  title: { type: string }
                  count: { type: integer, description: 回饋份數 }
                  avgRating: { type: number, nullable: true, description: 1 位小數；0 份時 null }
                  attended: { type: integer, description: 分母：正取且已簽到 }
                  signed: { type: integer, description: 正取總數（僅供顯示，不是分母） }
                  rate: { type: integer, nullable: true, description: 回覆率百分比；count 或 attended 為 0 時 null }
                  distribution:
                    type: array
                    description: 1–5 星各幾人，固定 5 筆
                    items:
                      type: object
                      properties:
                        stars: { type: integer }
                        count: { type: integer }
                  recent:
                    type: array
                    description: 最近 5 條（新到舊）
                    items:
                      type: object
                      properties:
                        rating: { type: integer }
                        comment: { type: string, nullable: true }
                        nickname: { type: string }
                        createdAt: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/events/{id}/feedback-remind:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [admin]
      summary: 催填回饋（只催「正取＋已簽到＋還沒填」的人；需 event:create，老師只能催自己開的活動）
      description: |
        活動結束後提醒出席者補填回饋（站內通知一定有，微信訂閱消息只在對方按過允許時加發）。
        四條規則：① 沒簽到的人不催（沒來的人不該被要求評分，分母與 feedback-stats 的 `attended` 一致）；
        ② 已填回饋的人不催；③ 活動還沒結束回 422（回饋本身還沒開放）；
        ④ 同一活動 12 小時內催過的帳號跳過（靠 PushLog 判斷），老師連點兩下不會發兩輪。
      responses:
        '200':
          description: 催填結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  eligible: { type: integer, description: 應被提醒的人數（正取＋已簽到＋未填） }
                  reminded: { type: integer, description: 這次實際發出的人數 }
                  skipped: { type: integer, description: 12 小時內催過而跳過的人數 }
                  inApp: { type: integer, description: 站內通知送出數（與 reminded 相同，供兩套 UI 讀） }
                  wx: { type: integer, description: 微信訂閱消息成功數 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /client-errors:
    post:
      tags: [admin]
      summary: 用戶端錯誤上報（匿名可用；同一訊息＋頁面聚合成一列，只累加次數）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 300 }
                stack: { type: string, maxLength: 4000 }
                route: { type: string, maxLength: 200, description: 出錯的頁面路徑，例如 pages/items/list/index }
                platform: { type: string, maxLength: 32, description: ios / android / devtools }
                sdkVersion: { type: string, maxLength: 32, description: 微信基礎庫版本 }
                appVersion: { type: string, maxLength: 32 }
      responses:
        '202':
          description: 已記錄。同一指紋只留一列並累加 count；超過每 IP 每分鐘 20 則回 throttled true（刻意不用 429，上報失敗不該造成第二個錯誤）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  count: { type: integer }
                  throttled: { type: boolean }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /client-errors/report:
    post:
      tags: [admin]
      summary: 使用者手動回報問題（W-43；匿名可用，kind=USER_REPORT、level=WARN）
      description: |
        「按鈕沒反應」「畫面怪」這類沒有拋錯的問題，學生在設定頁按「回報問題」寫一句話送上來。
        與 POST /client-errors 共用同一套節流（每 IP 每分鐘 20 則）與聚合規則：
        同一句話＋同一頁面只留一列並累加 count，所以連按 5 次不會灌爆後台。
        指紋前面加 `report|`，因此「使用者說有問題」不會跟同一頁真的拋出的錯誤混在同一列。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 2, maxLength: 300, description: 使用者自己寫的一句話描述 }
                route: { type: string, maxLength: 200, description: 回報時所在的頁面，例如 pages/events/detail/index }
                platform: { type: string, maxLength: 32, description: ios / android / devtools }
                sdkVersion: { type: string, maxLength: 32, description: 微信基礎庫版本 }
                appVersion: { type: string, maxLength: 32 }
                model: { type: string, maxLength: 64, description: 機型，例如 iPhone 15（重現問題的唯一線索） }
                system: { type: string, maxLength: 64, description: 系統版本，例如 iOS 18.1 }
      responses:
        '201':
          description: 已建立（或累加）一筆使用者回報
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  count: { type: integer }
                  kind: { type: string, enum: [USER_REPORT] }
        '202':
          description: 超過每 IP 每分鐘 20 則，靜默丟掉並回 throttled true（上報失敗不該製造第二個錯誤）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  throttled: { type: boolean }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/errors:
    get:
      tags: [admin]
      summary: 錯誤日誌（預設按出現次數排序，需要 error:read = ADMIN 以上）
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [OPEN, RESOLVED] } }
        - { in: query, name: kind, schema: { type: string, enum: [CLIENT_ERROR, USER_REPORT] }, description: 留空＝全部；USER_REPORT 只看使用者手動回報 }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ErrorLog' }
                  summary:
                    type: object
                    properties:
                      open: { type: integer }
                      total: { type: integer, description: 所有錯誤的累計出現次數 }
                      kinds: { type: integer, description: 錯誤種類數 }
                      last24h: { type: integer }
                      userReports: { type: integer, description: 待處理的使用者手動回報筆數 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/errors/{id}:
    patch:
      tags: [admin]
      summary: 標記錯誤已解決／重新打開（再發生時後端會自動回到 OPEN）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [RESOLVE, REOPEN] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [OPEN, RESOLVED] }
                  resolvedAt: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/error-logs/cleanup:
    post:
      tags: [admin]
      summary: 清理舊錯誤紀錄（預設只刪已解決的；需要 error:read = ADMIN 以上）
      description: |
        OPEN 代表還沒修，自動刪掉等於把待辦事項藏起來，所以預設只刪「已解決」且最後出現時間早於 cutoff 的紀錄。
        要連未解決的一起清必須明確帶 `includeOpen: true`。回傳 kept 讓前端老實說「還有 N 筆沒動」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [olderThanDays]
              properties:
                olderThanDays: { type: integer, minimum: 1, maximum: 365 }
                includeOpen: { type: boolean, default: false, description: 連未解決的舊紀錄一起刪 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer, description: 實際刪除筆數 }
                  kept: { type: integer, description: 還留著的舊紀錄數（未解決的） }
                  olderThanDays: { type: integer }
                  includeOpen: { type: boolean }
                  cutoff: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/error-logs/resolve-similar:
    post:
      tags: [admin]
      summary: 同類一次解決（signature＝訊息＋頁面；需要 error:read = ADMIN 以上）
      description: |
        指紋含頁面，所以同一句話在不同頁面出錯會被拆成好幾列。省略 route 就一次解決「所有頁面」的同句話，
        帶 route 只解決那一頁。已 RESOLVED 的不重算 resolvedAt。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 300 }
                route: { type: string, nullable: true, description: 省略或 null＝不限頁面 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolved: { type: integer, description: 這次被標成已解決的筆數 }
                  matched: { type: integer, description: 符合 signature 的總筆數（含已解決） }
                  message: { type: string }
                  route: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/export.json:
    get:
      tags: [admin]
      summary: 全庫匯出（JSON 備份，只有最高權限）
      description: |
        一次匯出全部 18 張資料表的 JSON；還原用後端 repo 的 `node scripts/restore.mjs 備份檔 --yes`，
        刻意不提供 HTTP 還原端點（破壞性操作只留在終端）。檔案含 `users.passwordHash`，等同資料庫機密。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 備份檔（附件下載）
          headers:
            content-disposition: { schema: { type: string } }
            x-backup-rows: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  format: { type: string, enum: [pui-va-backup] }
                  version: { type: integer, enum: [1] }
                  appVersion: { type: string }
                  exportedAt: { type: string, format: date-time }
                  counts: { type: object, additionalProperties: { type: integer } }
                  data: { type: object, additionalProperties: { type: array, items: { type: object } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── 健康檢查（監控用，不需認證） ──
  /health:
    get:
      tags: [system]
      summary: 存活檢查
      responses:
        '200':
          description: 服務正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  uptime: { type: number }

  /health/deep:
    get:
      tags: [system]
      summary: 深度檢查（含資料庫）
      responses:
        '200':
          description: 服務與資料庫都正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: boolean }

  # ── 站內通知（W-34） ──
  /notifications:
    get:
      tags: [notifications]
      summary: 我的通知（最近 50 筆；W-96 支援分組）
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: unreadOnly
          schema: { type: string, enum: ['0', '1'] }
        - in: query
          name: group
          schema: { type: string, enum: [ALL, HOMEWORK, LIBRARY, APPROVAL, REPAIR, OTHER] }
          description: 不帶＝ALL。APPROVAL 收假單與場地借用
      responses:
        '200':
          description: 通知列表、未讀數與各組統計
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer, description: 全部未讀數（不隨 group 改變） }
                  group: { type: string, enum: [ALL, HOMEWORK, LIBRARY, APPROVAL, REPAIR, OTHER] }
                  groups:
                    type: array
                    description: 每個口袋的 total／unread，固定六列（ALL 在最前）
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        total: { type: integer }
                        unread: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        kind:
                          type: string
                          enum: [EVENT, CLAIM, NOTICE, ITEM, SYSTEM, HOMEWORK, PROPOSAL, REPAIR, LIBRARY, LEAVE, BOOKING]
                          description: ITEM＝失物配對主動通知（W-57）；LIBRARY／LEAVE／BOOKING 自 W-96 起分開記
                        group: { type: string, description: 該 kind 所屬的口袋 }
                        title: { type: string }
                        body: { type: string, nullable: true }
                        link: { type: string, nullable: true }
                        readAt: { type: string, format: date-time, nullable: true }
                        createdAt: { type: string, format: date-time }

  /notifications/unread-count:
    get:
      tags: [notifications]
      summary: 未讀數（首頁鈴鐺；可只算某一組）
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: group
          schema: { type: string, enum: [ALL, HOMEWORK, LIBRARY, APPROVAL, REPAIR, OTHER] }
      responses:
        '200':
          description: 未讀數
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }

  /notifications/read:
    patch:
      tags: [notifications]
      summary: 標記已讀（帶 id 標一筆，不帶就全部）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
      responses:
        '200':
          description: 已標記，回傳剩下未讀數
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  unread: { type: integer }

  /notifications/read-all:
    patch:
      tags: [notifications]
      summary: 一次全部已讀（W-96；可只清某一組，只動自己的通知）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                group: { type: string, enum: [ALL, HOMEWORK, LIBRARY, APPROVAL, REPAIR, OTHER] }
      responses:
        '200':
          description: 已清除，回傳清了幾筆與剩下未讀數
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  cleared: { type: integer }
                  unread: { type: integer }
                  group: { type: string }
        '422': { description: group 不是合法值（不會退化成全部已讀） }

  # ── 檢舉 ──
  /reports:
    post:
      tags: [reports]
      summary: 送出檢舉
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reason]
              properties:
                targetType: { type: string, example: ITEM }
                targetId: { type: string }
                reason: { type: string }
      responses:
        '201': { description: 已建立 }

  /admin/reports:
    get:
      tags: [admin]
      summary: 檢舉列表（教職員）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 檢舉列表 }

  /admin/reports/{id}:
    patch:
      tags: [admin]
      summary: 處理檢舉（標記已處理／駁回）
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [OPEN, RESOLVED, REJECTED] }
                note: { type: string }
      responses:
        '200': { description: 已更新 }

  # ── 訂閱消息同意狀態 ──
  /subscriptions/check:
    get:
      tags: [notifications]
      summary: 查詢是否已同意某個訂閱模板
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: templateId
          schema: { type: string }
        - in: query
          name: scene
          schema: { type: string }
      responses:
        '200':
          description: 同意狀態
          content:
            application/json:
              schema:
                type: object
                properties:
                  agreed: { type: boolean }

  # ── 使用者管理（等級低於自己才可操作） ──
  /admin/users/{id}/ban:
    patch:
      tags: [admin]
      summary: 停用／恢復帳號
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                banned: { type: boolean }
      responses:
        '200': { description: 已更新 }

  /admin/users/{id}/unlock:
    post:
      tags: [admin]
      summary: 解除登入失敗鎖定（連續 5 次密碼錯會鎖 15 分鐘；需 user:ban 能力）
      description: 只能解鎖等級低於自己的帳號；回 403 代表能力或等級不足、404 代表帳號不存在。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已解除鎖定（failedLogins 歸零、lockedUntil 清空）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  locked: { type: boolean }
        '403': { description: 能力或等級不足 }
        '404': { description: 找不到使用者 }

  /admin/permissions:
    get:
      tags: [admin]
      summary: 能力矩陣（角色 × 能力）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 能力矩陣 }

  /admin/push-logs:
    get:
      tags: [admin]
      summary: 推送紀錄（誰收到、誰沒收到、為什麼；需要 push:read = ADMIN 以上）
      parameters:
        - { in: query, name: ok, schema: { type: string, enum: [all, ok, failed], default: all } }
        - { in: query, name: channel, schema: { type: string, enum: [INAPP, WX] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        userId: { type: string }
                        nickname: { type: string, nullable: true, description: 使用者已被刪除時為 null }
                        role: { type: string, nullable: true }
                        channel: { type: string, enum: [INAPP, WX] }
                        scene: { type: string, nullable: true }
                        title: { type: string, nullable: true }
                        templateId: { type: string, nullable: true }
                        ok: { type: boolean }
                        error: { type: string, nullable: true, description: '失敗原因：no-consent／no-user／errcode N' }
                        createdAt: { type: string, format: date-time }
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      ok: { type: integer }
                      failed: { type: integer }
                      last24h: { type: integer }
                  templates:
                    type: object
                    description: 微信模板是否已設定（false＝該場景根本不會發微信消息）
                    properties:
                      claim: { type: boolean }
                      event: { type: boolean }
                      notice: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/audit:
    get:
      tags: [admin]
      summary: 審計紀錄
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 審計紀錄列表 }

  /admin/audit.csv:
    get:
      tags: [admin]
      summary: 審計紀錄匯出 CSV（UTF-8 BOM，最高權限）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: CSV 檔
          content:
            text/csv:
              schema: { type: string }

  /admin/trash:
    get:
      tags: [admin]
      summary: 資源回收桶（已刪的公告與下架的失物；需要 trash:manage = ADMIN 以上）
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [all, notice, item], default: all } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [notice, item] }
                        id: { type: string }
                        title: { type: string }
                        subtitle: { type: string, description: '公告＝kind（NORMAL／URGENT／CALENDAR）；失物＝地點' }
                        itemType: { type: string, enum: [LOST, FOUND], description: 只有失物才有 }
                        deletedAt: { type: string, format: date-time }
                        deletedByName: { type: string, nullable: true, description: 公告讀 deletedBy，失物由審計紀錄回推 }
                  counts:
                    type: object
                    properties:
                      notice: { type: integer }
                      item: { type: integer }
                      all: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trash/{type}/{id}:
    delete:
      tags: [admin]
      summary: 永久刪除（資源回收桶裡的「刪除」；需要 trash:manage = ADMIN 以上）
      description: |
        只刪 `deletedAt` 不為 null 的那筆（還在架上的資料用下架／軟刪除端點）。
        失物會先清掉認領申請與圖片，公告先清已讀紀錄，否則外鍵會擋。
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: type, required: true, schema: { type: string, enum: [notice, item, event] } }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 已永久刪除
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  purged: { type: boolean }
                  type: { type: string }
                  id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/trash/restore:
    post:
      tags: [admin]
      summary: 還原垃圾桶裡的一筆內容（需要 trash:manage = ADMIN 以上）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id]
              properties:
                type: { type: string, enum: [notice, item] }
                id: { type: string }
      responses:
        '200':
          description: 已還原
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  type: { type: string }
                  id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound', description: '不存在，或本來就沒被刪除（兩者不區分）' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/notices/{id}:
    patch:
      tags: [admin]
      summary: 編輯公告
      description: |
        W-58：帶 `publishedAt` 可以把排程中的公告**提前上線**（帶現在的瞬間）或延後。
        改成未來時間時沿用原本的 `kind` 判斷 —— 緊急公告仍然不能排到未來（422）。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
                kind: { type: string, enum: [NORMAL, URGENT, CALENDAR] }
                isPinned: { type: boolean }
                expiresAt: { type: string, format: date-time, nullable: true }
                publishedAt: { type: string, format: date-time, description: 改發佈時間（未來＝排程，現在＝立即上線） }
                version:
                  type: integer
                  description: 'W-42 樂觀鎖：帶回讀到的版本；不符回 409，不帶＝舊客戶端（相容，照樣成功並遞增）'
      responses:
        '200': { description: 已更新（回應含 scheduled 布林值） }
        '409': { description: '版本衝突（別人先改過），請重新載入後再存' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin]
      summary: 刪除公告
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已刪除 }

  /admin/notices/{id}/read-stats:
    get:
      tags: [admin]
      summary: 公告已讀統計（誰看了、誰還沒看；W-54）
      description: 分母＝未被停用的帳號數（含教職員）。名單各回前 30 位，多的用 truncated 旗標標示。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  audience: { type: integer, description: 分母＝全體未停用帳號數（＝total，新呼叫端讀這個名字） }
                  total: { type: integer, description: 全體未停用帳號數 }
                  read: { type: integer }
                  unread: { type: integer }
                  rate:
                    type: integer
                    nullable: true
                    description: 已讀百分比（四捨五入）；分母 0 時回 null，不是 0
                  byRole:
                    type: array
                    description: 六級各一列（即使該級 0 人也照列），順序固定 PARENT→SUPER_ADMIN
                    items:
                      type: object
                      properties:
                        role: { type: string }
                        label: { type: string }
                        total: { type: integer }
                        read: { type: integer }
                        unread: { type: integer }
                        rate: { type: integer, nullable: true, description: 該級分母 0 時 null }
                  firstReadAt: { type: string, format: date-time, nullable: true }
                  lastReadAt: { type: string, format: date-time, nullable: true }
                  readers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        nickname: { type: string }
                        role: { type: string }
                        readAt: { type: string, format: date-time }
                  unreadUsers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        nickname: { type: string }
                        role: { type: string }
                        grade: { type: string, nullable: true }
                        className: { type: string, nullable: true }
                  truncated:
                    type: object
                    properties:
                      readers: { type: boolean }
                      unread: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 找不到這則公告或已經刪除 }

  /admin/notices/{id}/read-stats/export:
    get:
      tags: [admin]
      summary: 公告已讀名單 CSV（完整一份，只有網頁後台用；W-107）
      description: |
        畫面上的名單各截 30 位，貼群組或逐班催人時需要完整一份。
        CSV 帶 UTF-8 BOM、`x-row-count` 標頭，並寫一筆 `notice.read_export` 審計（逐人已讀屬個資）。
        分母口徑與 `/read-stats` 相同：未被停用的帳號。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [ALL, READ, UNREAD], default: ALL }
          description: 只匯出已讀或未讀的人；預設全部
      responses:
        '200':
          description: CSV（text/csv; charset=utf-8，帶 BOM）
          headers:
            x-row-count:
              schema: { type: string }
              description: 實際匯出的資料列數（不含標頭）
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 找不到這則公告或已經刪除 }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/notices/{id}/remind:
    post:
      tags: [admin]
      summary: 催讀公告（只通知未讀者；W-54）
      description: 只對未讀者發站內通知；有訂閱同意且設了 WX_TPL_NOTICE 才加發微信消息。12 小時內同一則公告已催過的帳號會跳過。
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  unread: { type: integer, description: 未讀人數 }
                  inApp: { type: integer, description: 實際發出的站內通知數 }
                  skipped: { type: integer, description: 12 小時內已催過而跳過的人數 }
                  wx: { type: integer, description: 加發的微信訂閱消息數 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 找不到這則公告或已經刪除 }
        '422': { description: 公告已過期，不需要再催讀 }

  /admin/menu/stats:
    get:
      tags: [admin]
      summary: 菜單評分統計（近 N 天，需 menu:manage）
      description: |
        平均分／評分人數／1–5 分分佈／按讚比例都由後端算，兩套後台只負責顯示。
        樣本 < 3 人的菜色 `enough = false`，只列在 `items`，不進 `best`／`worst` 排名。
        已下架（`isActive = false`）的菜不進統計。`days` 範圍 7–365，預設 30。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 7, maximum: 365, default: 30 } }
      responses:
        '200':
          description: 統計結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: { type: integer }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  sampleMin: { type: integer, example: 3 }
                  summary:
                    type: object
                    properties:
                      ratings: { type: integer }
                      dishes: { type: integer }
                      avgScore: { type: number, nullable: true, description: '按人數加權；沒人評分回 null' }
                      lowCount: { type: integer, description: '1–2 分的則數' }
                      lowRate: { type: number, nullable: true }
                      insufficient: { type: integer, description: '樣本不足的菜色數' }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        dishId: { type: string }
                        name: { type: string }
                        mealType: { type: string, enum: [LUNCH, SNACK] }
                        avgScore: { type: number }
                        count: { type: integer }
                        likedCount: { type: integer }
                        likedRate: { type: number }
                        lowCount: { type: integer }
                        lowRate: { type: number }
                        dist:
                          type: object
                          properties:
                            '1': { type: integer }
                            '2': { type: integer }
                            '3': { type: integer }
                            '4': { type: integer }
                            '5': { type: integer }
                        enough: { type: boolean }
                  best:
                    type: array
                    description: '平均分最高（只含 enough = true），最多 5 筆'
                    items: { type: object }
                  worst:
                    type: array
                    description: '1–2 分比例最高（只含 enough = true），最多 5 筆'
                    items: { type: object }
        '401': { description: 未登入 }
        '403': { description: '沒有 menu:manage 能力' }
        '422': { description: 'days 超出 7–365' }

  /admin/menu/{id}:
    delete:
      tags: [admin]
      summary: 移除某一天的菜單
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已移除 }

  # ── 外部校曆（iCalendar 唯讀） ──
  /calendar/external:
    get:
      tags: [calendar]
      summary: 外部校曆場次（10 分鐘快取，可多來源）
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: refresh
          schema: { type: string, enum: ['0', '1'] }
      responses:
        '200':
          description: 場次與各來源狀態
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { type: object }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        ok: { type: boolean }
                        count: { type: integer }
                        error: { type: string, nullable: true }

  # ── 校曆匯出（W-108：輸出 iCalendar，公開內容） ──
  /calendar/export.ics:
    get:
      tags: [calendar]
      summary: 把公告與活動匯出成 .ics（今天起 90 天，訪客也可下載）
      description: |
        每筆公告與活動一個 `VEVENT`（全天事件，`DTSTART;VALUE=DATE` 用澳門日界）。
        RFC 5545 跳脫（逗號／分號／反斜線）、換行寫成字面 `\n`、每行 75 octets 折行；
        軟刪除、未到發佈時間、已過期、草稿與已取消的活動都不輸出。
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 7, maximum: 365, default: 90 }
      responses:
        '200':
          description: iCalendar 文件（`x-event-count` 是筆數）
          headers:
            x-event-count:
              schema: { type: integer }
          content:
            text/calendar:
              schema: { type: string }
        '422': { description: days 不在 7–365 之間 }

  /calendar/me.ics:
    get:
      tags: [calendar]
      summary: 個人校曆訂閱（權杖在網址上，日曆 App 自己回來抓）
      description: |
        給日曆 App「訂閱」用的網址：公開的公告與活動（與 `/calendar/export.ics` 同一支查詢）
        加上只有本人看得到的行程 —— 我的報名（正取／候補）、已批准的假單、本人班別的功課截止、
        **未歸還的借閱到期**（`me-loan-`）與**已批准的場地／器材借用**（`me-booking-`）。
        報名資訊是**合併**進該活動的說明，不會多出第二個事件；個人行程的 `UID` 帶 `me-` 前綴。
        權杖不符、已撤銷、帳號停用一律 404（不揭露權杖是否存在）；`cache-control: private`。
      parameters:
        - { in: query, name: token, required: true, schema: { type: string } }
        - in: query
          name: days
          schema: { type: integer, minimum: 7, maximum: 365, default: 90 }
      responses:
        '200':
          description: iCalendar 文件（`x-event-count` 總筆數、`x-personal-count` 個人行程筆數）
          headers:
            x-event-count: { schema: { type: integer } }
            x-personal-count: { schema: { type: integer } }
          content:
            text/calendar:
              schema: { type: string }
        '404': { description: 權杖不存在／已撤銷／帳號停用 }
        '422': { description: days 不在 7–365 之間 }

  # ── 活動回饋（W-31） ──
  /events/{id}/feedback:
    post:
      tags: [events]
      summary: 送出回饋（需正取且活動已結束，一人一次可改）
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 300 }
      responses:
        '200': { description: 已記錄 }
    get:
      tags: [events]
      summary: 回饋摘要（平均分、筆數、我的、最近 20 條留言）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 回饋摘要
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  avg: { type: number }
                  mine: { type: object, nullable: true }
                  items: { type: array, items: { type: object } }

  # ── 組隊報名（W-30） ──
  /events/{id}/teams:
    post:
      tags: [events]
      summary: 建立隊伍（回 6 碼邀請碼）
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 40 }
      responses:
        '201': { description: 已建立，回傳 code }
    get:
      tags: [events]
      summary: 隊伍列表（人數；只有隊長看得到邀請碼）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 隊伍列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        members: { type: integer }
                        mine: { type: boolean }
                        code: { type: string, nullable: true }
        '404': { description: 活動不存在 }

  /events/{id}/attachments:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [events]
      summary: 新增活動附件（老師以上，只能動自己開的活動；上限 10 份）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string, maxLength: 120 }
                url: { type: string, maxLength: 1024, description: 只接受 http(s) 連結（COS 直傳後的網址或老師貼的學校連結） }
                size: { type: integer, nullable: true, description: 檔案大小 bytes；貼連結時不填 }
                type: { type: string, enum: [pdf, doc, docx, xls, xlsx, ppt, pptx, zip, ics, link] }
      responses:
        '201':
          description: 已新增
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventAttachment' }
        '403': { description: FORBIDDEN（學生，或不是自己開的活動） }
        '422': { description: 連結格式不對／名稱空白／已達 10 份上限 }

  /events/{id}/attachments/{attachmentId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: attachmentId, required: true, schema: { type: string } }
    delete:
      tags: [events]
      summary: 刪除活動附件（同一個權限閘門；不存在或不屬於這個活動都回 404）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 已刪除 }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }

  /admin:
    get:
      tags: [admin]
      summary: 後台 HTML 頁（不需認證，登入在頁內做）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /admin/2fa-ui:
    get:
      tags: [admin]
      summary: 兩步驗證設定頁（HTML）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /admin/2fa:
    get:
      tags: [admin]
      summary: 查詢我的兩步驗證狀態
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /admin/2fa/begin:
    post:
      tags: [admin]
      summary: 產生 TOTP 密鑰與 8 組備用碼
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /admin/2fa/enable:
    post:
      tags: [admin]
      summary: 輸入 6 位碼完成開啟（回傳備用碼）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /admin/2fa/disable:
    post:
      tags: [admin]
      summary: 關閉兩步驗證（需密碼）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /admin/dishes:
    get:
      tags: [admin]
      summary: 菜色清單
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /admin/events/{id}:
    patch:
      tags: [admin]
      summary: 修改活動（含取消／延期 postpone）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                location: { type: string }
                startAt: { type: string, format: date-time }
                capacity: { type: integer, description: '0 = 不限' }
                status: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, FINISHED] }
                postpone: { type: boolean, description: '延期：改 startAt 時一起帶，會記下原定時間' }
                signupEndAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: 'W-64 報名截止：必須早於 startAt（含等於就 422）；傳 null ＝ 取消截止'
                teamsEnabled: { type: boolean }
                version:
                  type: integer
                  description: 'W-42 樂觀鎖：帶回讀到的版本；不符回 409，不帶＝舊客戶端（相容，照樣成功並遞增）'
      responses:
        '200': { description: OK }
        '409': { description: '版本衝突（別人先改過），請重新載入後再存' }

  /admin/users:
    post:
      tags: [admin]
      summary: 建立帳號（只能建立低於自己等級）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    get:
      tags: [admin]
      summary: 使用者清單（含 level／canManage／assignable）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /admin/users/{id}:
    delete:
      tags: [admin]
      summary: 刪除帳號
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    patch:
      tags: [admin]
      summary: 修改名稱／帳號／密碼／等級
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /admin/classes:
    get:
      tags: [admin]
      summary: 班級名單視圖（班級＝User.className 的集合，含各班人數、是否有課表／功課、未分班人數）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '403': { description: '需要 user:assign:teacher（資訊管理員以上）' }

  /admin/classes/{className}/members:
    post:
      tags: [admin]
      summary: 批次把帳號加入／移出某一班（action ADD／REMOVE，REMOVE 只清本來就在這一班的人）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: className, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds: { type: array, items: { type: string } }
                action: { type: string, enum: [ADD, REMOVE], default: ADD }
      responses:
        '200': { description: OK }
        '422': { description: 班名不合法或沒有選人 }
        '403': { description: 能力不足或想調整同等／更高權限帳號 }

  /admin/users/{id}/password:
    patch:
      tags: [admin]
      summary: 重設密碼
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /admin/users/{id}/temp-password:
    post:
      tags: [admin]
      summary: 產生一次性臨時密碼（順便清 2FA）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /admin/users/{id}/reset-2fa:
    post:
      tags: [admin]
      summary: 重設兩步驗證（清密鑰與備用碼）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /admin/users/{id}/role:
    patch:
      tags: [admin]
      summary: 指派角色
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /cron/reminders:
    get:
      tags: [admin]
      summary: 活動前自動提醒（定時任務；Vercel Cron 用 GET）
      description: |
        由排程每 30 分鐘呼叫。找出 24 小時／1 小時內開始、狀態 PUBLISHED、
        尚未提醒過的活動，對 **正取（CONFIRMED）** 報名者寫站內通知並嘗試發訂閱消息。
        同一活動同一階段只發一次（`Event.reminder24SentAt`／`reminder1SentAt` 做樂觀鎖）。
        認證不是 JWT，而是 `Authorization: Bearer <CRON_SECRET>`（或 `x-cron-secret`）；
        後端沒設定 `CRON_SECRET` 時一律回 503 `CRON_DISABLED`。
      security: []
      responses:
        '200':
          description: 這一輪的結果（沒有活動要提醒時回 0 筆）
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date-time }
                  checked: { type: integer, description: 進入檢查的活動數 }
                  reminders:
                    type: array
                    items:
                      type: object
                      properties:
                        eventId: { type: string }
                        title: { type: string }
                        stage: { type: string, enum: [24h, 1h] }
                        startAt: { type: string, format: date-time }
                        recipients: { type: integer, description: 正取人數 }
                        subscribeSent: { type: integer }
                        subscribeSkipped: { type: integer }
                  totals:
                    type: object
                    properties:
                      events: { type: integer }
                      recipients: { type: integer }
                      subscribeSent: { type: integer }
                      subscribeSkipped: { type: integer }
        '401': { description: 密鑰不正確或沒有帶 }
        '503': { description: 後端未設定 CRON_SECRET（端點停用） }
    post:
      tags: [admin]
      summary: 活動前自動提醒（手動觸發／GitHub Actions 用 POST）
      security: []
      responses:
        '200': { description: 同 GET }
        '401': { description: 密鑰不正確或沒有帶 }
        '503': { description: 後端未設定 CRON_SECRET（端點停用） }

  # ── 家校通整合（W-50／W-51／W-52） ──
  # 每個家庭用自己的家校通帳號；任何端點都不回傳帳密，只回「已連結／上次同步／錯誤」。
  /school/status:
    get:
      tags: [school]
      summary: 連結狀態（不外洩帳密）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 連結狀態
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked: { type: boolean, description: 是否已儲存家校通同步憑證（SchoolLink） }
                  childrenCount: { type: integer, description: '家長已對應的子女數（parent_links）；與 linked 是兩件事：有子女不一定已連結同步' }
                  studentNo: { type: string, nullable: true }
                  studentName: { type: string, nullable: true }
                  className: { type: string, nullable: true }
                  lastSyncAt: { type: string, format: date-time, nullable: true }
                  lastError: { type: string, nullable: true, description: 上次同步失敗原因（成功時清空） }
                  pendingCells: { type: integer, description: '分批同步還有幾段沒抓（0＝全部完成）；家長端據此顯示「還有 N 段未同步」' }
                  syncStartedAt: { type: string, format: date-time, nullable: true, description: 這一輪同步第一次按下來的時間 }
                  cryptoReady: { type: boolean, description: 後端是否已設定 SCHOOL_CRED_KEY }
        '401': { description: 未登入 }

  /school/link:
    post:
      tags: [school]
      summary: 建立連結（先真的登入家校通一次，成功才加密儲存帳密）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 4, maxLength: 128 }
      responses:
        '200':
          description: 已連結
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked: { type: boolean }
                  studentNo: { type: string }
                  verifiedAt: { type: string, format: date-time }
        '401': { description: 家校通帳號或密碼不正確 }
        '501': { description: 後端未設定 SCHOOL_CRED_KEY（SCHOOL_CRED_NOT_CONFIGURED，改用「手動輸入」） }
    delete:
      tags: [school]
      summary: 解除連結（帳密一起刪掉，已同步的成績與出缺席保留）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已解除
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked: { type: boolean }
        '401': { description: 未登入 }

  /school/sync:
    post:
      tags: [school]
      summary: 分批同步（由近而遠；每批最多用 25 秒，剩下的靠游標續傳）
      description: |
        一次完整同步實測 44.5 秒（Vercel 這支函式 60 秒就砍），所以改成**分批**：
        - 由近而遠：學年由新到舊，學年內第一段→第三段；預設取最近 6 個學年。
        - 游標落庫：跑到哪一格記在 `SchoolLink.syncCursor`，下次從那一格接上，不從頭。
        - 每批時間預算 25 秒（`SCHOOL_SYNC_BUDGET_MS` 可調）；預算內能抓幾格就抓幾格。
        - 回 `done`／`remaining`：`done=false` 時前端顯示「還有 N 段未同步，可再按一次」，
          **不自動連發**（家長網路慢會排隊卡住）。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                yearTerms:
                  type: array
                  maxItems: 20
                  description: 指定學年（不帶就取上游清單最近 6 個學年）
                  items: { type: string, maxLength: 16 }
      responses:
        '200':
          description: 同步結果（一批）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  yearTerms:
                    type: array
                    items: { type: string }
                  grades: { type: integer, description: 實際寫入的成績筆數（已去重，與資料庫筆數一致） }
                  attendance: { type: integer, description: 實際寫入的出缺席天數（已去重；上游會把同一天回三次） }
                  skipped: { type: integer, description: 上游重複回傳而被略過的筆數（診斷用） }
                  termsDone: { type: integer, description: 這一批完成幾個學段格 }
                  partial: { type: boolean, description: 'true＝時間預算用完，後面還有格子（等於 !done）' }
                  thisBatch:
                    type: object
                    description: 這一批從哪一格跑到哪一格（人看得懂的標籤，例「2026/2027 第一段」）
                    properties:
                      from: { type: string, nullable: true }
                      to: { type: string, nullable: true }
                  synced:
                    type: object
                    properties:
                      grades: { type: integer }
                      attendance: { type: integer }
                  remaining: { type: integer, description: 還有幾段沒同步（0＝全部完成） }
                  done: { type: boolean, description: true＝全部學年同步完成、游標已清空 }
                  syncedAt: { type: string, format: date-time }
        '401': { description: 家校通帳號或密碼已失效，請重新連結 }
        '422': { description: 尚未連結家校通 }
        '501': { description: 後端未設定 SCHOOL_CRED_KEY }
        '503': { description: 學校系統暫時連不上（SCHOOL_UNAVAILABLE）；可改用手動輸入 }

  /school/grades:
    get:
      tags: [school]
      summary: 自己的成績（最多 500 筆）
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: yearTerm
          schema: { type: string, maxLength: 16 }
        - in: query
          name: term
          schema: { type: string, maxLength: 8 }
      responses:
        '200':
          description: 成績清單與可用學年
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        yearTerm: { type: string }
                        term: { type: string }
                        className: { type: string, nullable: true }
                        courseName: { type: string }
                        content: { type: string, nullable: true }
                        testType: { type: string, description: 測驗／考試等 }
                        testDate: { type: string, format: date-time }
                        score: { type: number, nullable: true }
                        source: { type: string, enum: [SYNC, MANUAL] }
                  years:
                    type: array
                    items: { type: string }
        '401': { description: 未登入 }

  /school/attendance:
    get:
      tags: [school]
      summary: 自己的出缺席（最多 500 筆，附統計）
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: yearTerm
          schema: { type: string, maxLength: 16 }
        - in: query
          name: term
          schema: { type: string, maxLength: 8 }
      responses:
        '200':
          description: 出缺席清單與統計
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        date: { type: string, format: date-time }
                        yearTerm: { type: string }
                        term: { type: string }
                        amStatus: { type: string, enum: [normal, late, absent, leave] }
                        pmStatus: { type: string, enum: [normal, late, absent, leave] }
                        isAmLate: { type: boolean }
                        isPmLate: { type: boolean }
                        remark: { type: string, nullable: true }
                        source: { type: string, enum: [SYNC, MANUAL] }
                  summary:
                    type: object
                    properties:
                      total: { type: integer, description: 上課日數 }
                      late: { type: integer }
                      absent: { type: integer }
        '401': { description: 未登入 }

  /school/manual/grades:
    post:
      tags: [school]
      summary: 手動補登成績（學校站掛掉或帳密失效時的後備，同一筆重送即覆蓋）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yearTerm, term, courseName, testType, testDate]
              properties:
                yearTerm: { type: string, minLength: 4, maxLength: 16 }
                term: { type: string, minLength: 1, maxLength: 8 }
                courseName: { type: string, minLength: 1, maxLength: 48 }
                testType: { type: string, minLength: 1, maxLength: 24 }
                testDate: { type: string, format: date-time }
                score: { type: number, minimum: 0, maximum: 1000, nullable: true }
                content: { type: string, maxLength: 200 }
      responses:
        '200': { description: 寫入後的成績資料 }
        '401': { description: 未登入 }
        '422': { description: 參數不合法 }

  /school/manual/attendance:
    post:
      tags: [school]
      summary: 手動補登出缺席（同一日期重送即覆蓋）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, yearTerm, term]
              properties:
                date: { type: string, format: date-time }
                yearTerm: { type: string, minLength: 4, maxLength: 16 }
                term: { type: string, minLength: 1, maxLength: 8 }
                amStatus: { type: string, enum: [normal, late, absent, leave], default: normal }
                pmStatus: { type: string, enum: [normal, late, absent, leave], default: normal }
                remark: { type: string, maxLength: 200 }
      responses:
        '200': { description: 寫入後的出缺席資料 }
        '401': { description: 未登入 }
        '422': { description: 參數不合法 }

  # ── 圖書館借閱（W-66） ──
  # 館藏查詢對訪客開放；借還要登入；館藏管理是校內職員（library:manage）。
  # 可借量一律由後端交易內列鎖扣減，前端不自己判斷「還有沒有」。
  /resources:
    get:
      tags: [resources]
      summary: 場地／器材清單（訪客可看）
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [VENUE, EQUIPMENT] } }
        - { name: q, in: query, schema: { type: string, maxLength: 60 }, description: 名稱／位置／說明 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: 場地與器材清單（openNow 依 Asia/Macau 判定）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        kind: { type: string, enum: [VENUE, EQUIPMENT] }
                        name: { type: string }
                        location: { type: string, nullable: true }
                        openFrom: { type: string, description: 'HH:mm（澳門時間）' }
                        openTo: { type: string }
                        hoursText: { type: string, description: '例 08:00–18:00' }
                        maxHours: { type: integer }
                        needsApproval: { type: boolean }
                        openNow: { type: boolean }
                        upcoming: { type: integer, description: 未來未結束的預約數 }
                  total: { type: integer }
                  page: { type: integer }
    post:
      tags: [resources]
      summary: 新增場地／器材（resource:manage：校內職員）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind: { type: string, enum: [VENUE, EQUIPMENT] }
                name: { type: string, maxLength: 80 }
                location: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 2000 }
                openFrom: { type: string, description: 'HH:mm，預設 08:00' }
                openTo: { type: string, description: 'HH:mm，預設 18:00' }
                maxHours: { type: integer, minimum: 1, maximum: 12, default: 4 }
                needsApproval: { type: boolean, default: true }
      responses:
        '201':
          description: 已建立
        '403': { description: 能力不足（學生／老師） }

  /resources/pending:
    get:
      tags: [resources]
      summary: 待審批借用申請（resource:approve：老師以上）
      responses:
        '200':
          description: pending 待審、handled 最近處理過的 20 筆
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: array
                    items: { $ref: '#/components/schemas/ResourceBooking' }
                  handled:
                    type: array
                    items: { $ref: '#/components/schemas/ResourceBooking' }

  /resources/all:
    get:
      tags: [resources]
      summary: 場地總表（含已下架；resource:manage）
      responses:
        '200':
          description: 全部資源與各自的預約總數
        '403': { description: 能力不足 }

  /resources/bookings/mine:
    get:
      tags: [resources]
      summary: 我的借用申請
      responses:
        '200':
          description: 自己的全部申請（新到舊），附待審／已批准筆數
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ResourceBooking' }
                  pending: { type: integer }
                  upcoming: { type: integer }

  /resources/bookings/{id}:
    delete:
      tags: [resources]
      summary: 取消自己的申請（PENDING／APPROVED）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已取消，時段釋放 }
        '404': { description: 不是自己的申請或不存在（同一句話，防探測） }
        '409': { description: 申請已結束（已駁回／已取消） }
    patch:
      tags: [resources]
      summary: 審批（APPROVE／REJECT，resource:approve）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string, maxLength: 200, description: 駁回原因（會通知申請人） }
      responses:
        '200': { description: 已處理，申請人收到站內通知 }
        '403': { description: 能力不足 }
        '409': { description: 已處理過，或同時段還有另一筆待審 }

  /resources/{id}:
    get:
      tags: [resources]
      summary: 場地詳情（未來 14 天時段＋我的申請）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 詳情；訪客也能看，mine 為空、canBook=false
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      hoursText: { type: string }
                      maxHours: { type: integer }
                      needsApproval: { type: boolean }
                      openNow: { type: boolean }
                  bookings:
                    type: array
                    items: { $ref: '#/components/schemas/ResourceBooking' }
                  mine:
                    type: array
                    items: { $ref: '#/components/schemas/ResourceBooking' }
                  canBook: { type: boolean }
                  canApprove: { type: boolean }
                  canManage: { type: boolean }
        '404': { description: 找不到或已下架 }
    patch:
      tags: [resources]
      summary: 修改場地／器材（帶 version 做樂觀鎖，resource:manage）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已更新（version +1） }
        '409': { description: 版本不符，請重新載入 }
    delete:
      tags: [resources]
      summary: 下架（軟刪除；resource:manage）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已下架，前台看不到 }
        '409': { description: 還有未結束的預約 }

  /resources/{id}/bookings:
    post:
      tags: [resources]
      summary: 送出借用申請（resource:book）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startAt, endAt, purpose]
              properties:
                startAt: { type: string, format: date-time }
                endAt: { type: string, format: date-time }
                purpose: { type: string, maxLength: 200 }
      responses:
        '201':
          description: 已建立（needsApproval=false 時直接 APPROVED）
        '409': { description: 時段重疊（CONFLICT，附衝突時段） }
        '422': { description: 超過最長時數／跨日／不在開放時間內／過去時段 }

  /library/books:
    get:
      tags: [library]
      summary: 館藏列表（訪客可看）
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 60 }, description: 書名／作者／書號／索書號 }
        - { name: category, in: query, schema: { type: string, maxLength: 40 } }
        - { name: available, in: query, schema: { type: string, enum: ['1', '0'] }, description: '1＝只看現在借得到的' }
        - { name: sort, in: query, schema: { type: string, enum: [new, title, hot] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: 館藏清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        isbn: { type: string, nullable: true }
                        title: { type: string }
                        author: { type: string, nullable: true }
                        category: { type: string, nullable: true }
                        callNumber: { type: string, nullable: true, description: 索書號（排架位置） }
                        coverImage: { type: string, nullable: true }
                        totalCopies: { type: integer }
                        availableCopies: { type: integer }
                        loanDays: { type: integer }
                        waiting: { type: integer, description: 排隊（候補＋已留書）人數 }
                        borrowable: { type: boolean, description: 現在有可借量（可能被留書佔住，實際能不能借看後端） }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
                  hasMore: { type: boolean }

  /library/books/{id}:
    get:
      tags: [library]
      summary: 書籍詳情（含我的借閱／我的預約）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 詳情；未登入時 myLoan／myReservation 皆為 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  book:
                    type: object
                    properties:
                      id: { type: string }
                      title: { type: string }
                      availableCopies: { type: integer }
                      waiting: { type: integer }
                      loans90d: { type: integer, description: 近 90 天借出次數（熱門度） }
                      borrowable: { type: boolean }
                  myLoan:
                    nullable: true
                    type: object
                    properties:
                      id: { type: string }
                      dueAt: { type: string, format: date-time }
                      overdueDays: { type: integer }
                      dueSoon: { type: boolean, description: 3 天內到期 }
                      renewals: { type: integer }
                  myReservation:
                    nullable: true
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string, enum: [WAITING, READY] }
                      position: { type: integer, description: 候補順位（READY 時為 0） }
                      readyAt: { type: string, format: date-time, nullable: true }
                      holdHours: { type: integer, description: 留書期限（小時） }
                  totalLoans: { type: integer }
        '404': { description: 找不到或已刪除 }

  /library/isbn/{isbn}:
    get:
      tags: [library]
      summary: 用書號查書（掃碼）
      parameters:
        - { name: isbn, in: path, required: true, schema: { type: string, minLength: 10 } }
      responses:
        '200':
          description: 查不到也回 200（found=false），前端據此顯示「登記新書」
          content:
            application/json:
              schema:
                type: object
                properties:
                  found: { type: boolean }
                  isbn: { type: string, description: 正規化後的純數字書號 }
                  book: { type: object, nullable: true }
        '422': { description: 書號格式不正確 }

  /library/hot:
    get:
      tags: [library]
      summary: 熱門榜（近 N 天借出次數前 5 名，可調筆數與窗口）
      parameters:
        - name: limit
          in: query
          description: 取幾本（1–10，預設 5；後台用 10）
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
        - name: days
          in: query
          description: 統計窗口天數（7–365，預設 90）
          schema: { type: integer, minimum: 7, maximum: 365, default: 90 }
      responses:
        '200':
          description: 熱門書清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        author: { type: string, nullable: true }
                        loans: { type: integer }
                  limit: { type: integer }
                  days: { type: integer }

  /library/loans:
    post:
      tags: [library]
      summary: 借書（可借就借出，沒書就排候補）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId: { type: string }
                isbn: { type: string, description: 掃碼得到的書號（與 bookId 二選一） }
      responses:
        '201':
          description: 借書成功（kind=loan）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  kind: { type: string, enum: [loan] }
                  loan:
                    type: object
                    properties:
                      id: { type: string }
                      dueAt: { type: string, format: date-time }
                      renewals: { type: integer }
                  availableCopies: { type: integer }
                  waiting: { type: integer }
        '200':
          description: 沒可借的 → 回候補（kind=reservation，不是錯誤）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  kind: { type: string, enum: [reservation] }
                  message: { type: string, description: 例「已幫你排候補第 3 位」 }
                  reservation:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string, enum: [WAITING, READY] }
                      position: { type: integer }
        '401': { description: 未登入 }
        '404': { description: 找不到這本書（或書號不在館藏） }
        '409': { description: 'ALREADY_BORROWED（已借未還）／ALREADY_RESERVED（已排候補）' }
        '422': { description: 已下架或參數不合法 }

  /library/loans/mine:
    get:
      tags: [library]
      summary: 我的借閱與預約
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 我的借閱＋我的候補
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeCount: { type: integer }
                  overdueCount: { type: integer }
                  loans:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        book: { type: object }
                        borrowedAt: { type: string, format: date-time }
                        dueAt: { type: string, format: date-time }
                        returnedAt: { type: string, format: date-time, nullable: true }
                        overdueDays: { type: integer }
                        dueSoon: { type: boolean }
                        renewals: { type: integer }
                  reservations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        book: { type: object }
                        status: { type: string, enum: [WAITING, READY] }
                        position: { type: integer }
                        readyAt: { type: string, format: date-time, nullable: true }
        '401': { description: 未登入 }

  /library/loans/{id}/return:
    post:
      tags: [library]
      summary: 還書（本人或圖書館職員代還）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 已歸還；有人候補時 promotedUserId 不為 null（後端已發站內通知）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  bookId: { type: string }
                  overdueDays: { type: integer }
                  promotedUserId: { type: string, nullable: true }
                  availableCopies: { type: integer }
                  waiting: { type: integer }
        '403': { description: 不是自己的書且沒有管理能力 }
        '409': { description: ALREADY_RETURNED（重複還或別人先還了） }

  /library/loans/{id}/renew:
    post:
      tags: [library]
      summary: 續借（上限 1 次）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 已續借（從原到期日往後延，不是從今天算）
          content:
            application/json:
              schema:
                type: object
                properties:
                  dueAt: { type: string, format: date-time }
                  renewals: { type: integer }
                  loanDays: { type: integer }
        '409': { description: 'RENEW_LIMIT／LOAN_OVERDUE／LOAN_QUEUED（有人在等）' }

  /library/reservations/{id}:
    delete:
      tags: [library]
      summary: 取消預約（順位自動重排）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 已取消；若讓出的是已留書的位子，promotedUserId 是最早候補
        '403': { description: 不是自己的預約 }
        '422': { description: 這筆預約已經結束 }

  /admin/library/books:
    get:
      tags: [admin]
      summary: 館藏管理清單（含下架）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: includeArchived, in: query, schema: { type: string, enum: ['1', '0'] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 30 } }
      responses:
        '200': { description: 清單（每列帶借閱／預約筆數） }
        '403': { description: '權限不足（需要 library:manage）' }
    post:
      tags: [admin]
      summary: 新增館藏
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 120 }
                isbn: { type: string, description: 會正規化成純數字 }
                author: { type: string, maxLength: 80 }
                publisher: { type: string, maxLength: 80 }
                category: { type: string, maxLength: 40 }
                callNumber: { type: string, maxLength: 40 }
                coverImage: { type: string, format: uri }
                summary: { type: string, maxLength: 2000 }
                totalCopies: { type: integer, minimum: 1, maximum: 999, default: 1 }
                loanDays: { type: integer, minimum: 1, maximum: 90, default: 14 }
      responses:
        '201': { description: 建好的書 }
        '409': { description: 書號重複 }

  /admin/library/books/{id}:
    patch:
      tags: [admin]
      summary: 修改館藏（帶 version 防覆蓋）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                isbn: { type: string }
                totalCopies: { type: integer }
                loanDays: { type: integer }
                version: { type: integer, description: 讀到的那個版本；不符回 409 }
      responses:
        '200': { description: 改好的書 }
        '409': { description: 版本不符或書號重複 }
        '422': { description: 館藏量不能少於借出中的本數 }
    delete:
      tags: [admin]
      summary: 刪除館藏（軟刪除，只在前台消失）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已刪除 }
        '422': { description: 還有書借出中 }

  /admin/library/books/{id}/archive:
    post:
      tags: [admin]
      summary: 下架／重新上架
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                archived: { type: boolean, default: true }
      responses:
        '200': { description: 已下架／已上架 }
        '404': { description: 找不到 }

  /admin/library/loans:
    get:
      tags: [admin]
      summary: 借閱紀錄（誰借了什麼、什麼時候到期、哪些逾期）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, overdue, returned, all], default: active } }
        - { name: q, in: query, schema: { type: string }, description: 書名／借閱人／帳號 }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 30 } }
      responses:
        '200':
          description: 紀錄＋統計
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        book: { type: object }
                        user: { type: object }
                        dueAt: { type: string, format: date-time }
                        returnedAt: { type: string, format: date-time, nullable: true }
                        overdueDays: { type: integer }
                  total: { type: integer }
                  summary:
                    type: object
                    properties:
                      active: { type: integer }
                      overdue: { type: integer }

  /admin/library/loans.csv:
    get:
      tags: [admin]
      summary: 借閱紀錄 CSV（UTF-8 BOM）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, overdue, returned, all], default: all } }
      responses:
        '200':
          description: CSV 檔（text/csv）
          content:
            text/csv:
              schema: { type: string }

  /admin/library/overdue:
    get:
      tags: [admin]
      summary: 全校逾期清單（館員催還；按逾期天數由多到少）
      description: >-
        只列未歸還且已過應還日的書。逾期天數按澳門日界算，
        days=0 與 days=1 同義（當天到期不算逾期）。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 0, maximum: 365, default: 0 }
          description: '0 = 只要逾期就列；7 = 只列逾期滿 7 天以上'
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: 逾期清單＋摘要
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        book: { type: object }
                        user: { type: object }
                        studentNo: { type: string, description: '由 sc: 帳號抽出的純學號；微信帳號為空字串' }
                        borrowedAt: { type: string, format: date-time }
                        dueAt: { type: string, format: date-time }
                        overdueDays: { type: integer }
                        renewals: { type: integer }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  hasMore: { type: boolean }
                  days: { type: integer }
                  summary:
                    type: object
                    properties:
                      count: { type: integer }
                      worstDays: { type: integer }
                      people: { type: integer }
                      withinWeek: { type: integer }
        '403': { description: '權限不足（需要 library:manage）' }

  /admin/library/overdue/export:
    get:
      tags: [admin]
      summary: 逾期清單 CSV（UTF-8 BOM；與清單同一份名單）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 0, maximum: 365, default: 0 }
      responses:
        '200':
          description: 'CSV 檔（text/csv；x-row-count 為列數；上限 5000 列；寫 library.overdue_export 審計）'
          content:
            text/csv:
              schema: { type: string }

  /admin/library/remind:
    post:
      tags: [admin]
      summary: 催還（到期前 2 天內＋逾期，一天只催一次）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已提醒筆數
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  checked: { type: integer }

  /cron/library-reminders:
    get:
      tags: [admin]
      summary: 圖書館催還（定時任務，與活動提醒分開一支）
      description: 認證同 /cron/reminders（CRON_SECRET，不是 JWT）；未設定時回 503 CRON_DISABLED。
      security: []
      responses:
        '200': { description: 已提醒筆數 }
        '401': { description: 密鑰不正確或沒有帶 }
        '503': { description: 後端未設定 CRON_SECRET（端點停用） }
    post:
      tags: [admin]
      summary: 圖書館催還（手動觸發用 POST）
      security: []
      responses:
        '200': { description: 同 GET }
        '401': { description: 密鑰不正確或沒有帶 }
        '503': { description: 後端未設定 CRON_SECRET（端點停用） }

  /cron/homework-reminders:
    get:
      tags: [admin]
      summary: 功課提醒（24 小時內到期＋已逾期，只發給還沒打勾的學生）
      description: >-
        認證同 /cron/reminders（CRON_SECRET，不是 JWT）；未設定時回 503 CRON_DISABLED。
        同一天重跑不會重複發（去重窗口是澳門時區的當天）。已打勾的學生、別班學生、已收回的功課都不會收到。
      security: []
      responses:
        '200':
          description: 這一輪檢查與送出的統計
          content:
            application/json:
              schema:
                type: object
                properties:
                  checked: { type: integer, description: 檢查了幾則功課 }
                  sent: { type: integer, description: 實際送出的通知數 }
                  skipped: { type: integer, description: 同一天已提醒過而跳過的人數 }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        className: { type: string }
                        subject: { type: string }
                        title: { type: string }
                        stage: { type: string, enum: [soon, overdue] }
                        targets: { type: integer }
                        sent: { type: integer }
        '401': { description: 密鑰不正確或沒有帶 }
        '503': { description: 後端未設定 CRON_SECRET（端點停用） }
    post:
      tags: [admin]
      summary: 功課提醒（手動觸發用 POST）
      security: []
      responses:
        '200': { description: 同 GET }
        '401': { description: 密鑰不正確或沒有帶 }
        '503': { description: 後端未設定 CRON_SECRET（端點停用） }

  /cron/daily:
    get:
      tags: [admin]
      summary: 每日一次（圖書館催還＋功課提醒）
      description: >-
        Vercel Cron 每天打這支。兩件事各自 try/catch，其中一件失敗不會讓另一件沒跑；
        回應固定列出兩邊的結果與 errors，排程 log 一眼看得出哪一段沒做。
      security: []
      responses:
        '200':
          description: 兩個任務各自的結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  elapsedMs: { type: integer }
                  library: { type: object, nullable: true }
                  homework: { type: object, nullable: true }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        task: { type: string }
                        message: { type: string }
        '401': { description: 密鑰不正確或沒有帶 }
        '503': { description: 後端未設定 CRON_SECRET（端點停用） }
    post:
      tags: [admin]
      summary: 每日一次（手動觸發）
      security: []
      responses:
        '200': { description: 同 GET }
        '401': { description: 密鑰不正確或沒有帶 }
        '503': { description: 後端未設定 CRON_SECRET（端點停用） }

  # ── 二手書／校服轉贈（W-68） ──
  # 清單與詳情對訪客開放；送出、修改、申請要登入；後台總表限 giveaway:manage。
  # 聯絡方式只回物主本人與「被接受」的申請人，前端不要自己藏。
  # 「刪除」＝下架（status=CLOSED），可再上架，沒有硬刪除。
  /giveaways:
    get:
      tags: [giveaways]
      summary: 轉贈清單（訪客可看）
      description: 只回 status=AVAILABLE；已贈出／已下架的貼文不會出現在這裡（詳情頁仍可讀）。
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [BOOK, UNIFORM, OTHER] } }
        - { name: q, in: query, schema: { type: string, maxLength: 60 }, description: 標題／說明／細節／面交地點 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: 轉贈清單（新到舊）；contactName／contactValue 一律 null，myRequest 也是 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GiveawayItem' }
                  total: { type: integer }
                  page: { type: integer }
    post:
      tags: [giveaways]
      summary: 送出轉贈（giveaway:create）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, title]
              properties:
                kind: { type: string, enum: [BOOK, UNIFORM, OTHER] }
                title: { type: string, minLength: 2, maxLength: 80 }
                body: { type: string, maxLength: 2000, description: 物品狀況／為什麼送出 }
                condition: { type: string, enum: [LIKE_NEW, GOOD, FAIR], default: GOOD }
                detail: { type: string, maxLength: 40, description: '細節，例「第 3 冊」／「150 碼」' }
                pickupPlace: { type: string, maxLength: 60, description: 面交地點 }
                imageUrl: { type: string, maxLength: 512, description: 只收 http(s) 連結（COS 未開通前不上傳） }
                contactName: { type: string, maxLength: 40, description: 只給被接受的申請人看 }
                contactValue: { type: string, maxLength: 80, description: 例 電話／微信號 }
      responses:
        '201':
          description: 已建立（status=AVAILABLE，version=0）
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/GiveawayItem' }
        '401': { description: 未登入 }
        '403': { description: '能力不足（giveaway:create）' }
        '422': { description: 欄位驗證失敗（例 標題少於 2 字、imageUrl 不是 http(s)） }

  /giveaways/mine:
    get:
      tags: [giveaways]
      summary: 我的轉贈（我送出的＋我申請的）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: posted 我送出的（各 100 筆為限，含聯絡方式與待審數）；requests 我申請的（附物品摘要）
          content:
            application/json:
              schema:
                type: object
                properties:
                  posted:
                    type: array
                    items: { $ref: '#/components/schemas/GiveawayItem' }
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/GiveawayRequestSummary' }
        '401': { description: 未登入 }

  /giveaways/{id}:
    get:
      tags: [giveaways]
      summary: 轉贈詳情（訪客可看基本資料）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 詳情；聯絡方式只有物主、被接受的申請人、職員拿得到。requests 只有物主與職員看得到，其他人是空陣列
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/GiveawayItem' }
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/GiveawayRequestSummary' }
                  isOwner: { type: boolean }
                  canRequest: { type: boolean, description: '可申請＝有 giveaway:request、不是物主、仍是 AVAILABLE、且我還沒申請過' }
                  canManage: { type: boolean }
        '404': { description: 找不到；或已贈出／已下架且你不是物主、申請過的人、職員（同一句話，防探測） }
    patch:
      tags: [giveaways]
      summary: 修改自己的轉贈（帶 version 做樂觀鎖）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [BOOK, UNIFORM, OTHER] }
                title: { type: string, minLength: 2, maxLength: 80 }
                body: { type: string, maxLength: 2000, description: 空字串＝清空 }
                condition: { type: string, enum: [LIKE_NEW, GOOD, FAIR] }
                detail: { type: string, maxLength: 40 }
                pickupPlace: { type: string, maxLength: 60 }
                imageUrl: { type: string, maxLength: 512, description: 空字串＝清空 }
                contactName: { type: string, maxLength: 40 }
                contactValue: { type: string, maxLength: 80 }
                version: { type: integer, minimum: 0, description: 不帶就不做版本比對 }
      responses:
        '200':
          description: 已更新（version 加 1）
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/GiveawayItem' }
        '401': { description: 未登入 }
        '403': { description: '不是物主（giveaway:manage 可代改）' }
        '404': { description: 找不到這件轉贈物品 }
        '409': { description: 版本不符（請重新載入）或已贈出（只有職員能改） }
        '422': { description: 欄位驗證失敗 }

  /giveaways/{id}/status:
    post:
      tags: [giveaways]
      summary: 下架／重新上架（物主或 giveaway:manage）
      description: 不做硬刪除也不做軟刪除，「刪掉」就是 status=CLOSED，可再改回 AVAILABLE。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [AVAILABLE, CLOSED] }
      responses:
        '200':
          description: 已改狀態（version 加 1；下架會寫 closedAt，上架會清掉）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string, enum: [AVAILABLE, CLOSED] }
        '401': { description: 未登入 }
        '403': { description: '不是物主（giveaway:manage 可代改）' }
        '404': { description: 找不到這件轉贈物品 }
        '409': { description: 已贈出（GIVEN）不能再改狀態 }

  /giveaways/{id}/requests:
    post:
      tags: [giveaways]
      summary: 申請索取（giveaway:request）
      description: 同一人對同一件只留一列；取消後再申請是復活原本那筆，不會多一列。物主會收到站內通知。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 200, description: 給物主的話（會進通知） }
      responses:
        '201':
          description: 已送出申請（status=PENDING）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  requestId: { type: string }
        '401': { description: 未登入 }
        '403': { description: '能力不足（giveaway:request）' }
        '404': { description: 找不到這件轉贈物品 }
        '409': { description: 已申請過在等回覆／物主已留給你／物品已被領取或已下架 }
        '422': { description: 這是你自己送出的物品 }

  /giveaways/requests/{id}:
    delete:
      tags: [giveaways]
      summary: 取消自己的申請（只有 PENDING 可取消）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已取消（status=CANCELLED），可再重新申請 }
        '401': { description: 未登入 }
        '403': { description: 只能取消自己的申請 }
        '404': { description: 找不到這筆申請 }
        '409': { description: 這筆申請已經處理過了（已接受／已駁回／已取消） }
    patch:
      tags: [giveaways]
      summary: 物主決定給誰（ACCEPT／REJECT）
      description: 接受＝物品同時變 GIVEN，並在同一交易把其他待審申請一併標成 REJECTED；條件式更新擋「兩個視窗同時按接受」。申請人會收到站內通知。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [ACCEPT, REJECT] }
      responses:
        '200':
          description: 已處理
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  action: { type: string, enum: [ACCEPT, REJECT] }
        '401': { description: 未登入 }
        '403': { description: '只有物主可以決定要給誰（giveaway:manage 可代處理）' }
        '404': { description: 找不到這筆申請 }
        '409': { description: 這筆申請已處理過，或物品已經不是 AVAILABLE }

  /admin/giveaways:
    get:
      tags: [admin]
      summary: 轉贈總表（含已贈出／已下架；giveaway:manage）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [all, AVAILABLE, GIVEN, CLOSED], default: all } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: 全部貼文（含聯絡方式，新到舊）與各狀態筆數
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GiveawayItem' }
                  stats:
                    type: object
                    properties:
                      available: { type: integer }
                      given: { type: integer }
                      closed: { type: integer }
                      pendingRequests: { type: integer, description: 全站待審申請數 }
        '403': { description: 能力不足 }

  # ── W-72 請假申請 ──────────────────────────────────────────────
  /leaves:
    post:
      tags: [leaves]
      summary: 送出假單（學生自己／家長代已綁定的子女）
      description: |
        角色分流：學生只能替自己送（studentId 傳別人的一律 403）；
        家長一定要帶 studentId，而且必須存在於 parent_links（未綁定與「不存在的人」回同一句 403，防學號探測）。
        同一學生「待審批／已批准」的日期區間不能重疊（409）；已駁回／已取消的不佔日期。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, fromDate, toDate, reason]
              properties:
                studentId: { type: string, description: 家長必填；學生留空（後端一律用自己的 id） }
                kind: { type: string, enum: [SICK, PERSONAL, OFFICIAL] }
                fromDate: { type: string, example: '2026-11-12', description: 'YYYY-MM-DD（只到天）' }
                toDate: { type: string, example: '2026-11-13' }
                reason: { type: string, minLength: 2, maxLength: 300 }
                attachmentUrl: { type: string, maxLength: 512 }
      responses:
        '201':
          description: 已送出（status=PENDING）
          content:
            application/json:
              schema:
                type: object
                properties:
                  leave: { $ref: '#/components/schemas/LeaveRequest' }
        '401': { description: 未登入 }
        '403': { description: 能力不足／只能替自己請假／沒有綁定這位學生 }
        '409': { description: 同一段日期已經有假單（待審批或已批准） }
        '422': { description: 日期格式錯、結束早於開始、超過 60 天、原因太短 }

  /leaves/mine:
    get:
      tags: [leaves]
      summary: 我的假單（學生看自己；家長看子女）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 由新到舊（最多 100 筆）＋待審批／已批准筆數
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LeaveRequest' }
                  pending: { type: integer }
                  approved: { type: integer }
                  studentName: { type: string, nullable: true }
        '401': { description: 未登入 }

  /leaves/{id}:
    get:
      tags: [leaves]
      summary: 單張假單（送出者／學生本人／可審批的老師與職員）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 假單＋是否可以審批
          content:
            application/json:
              schema:
                type: object
                properties:
                  leave: { $ref: '#/components/schemas/LeaveRequest' }
                  canReview: { type: boolean }
        '403': { description: 看不到這張假單 }
        '404': { description: 找不到這張假單 }
    delete:
      tags: [leaves]
      summary: 取消假單（只有待審批，且只有送出者／學生本人）
      description: 取消是狀態改成 CANCELLED（不刪列）—— 請假紀錄要留著，月底統計才對得上。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已取消 }
        '403': { description: 只能取消自己的假單 }
        '409': { description: 已批准／已駁回／已取消，不能再取消 }

  /admin/leaves:
    get:
      tags: [admin]
      summary: "假單清單（leave:review；老師／校務處）"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED, ALL], default: PENDING } }
        - { name: q, in: query, schema: { type: string, maxLength: 40 }, description: 學生暱稱或原因 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: 待審批依開始日期由近到遠；其他狀態依處理時間由新到舊
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LeaveRequest' }
                  total: { type: integer }
                  page: { type: integer }
                  counts:
                    type: object
                    properties:
                      PENDING: { type: integer }
                      APPROVED: { type: integer }
                      REJECTED: { type: integer }
                      CANCELLED: { type: integer }
        '403': { description: 能力不足 }

  /admin/leaves/{id}:
    patch:
      tags: [admin]
      summary: "審批假單（leave:review；駁回必填原因）"
      description: 條件式寫入（where status=PENDING）—— 兩位老師同時按批准，第二位回 409。批完發站內通知給送出者與學生本人。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string, maxLength: 200, description: 駁回時必填 }
      responses:
        '200':
          description: 已處理（回更新後的狀態與日期摘要）
        '403': { description: 能力不足 }
        '404': { description: 找不到這張假單 }
        '409': { description: 這張已經被其他老師處理過了 }
        '422': { description: 駁回沒寫原因 }

  /admin/leaves/export:
    get:
      tags: [admin]
      summary: "假單 CSV 匯出（leave:review；帶 UTF-8 BOM，Excel 直接開）"
      description: |
        欄位：學號／姓名／年級／班別／假別／起訖／天數／狀態／送出者／審批人／審批時間／原因。
        學號由 `sc:` 家校通帳號取出（微信帳號的老師留空）；原因裡的引號成對加倍、換行改成空白。
        一次最多 5000 張，筆數放在 `x-row-count` 回應標頭（curl 驗得到、不必下載檔案）；每次匯出寫一筆 `leave.export` 審計。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED, ALL], default: ALL } }
        - { name: from, in: query, schema: { type: string, format: date }, description: 開始日期下限（含） }
        - { name: to, in: query, schema: { type: string, format: date }, description: 開始日期上限（含） }
      responses:
        '200':
          description: CSV（text/csv; charset=utf-8）
          headers:
            x-row-count:
              schema: { type: string }
              description: 匯出筆數
            content-disposition:
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        '403': { description: 能力不足 }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ── W-73 班級課表 ──────────────────────────────────────────────
  /timetable:
    get:
      tags: [timetable]
      summary: 班級課表（訪客可看；沒帶 className 就用登入者自己的班級）
      description: 節次時間全校共用一份（第一次讀取自動補第 1–8 節預設值），回傳每格的 timeText 由後端組好。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: className, in: query, schema: { type: string, maxLength: 32 }, description: 例「高二仁」；留空時登入者用自己的班級 }
      responses:
        '200':
          description: 該班整週課表＋可選班級＋節次
          content:
            application/json:
              schema:
                type: object
                properties:
                  className: { type: string }
                  classes: { type: array, items: { type: string } }
                  periods:
                    type: array
                    items:
                      type: object
                      properties:
                        period: { type: integer }
                        startTime: { type: string, example: '08:10' }
                        endTime: { type: string, example: '08:50' }
                  weekdays:
                    type: array
                    items:
                      type: object
                      properties:
                        weekday: { type: integer }
                        label: { type: string }
                  slots: { type: array, items: { $ref: '#/components/schemas/TimetableSlot' } }

  /timetable/today:
    get:
      tags: [timetable]
      summary: 今天的課與「現在／下一節」（澳門時間；週末或放假回 schoolDay=false）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: className, in: query, schema: { type: string, maxLength: 32 } }
        - { name: at, in: query, schema: { type: string, format: date-time }, description: 指定時間算節次（測試／示範用；不帶就是現在） }
      responses:
        '200':
          description: 今天課表＋current／next＋給首頁一行的 nextText；放假時再回 dayOff 與原因
          content:
            application/json:
              schema:
                type: object
                properties:
                  className: { type: string }
                  schoolDay: { type: boolean, description: 週末或當天停課都是 false }
                  dayOff:
                    type: object
                    nullable: true
                    description: 停課依據（週末為 null）。W-82：當天的 CALENDAR 公告或壓到上課時段 ≥3 小時的全校活動
                    properties:
                      source: { type: string, enum: [notice, event] }
                      id: { type: string }
                      title: { type: string }
                      reason: { type: string, example: 重陽節假期（校曆公告） }
                  dayOffReason: { type: string, example: 重陽節假期（校曆公告）, description: 空字串＝不是放假（含週末） }
                  date: { type: string, example: '2026-11-06' }
                  weekday: { type: integer }
                  weekdayLabel: { type: string }
                  slots: { type: array, items: { $ref: '#/components/schemas/TimetableSlot' } }
                  current: { $ref: '#/components/schemas/TimetableSlot' }
                  next: { $ref: '#/components/schemas/TimetableSlot' }
                  nextText: { type: string, example: '數學 · 302（10:30）' }

  /homework:
    get:
      tags: [homework]
      summary: 自己班級的功課清單（登入後才有班級；逾期由後端算）
      description: 學生只能看自己那一班，帶 className 也一樣；沒班級的人回 needsClass=true 與空清單，不是錯誤。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [all, todo, done], default: all }, description: todo＝還沒打勾、done＝已打勾 }
        - { name: className, in: query, schema: { type: string, maxLength: 32 }, description: 只有老師以上有效；學生一律用自己那一班 }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 60 } }
      responses:
        '200':
          description: 功課清單與統計
          content:
            application/json:
              schema:
                type: object
                properties:
                  className: { type: string }
                  needsClass: { type: boolean }
                  canCreate: { type: boolean, description: 老師以上才有「出功課」按鈕 }
                  message: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        className: { type: string }
                        subject: { type: string, example: 數學 }
                        title: { type: string, example: 習作 4.2 第 1–10 題 }
                        detail: { type: string }
                        links:
                          type: array
                          description: "附件連結（W-84）：只收 http(s)、上限 5 條；name 可空，前端沒名稱時顯示「附件 N」"
                          items:
                            type: object
                            properties:
                              name: { type: string, maxLength: 60 }
                              url: { type: string, maxLength: 300 }
                        dueAt: { type: string, format: date-time }
                        dueMs: { type: integer }
                        done: { type: boolean }
                        doneAt: { type: string }
                        overdue: { type: boolean }
                        mine: { type: boolean, description: 是不是自己出的（只有自己出的可以收回） }
                        version: { type: integer }
                  stats:
                    type: object
                    properties:
                      total: { type: integer }
                      done: { type: integer }
                      todo: { type: integer }
                      overdue: { type: integer }
        '401':
          description: 未登入（功課不是公開內容）
    post:
      tags: [homework]
      summary: 為班級出一項功課（老師）
      description: 同一班同一科同一天同一個標題回 409，避免連點兩下建兩筆。只帶日期時視為當天 23:59（澳門時間）。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, title, dueAt]
              properties:
                className: { type: string, description: 留空＝自己那一班 }
                subject: { type: string, maxLength: 40 }
                title: { type: string, maxLength: 120 }
                detail: { type: string, maxLength: 500 }
                links:
                  type: array
                  maxItems: 5
                  description: "附件連結（W-84）：只收 http(s) 開頭，上限 5 條；重複的只留一條，非 http(s) 回 422。字串或 { name, url } 都收。"
                  items:
                    oneOf:
                      - { type: string, maxLength: 300 }
                      - type: object
                        properties:
                          name: { type: string, maxLength: 60 }
                          url: { type: string, maxLength: 300 }
                dueAt: { type: string, example: '2026-11-09' }
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  className: { type: string }
                  dueAt: { type: string, format: date-time }
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        url: { type: string }
                  version: { type: integer }
        '409':
          description: 同一班今天已經有同一科的同一項功課

  /homework/{id}:
    patch:
      tags: [homework]
      summary: 修改一項功課（作者本人或管理員；帶 version 擋併發覆蓋）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject: { type: string, maxLength: 40 }
                title: { type: string, maxLength: 120 }
                detail: { type: string, maxLength: 500 }
                links:
                  type: array
                  maxItems: 5
                  description: "附件連結（W-84）：帶空陣列＝清空附件；不帶就維持原樣（不要用 null 當清空）。"
                  items:
                    oneOf:
                      - { type: string, maxLength: 300 }
                      - type: object
                        properties:
                          name: { type: string, maxLength: 60 }
                          url: { type: string, maxLength: 300 }
                dueAt: { type: string }
                version: { type: integer, description: 選填；帶了才做條件式更新 }
      responses:
        '200':
          description: 已更新（回新版號）
        '409':
          description: 版號不符（別人先改了）
    delete:
      tags: [homework]
      summary: 收回一項功課（軟刪除；作者本人或管理員）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 已收回（資料列保留，前台不再出現）

  /homework/{id}/done:
    post:
      tags: [homework]
      summary: 打勾（我交了）；連按兩次也只有一列
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 已打勾
        '403':
          description: 不是你們班的功課
    delete:
      tags: [homework]
      summary: 取消打勾
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 已取消

  /homework/stats:
    get:
      tags: [homework]
      summary: 老師看這一班每項功課「幾個人交了」（一支端點回全部）
      description: 只回數字不回姓名（要點名請走名單／簽到）。權限是 `homework:create`（老師以上）。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: className, in: query, schema: { type: string, maxLength: 32 }, description: 留空＝自己那一班 }
      responses:
        '200':
          description: 全班人數與每項功課的交件數
          content:
            application/json:
              schema:
                type: object
                properties:
                  className: { type: string }
                  total: { type: integer, description: 班上人數（不含被封禁的帳號） }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        done: { type: integer }
        '403':
          description: 不是老師（學生／家長沒有 homework:create）

  /teacher/class:
    get:
      tags: [homework]
      summary: 教師端「班級總覽」（本班功課未交、待審假單、報修處理中，一支聚合端點）
      description: |
        導師在朝會前 30 秒掌握全班：本班人數、功課未交人次（依科目分組）、待審假單與今天請假人數、報修待處理件數。

        三條規則：①班級由後端從 `User.className` 決定，**不信前端傳來的班級**（老師帶別班回 403，管理員以上可指定）；
        ②每一格都與各模組清單用同一份查詢條件（功課 `deletedAt: null`、請假 `status='PENDING'`、報修只算本班同學送出的）；
        ③帳號沒有班級回 422 並說明找校務處設定。只回數字與最近三筆，不回全班姓名（要點名請走 `/homework/{id}/pending`）。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: className, in: query, schema: { type: string, maxLength: 32 }, description: 留空＝自己那一班（只有管理員以上可以指定別班） }
      responses:
        '200':
          description: 本班的功課／請假／報修聚合數字
          content:
            application/json:
              schema:
                type: object
                properties:
                  className: { type: string }
                  grade: { type: string }
                  role: { type: string }
                  classSize: { type: integer, description: 該班級底下未封禁帳號數（與 /homework/stats 同一套算法） }
                  homework:
                    type: object
                    properties:
                      items: { type: integer, description: 未收回的功課項數 }
                      overdueItems: { type: integer, description: 已過截止時間的項數 }
                      pendingTotal: { type: integer, description: 全部功課的「未打勾」人次合計 }
                      subjects:
                        type: array
                        items:
                          type: object
                          properties:
                            subject: { type: string }
                            items: { type: integer }
                            pending: { type: integer }
                            overdue: { type: integer }
                      upcoming:
                        type: array
                        description: 未到期的最近三項
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            subject: { type: string }
                            title: { type: string }
                            dueAt: { type: string, format: date-time }
                            done: { type: integer }
                            total: { type: integer }
                  leaves:
                    type: object
                    properties:
                      pending: { type: integer }
                      approvedToday: { type: integer, description: 今天請假中的人數（已批准且日期涵蓋今天） }
                      latest:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            studentId: { type: string }
                            nickname: { type: string }
                            kind: { type: string }
                            kindText: { type: string }
                            fromDate: { type: string, format: date }
                            toDate: { type: string, format: date }
                  repairs:
                    type: object
                    properties:
                      pending: { type: integer }
                      inProgress: { type: integer }
                      latest:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            location: { type: string }
                            equipment: { type: string }
                            status: { type: string }
                            urgency: { type: string }
                            createdAt: { type: string, format: date-time }
                  generatedAt: { type: string, format: date-time }
        '403':
          description: 學生／家長看不到（這頁是本班行政視角），或老師帶了別班
        '422':
          description: 帳號還沒有班級資料（CLASS 未設定）

  /teacher/class/attendance:
    get:
      tags: [school]
      summary: 本班出席率月報（班主任，班級由帳號決定）
      description: |
        班主任每天要回答家長「我這個月出席幾天」，不必為了看本班一行數字去後台翻全校月報。

        口徑與 `GET /admin/school/attendance/monthly` **同一份聚合**（`lib/attendance-monthly`）：
        出席率＝1 − 缺席 ÷ 有紀錄的人日；**遲到算出席**、**請假不算缺席**；沒有紀錄回 `null`（畫面顯示「—」），
        **不回 0%**。班級一律由後端從 `User.className` 決定，老師帶別班 403、沒班級 422。
        能力：`leave:review`（老師與校內職員）；學生與家長 403。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: 留空＝這個月（澳門時區） }
        - { name: yearTerm, in: query, schema: { type: string, maxLength: 16 }, description: 例 2026/2027；留空＝不分學年 }
        - { name: className, in: query, schema: { type: string, maxLength: 32 }, description: 留空＝自己那一班（只有管理員以上可以指定別班） }
      responses:
        '200':
          description: 本班本月的人日統計、每日明細與缺席最多的三天
          content:
            application/json:
              schema:
                type: object
                properties:
                  className: { type: string }
                  grade: { type: string }
                  role: { type: string }
                  month: { type: string, description: 'YYYY-MM' }
                  yearTerm: { type: string, nullable: true }
                  range: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } } }
                  days: { type: integer, description: 該月天數 }
                  activeDays: { type: integer, description: 有出缺席紀錄的天數 }
                  students: { type: integer, description: 本月有紀錄的學生數 }
                  summary:
                    type: object
                    properties:
                      records: { type: integer, description: 人日（一天一人算一筆） }
                      present: { type: integer }
                      late: { type: integer, description: 遲到仍算出席 }
                      absent: { type: integer }
                      leave: { type: integer, description: 請假不算缺席 }
                      rate: { type: number, nullable: true, description: 一位小數；沒有紀錄時是 null }
                  byDay:
                    type: array
                    description: 只含有紀錄的日子（整月空白日不回）
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        day: { type: integer }
                        records: { type: integer }
                        late: { type: integer }
                        absent: { type: integer }
                        rate: { type: number, nullable: true }
                  worstDays:
                    type: array
                    description: 缺席最多的三天（最多 3 筆，只含有缺席的日子）
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        day: { type: integer }
                        absent: { type: integer }
                        records: { type: integer }
                        rate: { type: number, nullable: true }
                  truncated: { type: boolean, description: 超過 4 萬筆人日上限時為 true }
        '403':
          description: 學生／家長看不到，或老師帶了別班
        '422':
          description: 帳號還沒有班級資料，或月份格式不是 YYYY-MM

  /homework/{id}/pending:
    get:
      tags: [homework]
      summary: 某一項功課的未交名單（老師）
      description: 只回暱稱與 id（不回帳號）；封禁帳號不計入。清單一次幾十項，每項都帶名單會變幾百筆，所以名單獨立一支、點下去才抓。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 班上人數、已交數與未交名單
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  className: { type: string }
                  total: { type: integer }
                  done: { type: integer }
                  pending:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        nickname: { type: string }
        '403':
          description: 不是老師
        '404':
          description: 找不到這項功課（含已收回）

  /parents/me/children/{studentId}/homework:
    get:
      tags: [parent, homework]
      summary: 家長看子女這一班的功課（唯讀）
      description: 只用 parent_links 反查，不接受前端傳班級；打勾狀態是子女自己打的，家長只看不改。未綁定與「這個人不存在」回同一句 403（防學號探測）。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 子女班級的功課清單與統計
          content:
            application/json:
              schema:
                type: object
                properties:
                  className: { type: string }
                  studentName: { type: string }
                  needsClass: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        subject: { type: string }
                        title: { type: string }
                        detail: { type: string }
                        links:
                          type: array
                          description: "附件連結（W-84）：只收 http(s)、上限 5 條；name 可空，前端沒名稱時顯示「附件 N」"
                          items:
                            type: object
                            properties:
                              name: { type: string, maxLength: 60 }
                              url: { type: string, maxLength: 300 }
                        dueAt: { type: string, format: date-time }
                        dueMs: { type: integer }
                        done: { type: boolean }
                        doneAt: { type: string }
                        overdue: { type: boolean }
                  stats:
                    type: object
                    properties:
                      total: { type: integer }
                      done: { type: integer }
                      todo: { type: integer }
                      overdue: { type: integer }
        '403':
          description: 沒有綁定這位學生（與「不存在」同一句）

  /admin/homework:
    get:
      tags: [admin, homework]
      summary: "後台功課一覽（跨班，需要 homework:manage）"
      description: "校務處／資訊管理員視角 —— 每個班幾項功課、每項完成率、已過期幾項。只回數字不回姓名（要名單請打 /homework/{id}/pending）。完成率的分母是「這一班有幾個帳號」，班上還沒有人註冊時 rate 回 null（不要顯示成 0%）。"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: className, in: query, schema: { type: string, maxLength: 32 }, description: 留空＝全部班級 }
        - { name: scope, in: query, schema: { type: string, enum: [all, open, overdue], default: all }, description: "all＝全部、open＝還沒到期、overdue＝已過期" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 300, default: 120 } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 7 }, description: "完成率趨勢要看幾天（W-84）；按「派功課那天」分組，不是按截止日" }
      responses:
        '200':
          description: 每班統計、功課清單與完成率趨勢
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { type: string }
                  className: { type: string }
                  classNames: { type: array, items: { type: string }, description: 篩選用的班級清單 }
                  counts:
                    type: object
                    properties:
                      classes: { type: integer }
                      items: { type: integer }
                      overdue: { type: integer }
                  classes:
                    type: array
                    items:
                      type: object
                      properties:
                        className: { type: string }
                        items: { type: integer }
                        overdue: { type: integer }
                        done: { type: integer }
                        total: { type: integer }
                        students: { type: integer }
                        rate: { type: integer, nullable: true }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        className: { type: string }
                        subject: { type: string }
                        title: { type: string }
                        links:
                          type: array
                          description: 附件連結（W-84）
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              url: { type: string }
                        dueAt: { type: string, format: date-time }
                        done: { type: integer }
                        total: { type: integer }
                        rate: { type: integer, nullable: true }
                        overdue: { type: boolean }
                        createdByName: { type: string }
                        mine: { type: boolean }
                        version: { type: integer }
                  trend:
                    type: object
                    description: "完成率趨勢（W-84）：按「派功課那天」分組；分母是「當天派了幾項 × 班上幾人」，沒有資料的那天 rate 為 null、average 也為 null（不要顯示 0%）"
                    properties:
                      days: { type: integer }
                      local:
                        type: object
                        properties:
                          from: { type: string, example: '2026-11-01' }
                          to: { type: string, example: '2026-11-07' }
                      average: { type: integer, nullable: true, description: 整個窗口的加權完成率 }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            date: { type: string, example: '2026-11-07' }
                            label: { type: string, example: '11/7' }
                            items: { type: integer, description: 那天派了幾項功課 }
                            done: { type: integer }
                            total: { type: integer, description: 項目數 × 班上人數 }
                            rate: { type: integer, nullable: true }
        '403': { description: "能力不足（老師只有 homework:create，看不到全校）" }

  /admin/demo-data:
    get:
      tags: [admin, demo]
      summary: 目前有多少示範資料（system:config，只有最高權限）
      description: "後台「示範資料」分頁上方三個數字：示範場地／器材、示範館藏、示範課表格數，以及課表用了哪些班級。數字一律由後端算，前端不要用「我剛按了幾次」推。"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 示範資料統計
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    properties:
                      venues: { type: integer }
                      books: { type: integer }
                      timetableSlots: { type: integer }
                  classes:
                    type: array
                    description: 有示範課表的班級
                    items: { type: string }
        '403': { description: "能力不足（system:config 只有最高權限）" }
    post:
      tags: [admin, demo]
      summary: 示範資料一鍵匯入／清除（system:config，只有最高權限）
      description: "給老師演示用的真資料：寫進資料庫後前台（場地借用／圖書館／班級課表）真的讀得到，不是前端寫死的假資料。`SEED` 是幂等的（同名／同書號的示範資料會更新、不重複新增），遇到**非示範**的同名資料會跳過並在 `skipped` 回報、絕不覆蓋；`CLEAR` 只刪 `demo = true` 的那批，真實資料一筆不動。寫入與清除都會寫一筆審計紀錄。"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, action]
              properties:
                kind: { type: string, enum: [venues, library, timetable, all], description: "venues＝場地與器材、library＝館藏、timetable＝班級課表、all＝三種一起" }
                action: { type: string, enum: [SEED, CLEAR] }
                className: { type: string, maxLength: 32, description: "課表班級；留空＝管理者自己的班級，再沒有就用示範班級" }
      responses:
        '200':
          description: 這次匯入／清除了什麼
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  kind: { type: string }
                  action: { type: string }
                  className: { type: string }
                  seeded:
                    type: object
                    properties:
                      venues: { type: integer }
                      books: { type: integer }
                      timetableSlots: { type: integer }
                  cleared:
                    type: object
                    properties:
                      venues: { type: integer }
                      books: { type: integer }
                      timetableSlots: { type: integer }
                      bookings: { type: integer, description: 跟著示範場地一起刪掉的借用申請 }
                      loans: { type: integer, description: 跟著示範館藏一起刪掉的借閱紀錄 }
                  skipped:
                    type: object
                    description: 因為已有非示範的同名資料而沒寫入的筆數
                    properties:
                      venues: { type: integer }
                      books: { type: integer }
                      timetableSlots: { type: integer }
        '403': { description: "能力不足（system:config 只有最高權限）" }

  /admin/timetable:
    get:
      tags: [admin]
      summary: 全部班級課表（timetable:manage）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 每個班幾格＋全部格子＋節次
          content:
            application/json:
              schema:
                type: object
                properties:
                  classes:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        slots: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/TimetableSlot' } }
        '403': { description: 能力不足 }
    post:
      tags: [admin]
      summary: 新增／覆蓋一格（同一班同一節再送一次就是改那一格）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [className, weekday, period, subject]
              properties:
                className: { type: string, maxLength: 32 }
                weekday: { type: integer, minimum: 1, maximum: 5 }
                period: { type: integer, minimum: 1, maximum: 8 }
                subject: { type: string, maxLength: 40 }
                teacherName: { type: string, maxLength: 40 }
                room: { type: string, maxLength: 40 }
      responses:
        '201': { description: 已寫入 }
        '403': { description: 能力不足 }
        '422': { description: 欄位驗證失敗 }

  /admin/timetable/{id}:
    delete:
      tags: [admin]
      summary: 刪除一格課表（timetable:manage）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已刪除 }
        '403': { description: 能力不足 }
        '404': { description: 找不到這一格 }

  /admin/timetable/import:
    post:
      tags: [admin]
      summary: CSV 匯入（預設 dryRun：先檢查再寫入）
      description: |
        `班級,星期,節次,科目,老師,課室`；星期可寫 1–5 或 一–五，節次 1–8。
        已存在的格子回 `EXISTS`（不覆蓋）、同一份檔案裡重複回 `DUPLICATE`、
        格式錯的列放進 `errors` 並帶行號。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string, maxLength: 20000 }
                dryRun: { type: boolean, default: true }
      responses:
        '200':
          description: 逐列結果（ok／created／errors／rows）
        '403': { description: 能力不足 }
        '422': { description: CSV 空白或太長 }

  # ── W-88 校園提案與連署 ──────────────────────────────────────────────
  /proposals:
    get:
      tags: [proposals]
      summary: 提案清單（訪客可看；票數由後端算）
      description: 已刪除的提案一律不出現。counts 是各狀態件數（ALL 為總數），goal 是新提案的預設門檻。
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ALL, OPEN, REVIEWING, PLANNED, DONE, DECLINED], default: ALL } }
        - { name: category, in: query, schema: { type: string, enum: [FACILITY, STUDY, ACTIVITY, CANTEEN, OTHER] } }
        - { name: q, in: query, schema: { type: string, maxLength: 60 }, description: 比對標題與內容 }
        - { name: sort, in: query, schema: { type: string, enum: [new, support], default: new } }
        - { name: scope, in: query, schema: { type: string, enum: [all, mine, supported], default: all }, description: supported 是「我連署過的」；未登入時 mine 與 supported 回空清單 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: 清單與統計
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  goal: { type: integer, example: 20 }
                  counts:
                    type: object
                    properties:
                      OPEN: { type: integer }
                      REVIEWING: { type: integer }
                      PLANNED: { type: integer }
                      DONE: { type: integer }
                      DECLINED: { type: integer }
                      ALL: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Proposal' }
    post:
      tags: [proposals]
      summary: 提出建議（作者自動算第一位連署人）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string, minLength: 4, maxLength: 80 }
                body: { type: string, minLength: 10, maxLength: 2000 }
                category: { type: string, enum: [FACILITY, STUDY, ACTIVITY, CANTEEN, OTHER], default: OTHER }
      responses:
        '201':
          description: 已建立（supportCount 從 1 起算）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '401': { description: 未登入 }
        '403': { description: 家長沒有權限提出建議 }
        '422': { description: 標題或內容太短 }

  /proposals/{id}:
    get:
      tags: [proposals]
      summary: 提案詳情（含回覆、前 12 位連署人與我的權限旗標）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 詳情
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Proposal' }
                  - type: object
                    properties:
                      body: { type: string }
                      reply:
                        type: object
                        nullable: true
                        properties:
                          body: { type: string }
                          byName: { type: string, nullable: true }
                          at: { type: string, format: date-time }
                      supporters:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            nickname: { type: string }
                            role: { type: string }
                      canEdit: { type: boolean, description: 作者且狀態仍是 OPEN }
                      canReply: { type: boolean, description: "需要 proposal:reply（校內職員以上）" }
                      canModerate: { type: boolean }
        '404': { description: 找不到或已撤回 }
    patch:
      tags: [proposals]
      summary: 作者改內容（只有 OPEN；帶 version 防覆蓋）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 4, maxLength: 80 }
                body: { type: string, minLength: 10, maxLength: 2000 }
                category: { type: string, enum: [FACILITY, STUDY, ACTIVITY, CANTEEN, OTHER] }
                version: { type: integer, minimum: 0, description: 選填；不帶就照舊成功並遞增 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '403': { description: 不是提案人 }
        '404': { description: 找不到 }
        '409': { description: 版本不符或校方已開始處理 }
    delete:
      tags: [proposals]
      summary: 撤回／下架（軟刪除，回收桶救得回來）
      description: "作者只能在狀態仍是 OPEN 時撤回；校方（proposal:moderate）任何狀態都可以下架。"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 已刪除
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  deleted: { type: boolean }
                  id: { type: string }
        '403': { description: 不是提案人也不是校方 }
        '404': { description: 找不到 }
        '409': { description: 校方已開始處理，作者不能撤回 }

  /proposals/{id}/support:
    post:
      tags: [proposals]
      summary: 連署（一人一票；重複按回 already 為 true，不加票）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 目前票數
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  already: { type: boolean, description: 之前已經連署過（這次沒有加票） }
                  supportCount: { type: integer }
                  goal: { type: integer }
                  reached: { type: boolean }
        '401': { description: 未登入 }
        '403': { description: 家長沒有連署權限 }
        '404': { description: 找不到 }
        '409': { description: 提案已結案（DONE 或 DECLINED）不能再連署 }
    delete:
      tags: [proposals]
      summary: 取消連署（提案人不能取消自己那一票）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 目前票數
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  supportCount: { type: integer }
                  goal: { type: integer }
                  reached: { type: boolean }
        '403': { description: 家長沒有連署權限 }
        '404': { description: 找不到 }
        '422': { description: 提案人不能取消自己的連署 }

  /proposals/{id}/supports:
    get:
      tags: [proposals]
      summary: 完整連署名單（分頁；詳情只帶前 12 位）
      description: 依連署時間由早到晚（與詳情同一順序，同一毫秒時以 userId 排）；訪客也讀得到。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: 一頁名單
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposalId: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        nickname: { type: string, nullable: true }
                        role: { type: string }
                        grade: { type: string, nullable: true }
                        className: { type: string, nullable: true }
                        at: { type: string, format: date-time }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  hasMore: { type: boolean }
                  supportCount: { type: integer }
                  goal: { type: integer }
        '404': { description: 找不到（含已下架） }
        '422': { description: page／limit 超出範圍 }

  /admin/proposals:
    get:
      tags: [admin, proposals]
      summary: 後台提案清單與統計（校內職員以上）
      description: counts／categories／stats 都由後端算，前端不要自己再加總。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ALL, OPEN, REVIEWING, PLANNED, DONE, DECLINED], default: ALL } }
        - { name: category, in: query, schema: { type: string, enum: [FACILITY, STUDY, ACTIVITY, CANTEEN, OTHER] } }
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: 清單與統計
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Proposal' }
                  counts:
                    type: object
                    properties:
                      OPEN: { type: integer }
                      REVIEWING: { type: integer }
                      PLANNED: { type: integer }
                      DONE: { type: integer }
                      DECLINED: { type: integer }
                      ALL: { type: integer }
                  categories:
                    type: object
                    properties:
                      FACILITY: { type: integer }
                      STUDY: { type: integer }
                      ACTIVITY: { type: integer }
                      CANTEEN: { type: integer }
                      OTHER: { type: integer }
                  stats:
                    type: object
                    properties:
                      proposals: { type: integer }
                      supports: { type: integer, description: 連署人次的總和 }
                      reached: { type: integer, description: 已達門檻的提案數 }
        '403': { description: 老師與學生沒有提案回覆權限 }

  /admin/proposals/{id}:
    get:
      tags: [admin, proposals]
      summary: 單一提案（含回覆內容，供後台編輯）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 詳情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '403': { description: 權限不足 }
        '404': { description: 找不到 }

  /admin/proposals/{id}/reply:
    post:
      tags: [admin, proposals]
      summary: 回覆並改狀態（通知提案人與所有連署人）
      description: 不帶 status 時，OPEN 會自動變 REVIEWING；其他狀態原樣保留。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply]
              properties:
                reply: { type: string, minLength: 2, maxLength: 2000 }
                status: { type: string, enum: [OPEN, REVIEWING, PLANNED, DONE, DECLINED] }
      responses:
        '200':
          description: 已回覆（notified 是實際送出通知的人數）
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Proposal' }
                  - type: object
                    properties:
                      notified: { type: integer, example: 6 }
        '403': { description: 權限不足 }
        '404': { description: 找不到 }
        '422': { description: 回覆太短 }

  /repairs:
    post:
      tags: [repairs]
      summary: 送出課室設備報修（學生／老師／職員）
      description: |
        送出後會以站內通知通知所有總務與管理員；報修人自己也會在「我的報修」看到這一筆。
        照片目前只收 http(s) 連結（COS 直傳未接）。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location, equipment, description]
              properties:
                location: { type: string, minLength: 1, maxLength: 60, example: 304 室 }
                equipment: { type: string, minLength: 1, maxLength: 40, example: 冷氣 }
                description: { type: string, minLength: 4, maxLength: 500, example: 出風口滴水，滴到第二排的桌上 }
                urgency: { type: string, enum: [LOW, NORMAL, HIGH], default: NORMAL }
                photoUrl: { type: string, maxLength: 512 }
      responses:
        '201':
          description: 已送出
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair: { $ref: '#/components/schemas/Repair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 家長或訪客不能報修 }
        '422': { description: 欄位不完整或照片不是 http(s) }

  /repairs/mine:
    get:
      tags: [repairs]
      summary: 我的報修（含進行中與已完成數量）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Repair' }
                  active: { type: integer }
                  done: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /repairs/{id}:
    get:
      tags: [repairs]
      summary: 單張報修（報修人或總務）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair: { $ref: '#/components/schemas/Repair' }
        '403': { description: 不是報修人也不是總務 }
        '404': { description: 找不到 }
    delete:
      tags: [repairs]
      summary: 取消自己的報修（只有待接單時）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已取消 }
        '403': { description: 只能取消自己送的 }
        '409': { description: 已被接單或已處理 }

  /admin/repairs:
    get:
      tags: [admin, repairs]
      summary: 報修清單（總務／校務處）
      description: |
        待接單預設按急迫度（HIGH 先）再按送出時間排序；其他狀態按更新時間。
        counts 是各狀態筆數。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, IN_PROGRESS, DONE, CANCELLED, ALL], default: PENDING } }
        - { name: location, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Repair' }
                  total: { type: integer }
                  page: { type: integer }
                  counts:
                    type: object
                    properties:
                      PENDING: { type: integer }
                      IN_PROGRESS: { type: integer }
                      DONE: { type: integer }
                      CANCELLED: { type: integer }
        '403': { description: '沒有 repair:handle 權限' }

  /admin/repairs/{id}/accept:
    post:
      tags: [admin, repairs]
      summary: 接單（條件式更新，誰先按誰拿到）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 已接單
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair: { $ref: '#/components/schemas/Repair' }
        '404': { description: 找不到 }
        '409': { description: 已被其他同事接走或已被送出者取消 }

  /admin/repairs/{id}/done:
    post:
      tags: [admin, repairs]
      summary: 標記完成（可寫處理備註）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 300, example: 換了排水管，已測試 }
      responses:
        '200':
          description: 已完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair: { $ref: '#/components/schemas/Repair' }
        '404': { description: 找不到 }
        '409': { description: 還沒有人接單或已處理 }

  /admin/repairs/stats:
    get:
      tags: [admin, repairs]
      summary: 報修統計（狀態、平均處理時數、近 7 天、熱門地點）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  counts:
                    type: object
                    properties:
                      PENDING: { type: integer }
                      IN_PROGRESS: { type: integer }
                      DONE: { type: integer }
                      CANCELLED: { type: integer }
                  avgHours: { type: number, nullable: true, description: 平均完成時數（回報 → 按完成） }
                  avgAcceptHours: { type: number, nullable: true, description: 平均接單時數（回報 → 總務按接單）；沒人接單時為 null }
                  acceptedCount: { type: integer, description: 已接單筆數（含已完成的） }
                  doneCount: { type: integer }
                  byLocation:
                    type: array
                    items:
                      type: object
                      properties:
                        location: { type: string }
                        count: { type: integer }
                  timeline:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, example: '2026-11-06' }
                        label: { type: string, example: '11-06' }
                        count: { type: integer }
        '403': { description: 權限不足 }

  /admin/approvals/stats:
    get:
      tags: [admin]
      summary: 審批時效（假單／場地器材／報修同一把尺：件數、待審、中位與平均時數）
      description: >-
        窗口是「送出時間」（`createdAt`）落在最近 `days` 天，不是審批時間 ——
        「這一週送來的單我們處理得多快」才是校方要看的。
        樣本只算已批准（`APPROVED`；報修是已接單），已取消與已駁回不進時效但仍計入 `counts`。
        時數單位是小時、一位小數，百分位用 nearest-rank（固定落在真實樣本上）。
        沒有樣本回 `null` 而不是 0（0 小時的意思是「立刻處理完」）。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 7, maximum: 365, default: 30 }
          description: 往前看幾天送出的單；亂填或超出範圍回 422
      responses:
        '200':
          description: 三組時效
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: { type: integer }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, enum: [leave, booking, repair] }
                        counts:
                          type: object
                          description: 'leave 與 booking 是 total/pending/approved/rejected/cancelled；repair 是 total/pending/inProgress/done/cancelled'
                        hours:
                          type: object
                          description: '樣本數與時數（leave 與 booking 是送出到批准；repair 是送出到接單）'
                          properties:
                            samples: { type: integer }
                            p50: { type: number, nullable: true }
                            p90: { type: number, nullable: true }
                            avg: { type: number, nullable: true }
                        doneHours:
                          type: object
                          description: '只有 repair 有（送出到完成，只算 DONE）'
                          properties:
                            samples: { type: integer }
                            p50: { type: number, nullable: true }
                            p90: { type: number, nullable: true }
                            avg: { type: number, nullable: true }
        '403': { description: '權限不足（stats:read 是資訊管理員以上）' }
        '422': { description: '參數不合法（days 必須 7–365）' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: 未認證
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: 欄位驗證失敗
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 觸發限流
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Proposal:
      type: object
      description: 一個校園提案（W-88）。supportCount 與 goal 一起看才有意義；reached 代表是否已達門檻。
      properties:
        id: { type: string }
        title: { type: string, example: 圖書館段考前延長開放時間 }
        category: { type: string, enum: [FACILITY, STUDY, ACTIVITY, CANTEEN, OTHER] }
        status: { type: string, enum: [OPEN, REVIEWING, PLANNED, DONE, DECLINED] }
        supportCount: { type: integer, example: 6 }
        goal: { type: integer, example: 20 }
        reached: { type: boolean }
        reachedAt: { type: string, format: date-time, nullable: true }
        repliedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        isMine: { type: boolean }
        mySupported: { type: boolean }
        version: { type: integer }
        author:
          type: object
          nullable: true
          properties:
            id: { type: string }
            nickname: { type: string, nullable: true }
            grade: { type: string, nullable: true }
            className: { type: string, nullable: true }
    Repair:
      type: object
      description: 一張課室設備報修單（W-89）。status 走 PENDING→IN_PROGRESS→DONE，送出者可在 PENDING 時取消。
      properties:
        id: { type: string }
        location: { type: string, example: 304 室 }
        equipment: { type: string, example: 冷氣 }
        description: { type: string, example: 出風口滴水，滴到第二排的桌上 }
        urgency: { type: string, enum: [LOW, NORMAL, HIGH] }
        urgencyText: { type: string, example: 急 }
        status: { type: string, enum: [PENDING, IN_PROGRESS, DONE, CANCELLED] }
        statusText: { type: string, example: 待接單 }
        photoUrl: { type: string, nullable: true }
        note: { type: string, nullable: true, description: 處理備註（完成時可寫） }
        reporter:
          type: object
          nullable: true
          properties:
            id: { type: string }
            nickname: { type: string, nullable: true }
            grade: { type: string, nullable: true }
            className: { type: string, nullable: true }
        handler:
          type: object
          nullable: true
          properties:
            id: { type: string }
            nickname: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        hours: { type: number, nullable: true, description: 送出到完成的實際時數（只有已完成才有） }
    ResourceBooking:
      type: object
      description: 一筆場地／器材借用申請（W-67）
      properties:
        id: { type: string }
        resourceId: { type: string }
        resource:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
            kind: { type: string, enum: [VENUE, EQUIPMENT] }
            location: { type: string, nullable: true }
        userId: { type: string }
        user:
          type: object
          nullable: true
          description: 只回暱稱，不回 openid
          properties:
            id: { type: string }
            nickname: { type: string, nullable: true }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        dateText: { type: string, description: '澳門時間 YYYY-MM-DD，前端直接顯示' }
        timeText: { type: string, description: '例 10:00–12:00' }
        purpose: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED] }
        rejectReason: { type: string, nullable: true }
        past: { type: boolean, description: 時段已過 }

    GiveawayItem:
      type: object
      description: 一件轉贈物品（W-68）。contactName／contactValue 只對物主、被接受的申請人、職員有值，其他情況為 null
      properties:
        id: { type: string }
        kind: { type: string, enum: [BOOK, UNIFORM, OTHER] }
        kindLabel: { type: string, description: 例 書籍／校服／其他 }
        title: { type: string }
        body: { type: string, nullable: true, description: 物品狀況／為什麼送出 }
        condition: { type: string, enum: [LIKE_NEW, GOOD, FAIR] }
        conditionLabel: { type: string, description: 例 幾乎全新／良好／可用 }
        detail: { type: string, nullable: true, description: 細節，例 第 3 冊 }
        pickupPlace: { type: string, nullable: true, description: 面交地點 }
        imageUrl: { type: string, nullable: true }
        status: { type: string, enum: [AVAILABLE, GIVEN, CLOSED] }
        statusLabel: { type: string, description: 例 可申請／已贈出／已下架 }
        version: { type: integer, description: 樂觀鎖版本；PATCH 時原樣帶回 }
        ownerId: { type: string }
        ownerNickname: { type: string, description: 沒有暱稱時回「同學」 }
        ownerClass: { type: string, nullable: true, description: 例 初二 甲 }
        contactName: { type: string, nullable: true }
        contactValue: { type: string, nullable: true }
        requestCount: { type: integer, description: 索取申請總數 }
        pendingCount: { type: integer, description: 待審申請數 }
        myRequest:
          type: object
          nullable: true
          description: 我對這件物品的申請（沒有或未登入為 null）
          properties:
            id: { type: string }
            status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, CANCELLED] }
            createdAt: { type: string, format: date-time }
        givenAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }

    GiveawayRequestSummary:
      type: object
      description: 一筆索取申請（W-68）。物主在詳情頁看到的列有申請人資料；「我申請的」列表則帶 item 摘要
      properties:
        id: { type: string }
        userId: { type: string, description: 申請人（只在物主／職員視角出現） }
        nickname: { type: string, nullable: true, description: 申請人暱稱；沒有時回「同學」 }
        className: { type: string, nullable: true, description: 申請人班級，例 初二 甲 }
        message: { type: string, nullable: true, description: 申請時給物主的話 }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, CANCELLED] }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true, description: 物主決定的時間 }
        item:
          type: object
          description: 申請的物品摘要（只在 /giveaways/mine 的 requests 出現）
          properties:
            id: { type: string }
            kind: { type: string, enum: [BOOK, UNIFORM, OTHER] }
            kindLabel: { type: string }
            title: { type: string }
            detail: { type: string, nullable: true }
            status: { type: string, enum: [AVAILABLE, GIVEN, CLOSED] }
            ownerNickname: { type: string }

    SearchHit:
      type: object
      description: 搜尋結果的一列（公告／活動／失物／轉贈／菜單／功課／提案／館藏／場地器材共用）
      properties:
        id: { type: string, description: 功課＝功課 id（前端跳清單頁）、提案＝提案 id、館藏＝書 id、場地器材＝資源 id }
        type: { type: string, enum: [notice, event, item, giveaway, menu, homework, proposal, book, resource] }
        title: { type: string }
        snippet: { type: string, description: 命中處前後各約 30 字的摘要；沒有內文時退回地點 }
        badge:
          type: string
          nullable: true
          description: '公告＝kind（NORMAL／URGENT／CALENDAR）；活動＝status；失物＝「type:status」（LOST:OPEN）；轉贈＝kind；菜單＝餐別；功課＝科目；提案＝「category:status」（FACILITY:OPEN）；館藏＝AVAILABLE／OUT（借完仍回）；場地器材＝「kind:status」（VENUE:ACTIVE）'
        date: { type: string, format: date-time, description: 公告＝發佈時間、活動＝開始時間、失物＝遺失／拾獲時間、功課＝截止時間、提案＝提出時間、館藏／場地＝建立時間 }
        score: { type: integer, description: 標題命中 2、只有內文命中 1 }
        className: { type: string, description: 功課專用：班級（後端依 JWT 決定，前端不能指定別班） }
        supportCount: { type: integer, description: 提案專用：連署數 }
        goal: { type: integer, description: 提案專用：連署門檻 }
        available: { type: integer, description: 館藏專用：可借冊數 }
        total: { type: integer, description: 館藏專用：總冊數 }
        location: { type: string, description: 場地器材專用：位置（例「三樓」「器材室 A」） }

    ErrorLog:
      type: object
      properties:
        id: { type: string }
        message: { type: string, description: 錯誤訊息（截到 300 字） }
        stack: { type: string, nullable: true }
        route: { type: string, nullable: true, description: 出錯的頁面路徑 }
        platform: { type: string, nullable: true }
        sdkVersion: { type: string, nullable: true }
        appVersion: { type: string, nullable: true }
        kind: { type: string, enum: [CLIENT_ERROR, USER_REPORT], description: 自動上報 or 使用者手動回報（W-43） }
        level: { type: string, enum: [ERROR, WARN] }
        model: { type: string, nullable: true, description: 機型（使用者回報時才有） }
        system: { type: string, nullable: true, description: 系統版本（使用者回報時才有） }
        userId: { type: string, nullable: true, description: 有 JWT 才有；匿名上報為 null }
        count: { type: integer, description: 出現次數（列表排序依據） }
        status: { type: string, enum: [OPEN, RESOLVED] }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        # 同類筆數＝訊息相同的紀錄數（不限頁面）；後台用它顯示「同類 N 筆」與一次解決
        similar: { type: integer }

    EventCheckinState:
      type: object
      properties:
        eventId: { type: string }
        title: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, FINISHED] }
        active: { type: boolean }
        code: { type: string, nullable: true, description: 6 位簽到碼（未開放時為 null） }
        openedAt: { type: string, format: date-time, nullable: true }
        qrDataUrl: { type: string, nullable: true, description: 'PNG data URL（小程序 image 直接顯示）' }
        signed: { type: integer }
        checkedIn: { type: integer }
        rate: { type: number, nullable: true }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, VALIDATION_FAILED, EVENT_FULL,
                 ALREADY_SIGNED_UP, ALREADY_CLAIMED, CONTENT_RISKY, RATE_LIMITED]
            message: { type: string }
            details: { type: object, nullable: true }

    Page:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        hasMore: { type: boolean }

    User:
      type: object
      properties:
        id: { type: string }
        nickname: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        role: { type: string, enum: [STUDENT, TEACHER, ADMIN] }
        grade: { type: string, nullable: true }
        className: { type: string, nullable: true }

    TimetableSlot:
      type: object
      description: 課表的一格（W-73）。timeText 由後端用節次表組好，前端不再拼時間
      nullable: true
      properties:
        id: { type: string }
        className: { type: string, example: 高二仁 }
        weekday: { type: integer, minimum: 1, maximum: 5 }
        period: { type: integer, minimum: 1, maximum: 8 }
        subject: { type: string, example: 數學 }
        teacherName: { type: string, nullable: true }
        room: { type: string, nullable: true, example: '302' }
        timeText: { type: string, example: '09:45–10:25' }

    LeaveRequest:
      type: object
      description: 一張假單（W-72）。日期只到天，dateText／days 由後端算好，前端不重算時區
      properties:
        id: { type: string }
        studentId: { type: string }
        student:
          type: object
          nullable: true
          properties:
            id: { type: string }
            nickname: { type: string, nullable: true }
            grade: { type: string, nullable: true }
            className: { type: string, nullable: true }
        createdById: { type: string, description: 送出者（家長代請假時與學生不同人） }
        source: { type: string, enum: [STUDENT, PARENT], description: '誰送出的（W-99）：STUDENT 學生本人、PARENT 家長代送。由 createdById 與 studentId 比對算出，不另存欄位' }
        sourceText: { type: string, example: 家長代送 }
        kind: { type: string, enum: [SICK, PERSONAL, OFFICIAL] }
        kindText: { type: string, example: 病假 }
        from: { type: string, example: '2026-11-12' }
        to: { type: string, example: '2026-11-13' }
        dateText: { type: string, example: '2026/11/12–11/13' }
        days: { type: integer, example: 2 }
        reason: { type: string }
        attachmentUrl: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED] }
        statusText: { type: string, example: 待審批 }
        rejectReason: { type: string, nullable: true }
        reviewedAt: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        canCancel: { type: boolean, description: 只有待審批才是 true }

    LostItemInput:
      type: object
      required: [type, title, place, happenedAt]
      properties:
        type: { type: string, enum: [LOST, FOUND] }
        title: { type: string, maxLength: 80 }
        description: { type: string }
        categoryId: { type: string, nullable: true }
        place: { type: string, maxLength: 120 }
        happenedAt: { type: string, format: date-time }
        contactType: { type: string, enum: [inApp, wechat, phone] }
        contactValue: { type: string, nullable: true }
        images:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              key: { type: string, description: COS 物件 key }
              width: { type: integer }
              height: { type: integer }

    LostItem:
      allOf:
        - $ref: '#/components/schemas/LostItemInput'
        - type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [OPEN, MATCHED, CLAIMED, CLOSED] }
            author: { $ref: '#/components/schemas/User' }
            viewCount: { type: integer }
            claimCount: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    ItemClaim:
      type: object
      properties:
        id: { type: string }
        itemId: { type: string }
        claimantId: { type: string }
        message: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        createdAt: { type: string, format: date-time }
        handledAt: { type: string, format: date-time, nullable: true }

    Event:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        coverImage: { type: string, nullable: true }
        description: { type: string, nullable: true }
        clubId: { type: string, nullable: true }
        location: { type: string, nullable: true }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, nullable: true }
        signupStartAt: { type: string, format: date-time, nullable: true }
        signupEndAt: { type: string, format: date-time, nullable: true, description: 'W-64 報名截止：過了就不能報名（連候補都不收）' }
        signupClosed:
          type: boolean
          description: 'W-64 後端算好的「已截止」旗標，前端只顯示不重算'
        capacity: { type: integer, description: '0 = 不限' }
        signedCount: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, FINISHED] }
        version:
          type: integer
          description: 'W-42 編輯衝突保護：每次成功修改 +1，PATCH 時帶回讀到的值'

    EventSignup:
      type: object
      properties:
        id: { type: string }
        eventId: { type: string }
        userId: { type: string }
        status: { type: string, enum: [CONFIRMED, WAITLIST, CANCELLED] }
        waitlistPos: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

    EventAttachment:
      type: object
      description: 'W-38 活動附件：只存位址（COS 直傳後的 URL 或老師貼的連結）'
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        size: { type: integer, nullable: true, description: 檔案大小 bytes；貼連結時為 null }
        type: { type: string, nullable: true, enum: [pdf, doc, docx, xls, xlsx, ppt, pptx, zip, ics, link] }
        createdAt: { type: string, format: date-time }

    MenuDish:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        mealType: { type: string, enum: [LUNCH, SNACK] }
        price: { type: number, nullable: true }
        image: { type: string, nullable: true }
        description: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        soldOut: { type: boolean }
        avgScore: { type: number, format: float }
        ratingCount: { type: integer }
        likedCount: { type: integer }

    Notice:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        content: { type: string }
        kind: { type: string, enum: [NORMAL, URGENT, CALENDAR] }
        isPinned: { type: boolean }
        coverImage: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time }
        scheduled:
          type: boolean
          description: 'W-58 後台清單／建立／修改才回：publishedAt 在未來＝排程中（前台看不到）'
        expiresAt: { type: string, format: date-time, nullable: true }
        version:
          type: integer
          description: 'W-42 編輯衝突保護：每次成功修改 +1，PATCH 時帶回讀到的值'
